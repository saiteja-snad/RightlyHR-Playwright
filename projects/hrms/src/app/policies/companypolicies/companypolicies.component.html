    </div>

    <span class="me-2">Select year:</span>
    <form [formGroup]="policiesform" class="m-0">
      
      <p-select formControlName="selectedYear" [options]="years" 
       [style]="{ width: 'auto' }" class="form-select form-select-sm">
      </p-select>
    </form>
  </div>
</div>

    <div class="custom-table-content">
      <table class="w-100">
          <thead>
              <tr>
                <th>Policy Name</th>
                <th>Description</th>
                <th>Attachment</th>

              </tr>
          </thead>
          <tbody>
              <ng-container *ngIf="((orgPolicyItemsArray) ?? []).length > 0; else noDataTemplate">
                  <tr *ngFor="let item of orgPolicyItemsArray">
                    <td>{{item.policyName}}</td>
                    <td>{{item.policyDescription}}</td>
                    <td>
                      <a type="button" class="view-text text-nowrap" (click)="onViewClick(item.policyAttachment)">
                        <i class="bi bi-paperclip"></i>View
                      </a>
                    </td>
                    
                  </tr>
              </ng-container>
              <!-- No Data Found Template -->
              <ng-template #noDataTemplate>
                  <tr>
                      <td>
                          <app-no-data-found />
                      </td>
                  </tr>
              </ng-template>
          </tbody>
      </table>
  </div>

  <ng-template #viewDetailsModal let-modal>
    <div class="custom-main-popup-container">
      <div class="d-flex justify-content-between popup-header-border p-4">
        <div class="pt-2">
          <p class="popup-heading mb-0">Expenses Details</p>
        </div> 
        <div>
          <a (click)="modal.dismiss()"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
        </div>
      </div>

      <div class="custom-table">
        <table class="w-100">
          <tbody>
            <tr *ngFor="let item of orgPolicyItemsArray">
              <td>
                <div class="d-flex gap-2">
                  <a type="button" class="view-text text-nowrap" (click)="onViewClick(item.policyAttachment)">
                    <i class="bi bi-paperclip"></i>View
                  </a>
                </div>
              </td>
            </tr>
          </tbody>

        </table>
      </div>
    </div>
  </ng-template>
  <ng-template #viewattamchment let-modal>
    <div class="custom-main-popup-container">
      <div class="d-flex justify-content-between popup-header-border p-4">
        <div class="pt-2">
          <p class="popup-heading mb-0">Policy Details</p>
        </div>
        <div>
          <a (click)="modal.dismiss(); EduViewURL = null; EduImageUrl = null">
            <img src="icons/close.png" alt="Close Icon" class="close-icon">
          </a>
        </div>
      </div>
      <div class="modal-body" style="text-align: center; overflow-x: auto;">
        <p *ngIf="!EduImageUrl; else imageView">
          <ngx-doc-viewer
            [url]="EduViewURL"
            viewer="google"
            style="width: 100%; height: 80vh; max-width: 100%;">
          </ngx-doc-viewer>
        </p>
      
        <ng-template #imageView>
          <img [src]="EduImageUrl" alt="My Image"
               style="max-width: 100%; height: auto; max-height: 80vh; object-fit: contain;" />
        </ng-template>
      </div>
      
    </div>
  </ng-template>
