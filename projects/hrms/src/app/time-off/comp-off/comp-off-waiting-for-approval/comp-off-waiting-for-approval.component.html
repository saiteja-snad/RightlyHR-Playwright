<div class="custom-main-component-container">
  <div class="custom-table-content ">
    <table class="w-100">
      <thead>
        <tr>
          <th>Worked Date</th>
          <th>Availed</th>
          <!-- <th>Reason</th> -->
          <th>Applied Date</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
      <tbody>
        @if (rbac.allowedToAccess('Compoff Tab.view')) {
        <ng-container *ngIf="waitingForApprovalCompOff!.length > 0; else noDataTemplate">
          <tr *ngFor="let compOffRequest of waitingForApprovalCompOff; let i = index">
            <td>{{ compOffRequest.startTime ? (compOffRequest.startTime | dateformat) : ' -' }}</td>
            <td [ngSwitch]="compOffRequest.durationType">
              <span *ngSwitchCase="1">First Half</span>
              <span *ngSwitchCase="3">Second Half</span>
              <span *ngSwitchCase="2">Full Day</span>
              <span *ngSwitchDefault>-</span>
            </td>
            <td>{{ compOffRequest.requestedDate | dateformat }}</td>
            <td>{{ compOffRequest.status }}</td>
          </tr>
        </ng-container>

        <ng-template #noDataTemplate>
          <tr>
            <td colspan="4">
              <app-no-data-found></app-no-data-found>
            </td>
          </tr>
        </ng-template>
        }
      </tbody>
    </table>
  </div>
</div>
