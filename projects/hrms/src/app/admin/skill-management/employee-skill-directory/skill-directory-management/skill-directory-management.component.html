<div class="custom-main-component-container">
  <div class="component-header-content">
    <div class="heading-content">
      <div class="component-header">Employee Skills Directory</div>
    </div>
  </div>

  <div class="main-content">
    <!-- Search -->
    <div class="input-group custom-search mb-3">
      <span class="input-group-text custom-input-group-search" id="basic-addon1">
        <i class="bi bi-search"></i>
      </span>
      <input type="search" class="form-control custom-search-input" placeholder="Search" />
    </div>

    <!-- Table -->
    <div class="custom-table-content">
      <table class="w-100">
        <thead>
          <tr>
            <th>Employee Name</th>
            <th>Title</th>
            <th>Key Skills</th>
            <th>Current Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Mounika</td>
            <td>Developer</td>
            <td>Angular</td>
            <td>Committed</td>
            <td class="text-center">
              <div class="dropdown">
                <a data-bs-toggle="dropdown" aria-expanded="false">
                  <i class="bi bi-three-dots-vertical"></i>
                </a>
                <ul class="dropdown-menu custom-dropdown-menu">
                  <li>
                    <a class="dropdown-item" (click)="openModal(employeeDetailModal)">
                      <i class="bi bi-eye-fill me-2"></i>View
                    </a>
                  </li>
                </ul>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Popup -->
<ng-template #employeeDetailModal let-modal ngbAutofocus>
  <div class="custom-main-popup-container" ngbAutofocus>
    <div class="custom-main-popup-content">
      <div class="cross-btn">
        <a (click)="closePopup(modal)">
          <img src="icons/close.png" alt="Close Icon" class="close-icon" />
        </a>
      </div>

      <!-- Profile Info -->
      <div class="d-flex justify-content-center text-center align-items-center flex-column">
        <div class="mb-3">
          <img [src]="imageUrl" alt="Profile Image" class="profile-image" />
        </div>
        <div>
          <p class="name mb-2">Mounika (SD302115)</p>
          <p class="department mb-2">Technology - Design</p>
          <p class="job-role mb-2">UI/UX Designer</p>
        </div>
        <div class="commitment-card mb-3">
          <p class="commitment-text">• Committed until Mar 31, 2026</p>
        </div>
      </div>
      <div class="dashed-border my-3"></div>
