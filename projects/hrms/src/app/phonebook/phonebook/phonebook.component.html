<div class="custom-main-component-container">
    <div class="component-header-content pt-2">
        <div class="heading-content">
            <div class="component-header">Phone Book </div>
            <!-- <div>
                <img src="\icons\moduelicon.png" alt="Icon" placement="bottom" [ngbPopover]="popContent"
                    class="module-icon">
            </div> -->
        </div>
    </div>
    <div>
        <div class="input-group custom-search mb-2">
            <span class="input-group-text custom-input-group-search" id="basic-addon1"><i
                    class="bi bi-search"></i></span>
            <input type="search" class="form-control custom-search-input" placeholder="Search here"
                [(ngModel)]="searchphone" aria-label="Username" aria-describedby="basic-addon1">
        </div>
    </div>
    <div class="phone-book-content">
       <div class="cards-container" *ngIf="filteredPhoneDetails().length">
  <div class="phone-book-cards" *ngFor="let emp of filteredPhoneDetails()">
    <!-- use emp.fullName, emp.jobRole, etc. -->
    <div class="d-flex gap-2 mb-1 p-2">
      <div>
        <img [src]="emp.profileUrl" alt="profile" class="profile-icon">
      </div>
      <div>
        <p class="name pt-2 m-0">{{ emp.fullName }}
          <span class="employe-number me-1">({{ emp.employeeId }})</span>
        </p>
      </div>
    </div>
    <div class="sub-content p-3">
      <p class="label-text mb-2">
        <span class="bi bi-person-vcard me-1"></span> 
        <span class="name-text me-1">{{ emp.jobRole }}</span>
      </p>
      <p class="label-text mb-2">
        <span class="bi bi-envelope me-1"></span> 
        <span class="name-text me-1 text-truncate">{{ emp.workEmail }}</span>
      </p>
      <p class="label-text mb-2">
        <span class="bi bi-telephone me-1"></span> Work:
        <span class="number-text me-1">{{ emp.workPhone }}</span>
      </p>
      <p class="label-text mb-2">
        <span class="bi bi-telephone me-1"></span> Personal:
        <span class="number-text me-1">{{ emp.contactNumber }}</span>
      </p>
    </div>
  </div>
</div>


    </div>
