@if(!loading){
<div class="custom-sub-tabs-container">
  <ul class="nav flex-column">
    <li class="nav-item" *ngFor="let tab of filteredTabs">
      <div class="nav-link" [routerLink]="[tab.route]" routerLinkActive="active-nav-link">
        <img [src]="tab.icon" alt="Icon" class="icon mb-2">
        <div class="d-flex gap-1">{{ tab.label }}
          <ng-container *ngIf="tab.label !== 'Entitlement Summary'">
            ({{ tab.count ?? 0 }})
          </ng-container>
        </div>
      </div>
      <div class="tabs-border-bottom"></div>
    </li>
  </ul>
</div>
}
@else {
<app-sidetabsloaders />
}
