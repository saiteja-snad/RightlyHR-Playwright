<div class="custom-main-component-container w-100">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <p class="component-header mb-0" (click)="nagvition()">
          <i class="bi bi-arrow-90deg-left me-2"></i>{{'Add Poilicy'| translate}}
        </p>
      </div>
    </div>
    <form [formGroup]="policiesForm" (ngSubmit)="submit()">
      <div class="custom-setting-right-content w-100 p-3">
        <!--Select Fields-->
        <div class="d-flex gap-3 mt-4">
          <div class="custom-p-select-content">
            <p-select [options]="yearDetails" optionLabel="name" placeholder="Select year" formControlName="year"
              class="form-select custom-select">
            </p-select>
          </div>
          <div class="custom-p-select-content">
            <p-select [options]="jobLocationDropDownData" optionLabel="jobLocationName" optionValue=""
              formControlName="location" placeholder="Select location" class="form-select custom-select"
              (onChange)="getSubLocationByid($event.value)">
            </p-select>
          </div>
          <div class="custom-p-select-content">
            <p-select [options]="subLocationsDropdown" optionLabel="jobSubLocationName" optionValue="id"
              formControlName="subLocation" placeholder="Please select sub location" (onChange)="getShiftBYid($event.value)"
              class="form-select custom-select"></p-select>
          </div>
          <div class="custom-p-select-content">
            <p-select [options]="shiftDropdown" optionLabel="shiftName" optionValue="id" formControlName="shift"
              placeholder="Select shift" class="form-select custom-select"></p-select>
          </div>
          <div>
            <button type="button" class="custom-btn btn-primary" (click)="addPolicyRow()">
              <i class="bi bi-plus"></i>{{'Add New' | translate}} 
            </button>
          </div>
        </div>
        <div class="card custom-background-card p-3 mt-2">
          <div class="row">
            <div class="card custom-background-card p-3 mt-2" formArrayName="policies">
              <div class="row mb-2" *ngFor="let holiday of policies.controls; let i = index" [formGroupName]="i">
  
                <div class="col-md-3">
                  <label class="form-label custom-label">{{'Policy Name' | translate}}<span class="text-danger">*</span></label>
                  <input type="text" formControlName="policyName" class="form-control custom-input"
                    placeholder="Please enter policy name" />
                </div>
                <div class="col-md-3">
                  <label class="form-label custom-label">{{'Policy Attachment (Image and PDF only)' | translate}}<span class="text-danger">*</span></label>
                  <input type="file" formControlName="policyFile" class="form-control custom-input" />
                </div>
                <div class="col-md-5 d-flex align-items-end">
                  <div class="form-check">
                    <label class="form-label custom-label">{{'Description' | translate}}<span class="text-danger">*</span></label>
                        <input type="text" formControlName="policyDescription" class="form-control custom-input"
                          placeholder="Please enter description" />
                  </div>
                  <button type="button" class="btn btn-sm btn-danger ms-2" (click)="removePolicyRow(i)"
                    *ngIf="policies.length > 1">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </div>
            </div>
            <!-- Submit Button -->
            
          </div>
        </div>
        <button class="custom-btn btn-primary mt-3" type="submit">{{'Submit' | translate}}</button>
      </div>
      
    </form>
  </div>
