<div class="custom-main-component-container">
    <form [formGroup]="EligibilityForm" (ngSubmit)="addIdentityType()" *ngIf="rbac.allowedToAccess('Eligible For Rehire.create')">
        <!-- Add Input-->
        <div class="mb-4">
            <div class="custom-settings-add-input input-group">
                <input type="text" class="form-control custom-input" placeholder="Please enter eligible for rehire"
                    formControlName="Rehire" aria-label="rehire" aria-describedby="rehire"
                    (keydown)="formValidations.restrictInput($event); formValidations.blockNonAlphabets($event)" maxlength="50">
                <span class="input-group-text" id="rehire">
                    <button type="submit" class="custom-btn btn-primary"
                        [disabled]="EligibilityForm.invalid">{{'Add'|translate}}</button></span>
            </div>
            <div *ngIf="EligibilityForm.get('Rehire')?.touched && EligibilityForm.get('Rehire')?.invalid" class="error-msg mt-2">
                <div *ngIf="EligibilityForm.get('Rehire')?.errors?.['required']">{{'Eligible For Rehire is required'|translate}}</div>
            </div>
        </div>
    </form>

    <!--Data Content-->
    <div class="custom-settings-data-table">
        <table class="w-100">
            <thead>
                <tr>
                    <th class="col-span-2"></th>
                </tr>
            </thead>
            <tbody>
                @for (e of EligibilityDetail; track $index) {
                <tr>
                    <td class="w-75">{{ e.eligibleforrehire1}}</td>
                    <td class="w-25">
                        <div class="d-flex gap-4">
                            <!--Update-->
                            <div>
                                <a (click)="openupdate(e)" *ngIf="rbac.allowedToAccess('Eligible For Rehire.update')"><img src="/settings-icon/edit.png" alt="edit icon"
                                        class="settings-common-icon"></a>
                            </div>
                            <!--Delete-->
                            <div>
                                <a (click)="opendelete(e)" *ngIf="rbac.allowedToAccess('Eligible For Rehire.delete')"><img src="/settings-icon/trash-2.png" alt="edit icon"
                                        class="settings-common-icon"></a>
                            </div>
                        </div>
                    </td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>

<!--Update popup-->
<ng-template #updatepopup let-modal>
    <form [formGroup]="updateForm">
        <div class="custom-main-popup-container" ngbAutofocus>
            <div class="custom-poup-header-content popup-header-border">
                <div >
                    <p class="popup-heading mb-0">{{'Update Eligible For Rehire'|translate}}</p>
                </div>
                <div>
                    <a (click)="close(modal)"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
                </div>
            </div>
            <div class="custom-main-popup-content ">
                <div class="mb-4">
                    <label for="exampleFormControlInput1" class="form-label custom-label mb-2">{{'Eligible For Rehire'|translate}}
                        <span class="error-msg">*</span></label>
                    <input type="text" class="form-control custom-input" formControlName="Rehire" placeholder="Please enter eligible for rehire"
                    (keydown)="formValidations.restrictInput($event); formValidations.blockNonAlphabets($event)" maxlength="50">
                    <div *ngIf="updateForm.get('Rehire')?.touched && updateForm.get('Rehire')?.invalid" class="error-msg mt-2">
                        <div *ngIf="updateForm.get('Rehire')?.errors?.['required']">{{'Eligible For Rehire is required'|translate}}</div>
                    </div>
                </div>
                <div class="custom-modal-footer">
                    <button type="button" class="custom-btn btn-secondary " (click)="close(modal)">{{'Close'|translate}}</button>
                    <button type="button" class="custom-btn btn-primary " (click)="updateEligibility(modal)" [disabled]="updateForm.invalid">{{'Update'|translate}}</button>
                </div>
            </div>
        </div>
    </form>
</ng-template>

<!--Delete Confirmation popup-->
<ng-template #deletepopup let-modal>
    <div class="result-popup-content" ngbAutofocus>
       
            <div >
                <img src="/icons/delete-icon.png" alt="delete-icon" class="confirmation-delete-icon">
                <p class="confirmation-text">{{'Are you sure you want to Delete?'|translate}}</p>
            </div>
            <div class="d-flex gap-5 pt-2 w-100">
                <button type="button" class="custom-btn btn-secondary "(click)="closeDelete(modal)">{{'No'|translate}}</button>
                <button type="button" class="custom-btn btn-primary " (click)="onDelete(modal)">{{'Yes'|translate}}</button>
            </div>
        </div>
   
  </ng-template>
