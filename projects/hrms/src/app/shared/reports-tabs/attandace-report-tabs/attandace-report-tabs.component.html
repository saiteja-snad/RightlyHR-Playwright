<div class="component-nav-tabs-container card px-2">
    <p-tabs value="0" scrollable>
        <p-tablist>
            <ng-container *ngFor="let tab of navTabs;">
                <p-tab [value]="tab.route">
                    <a [routerLink]="tab.route" routerLinkActive="nav-tab-active" class="nav-link">
                        {{ tab.label }}
                    </a>
                </p-tab>
            </ng-container>
        </p-tablist>
    </p-tabs>
</div>
