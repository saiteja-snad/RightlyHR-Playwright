<div class="heading-content">
    @if(isShowsettingsRoute()){
    <div class="commpoment-name navigator" (click)="navigateToSettings()">Settings</div>
    }

    @if(isShowsettingsjobRoute()){
    <div class="commpoment-name navigator" (click)="navigateToloadentiments()">Settings</div>
    }
    <div class="commpoment-name">
        <i class="bi bi-chevron-double-right"></i>
    </div>
    <div class="commpoment-name">{{moduleName | translate}}</div>
    @if(navigationname){
    <div class="commpoment-name">
        <i class="bi bi-chevron-double-right"></i>
    </div>
    <div class="commpoment-name">{{navigationname | translate}}</div>
    }
    <div class="commpoment-name">
        <i class="bi bi-chevron-double-right"></i>
    </div>
    <div class="component-header">{{componentName | translate}}</div>

    @if (isShowsformoduelinfo()) {
    <div>
        <app-module-info-icon placement="bottom" [ngbPopover]="popContent" />
    </div>
    }
</div>

<ng-template #popContent>
    <app-module-information [moduleInfo]="moduleinfo" />
</ng-template>
