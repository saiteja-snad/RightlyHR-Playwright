<div class="card main-settings-layout p-4">
    <!-- Add Input-->
    <div>
        <form [formGroup]="roleForm" (ngSubmit)="onSubmit()" >
        <div class="custom-settings-add-input input-group mb-5">
            <input type="text" class="form-control custom-input" placeholder="Please enter role"
                aria-label="role" aria-describedby="role"  formControlName="role" >
                
            <span class="input-group-text" id="role">
                <button type="submit" class="custom-btn btn-primary">{{'Add'| translate}}</button>
                </span>
                </div>
                <div *ngIf="roleForm.get('role')?.touched || roleForm.get('role')?.dirty">
                    <!-- Required validation message -->
                    <div *ngIf="roleForm.get('role')?.hasError('required')" style="color: red; font-size: 16px;">
                      Please add this role.
                    </div>
                  </div>
       </form>
   </div>

    <!--Data Content-->
    <div>
        <div class="custom-settings-data-table">
            <table class="w-100">
                <thead>
                    <th class="col-span-2"></th>
                </thead>
                <tbody>
                    @for (role of rolesdetails ; track role.name) {

                    <tr *ngFor="let role of rolesdetails">
                        <td class="w-75">{{role.name}}</td>
                        <td class="w-25">
                            <div class="d-flex gap-4">
                                <!--Update-->
                                <div>
                                    
                                    <a (click)="openupdate(role)"><img src="/settings-icon/edit.png" alt="edit icon"
                                            class="settings-common-icon">
                                        </a>
                                        
                                </div>
                                <!--Delete-->
                                <div>
                                    <a (click)="opendelete(role)"><img src="/settings-icon/trash-2.png" alt="edit icon"
                                            class="settings-common-icon"></a>
                                </div>
                            </div>
                        </td>
                    </tr>
                }
                </tbody>
            </table>
        </div>
    </div>
</div>

<!--Update popup-->
<ng-template #updatepopup let-modal>
    <form [formGroup]="updateForm">
    <div class="custom-main-popup-container" ngbAutofocus>
        <div class="d-flex justify-content-between popup-header-border p-4">
            <div class="pt-2">
                <p class="popup-heading mb-0">{{'Update'|translate}}</p>
            </div>
            <div>
                <a (click)="close(modal)"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
            </div>
        </div>
        <div class="custom-main-popup-content p-5">
            <div class="mb-4">
                <label for="exampleFormControlInput1" class="form-label custom-label mb-2">{{'roles'|translate}}<span class="error-msg">*</span></label>
                <input type="text" class="form-control custom-input" formControlName="firstName" 
                    placeholder="Please enter role">
            </div>
            <div class="d-flex gap-5 pt-4 w-100">
                <button class="custom-btn btn-secondary w-50 py-3"(click)="close(modal)">{{'Close'|translate}}</button>
                <button class="custom-btn btn-primary w-50 py-3"  (click)="updateRole(rolesDeletedata)">{{'Update'|translate}}</button>
            </div>
        </div>
    </div>
    </form>
</ng-template>

<!--Delete Confirmation popup-->
<ng-template #deletepopup let-modal>
    <div class="modal-body" ngbAutofocus>
        <div class="custom-main-popup-content text-center p-4">
            <div class="py-5">
                <img src="/icons/delete-icon.png" alt="delete-icon" class="confirmation-icon mb-5">
                <p class="confirmation-text">{{'Are you sure you want to Delete?'|translate}}</p>
            </div>
            <div class="d-flex gap-5 pt-2 w-100">
                <button class="custom-btn btn-secondary w-50 py-3" (click)="modal.close()">{{'No'|translate}}</button>
                <button class="custom-btn btn-primary w-50 py-3"(click)="deleteRole(rolesDeletedata)">{{'yes'|translate}}</button>
            </div>
        </div>
    </div>
</ng-template>
