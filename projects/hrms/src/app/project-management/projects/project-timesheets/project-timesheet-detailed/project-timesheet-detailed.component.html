<div class="custom-component-right-content">
    <div class="custom-table-content">
        <table class="w-100">
            <thead>
                <tr>
                    <th>Employee Name</th>
                    <th>Rolet</th>
                    <th>Start Date</th>
                    <th>Days Spent</th>
                    <th>Logged Hours</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let project of projectEmployeeDetails; let i = index">
                    <td>
                        <a class="project-name cursor" (click)="navigateView(project.employee.id)">{{ project.employee?.name }}
                        </a>
                    </td>
                    <td>{{ project.roleName }}</td>
                    <td>{{ project.startDate | dateformat }}</td>
                    <td>{{ project.daysSpent || '-' }}</td>
                    <td>{{ project.loggedHours || '0' }}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
