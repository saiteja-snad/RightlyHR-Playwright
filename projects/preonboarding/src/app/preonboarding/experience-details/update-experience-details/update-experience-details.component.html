<div class="custom-main-popup-container">
    <div class="d-flex justify-content-between popup-header-border p-4">
        <div class="pt-2">
            <p class="popup-heading mb-0">Update Experience Details</p>
        </div>
        <div>
            <a (click)="close()"><img src="/images/close.png" alt="Close Icon" class="close-icon"></a>
        </div>
    </div>
    <div class="custom-main-popup-content p-4">
        <form [formGroup]="experienceForm" (ngSubmit)="postExpDetails()">
            <div class="row">
                <div class="col-md-12 mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="checkDefault" formControlName="isPresent" />
                        <label class="form-check-label custom-label" for="checkDefault">Currently Working</label>
                    </div>
                </div>
        
                <div class="col-md-6 mb-3">
                    <label class="form-label custom-label mb-2">Company Name<span class="text-danger">*</span></label>
                    <input type="text" class="form-control custom-input" formControlName="companyName">
                </div>
        
                <div class="col-md-6 mb-3">
                    <label class="form-label custom-label mb-2">Employment Type<span class="text-danger">*</span></label>
                    <div class="custom-p-select-content">
                        <p-select [options]="JobemploymenttypeDetails" optionLabel="jobType1" optionValue="jobType1"
                            formControlName="employmentType" placeholder="Please select employment type" class="form-select custom-select">
                        </p-select>
                    </div>
                </div>
        
                <div class="col-md-6 mb-3">
                    <label class="form-label custom-label mb-2">From Date<span class="text-danger">*</span></label>
                    <input type="date" class="form-control custom-input" formControlName="fromDate">
                </div>
        
                <div class="col-md-6 mb-3">
                    <label class="form-label custom-label mb-2">To Date<span class="text-danger">*</span></label>
                    <input type="date" class="form-control custom-input" formControlName="toDate" [disabled]="isDisabletoDate">
                </div>
        
                <div class="col-md-6 mb-3">
                    <label class="form-label custom-label mb-2">Job Role<span class="text-danger">*</span></label>
                    <input type="text" class="form-control custom-input" formControlName="jobTitle">
                </div>
        
                <div class="col-md-12 mb-3">
                    <label class="form-label custom-label mb-2">Roles & Responsibilities<span
                            class="text-danger">*</span></label>
                    <textarea class="form-control custom-input" formControlName="responsibilities"></textarea>
                </div>
        
                <div class="mb-3">
                    <p class="popup-heading mb-0">Previous Employer Details</p>
                </div>
        
                <div class="col-md-6 mb-3">
                    <label class="form-label custom-label mb-2">Contact Name<span class="text-danger">*</span></label>
                    <input type="text" class="form-control custom-input" formControlName="contactName">
                </div>
        
                <div class="col-md-6 mb-3">
                    <label class="form-label custom-label mb-2">Contact Number<span class="text-danger">*</span></label>
                    <div class="d-flex custom-input-group position-relative custom-phone-number-content w-100">
                        <lib-country-list [selectedCountryConfig]="selectedCountryConfig"  [selectedCountryCode]="selectedCountryCode" [countryListConfig]="countryListConfig" class="country-input"
                         (onCountryChange)="onCountryChange($event)"></lib-country-list>
                        <input type="text" class="form-control custom-input" formControlName="phonenumber"
                            placeholder="Please enter your mobile number" id="phonenumbers"
                            aria-describedby="phonenumbers"
                            [value]="experienceForm.get('phonenumber')?.value ? formatPhoneNumber(experienceForm.get('phonenumber')?.value) : ''"
                            autocomplete="off" required>
                    </div>
                    <div class="error-msg my-1"
                        *ngIf="experienceForm.get('phonenumber')?.invalid &&  (experienceForm.get('phonenumber')?.touched || experienceForm.get('phonenumber')?.dirty)">
                        <div *ngIf="experienceForm.get('phonenumber')?.hasError('required')">Mobile number is required.</div>
                        <div *ngIf="experienceForm.get('phonenumber')?.hasError('pattern')">Please enter a valid mobile number.</div>
                        <div *ngIf="experienceForm.get('phonenumber')?.hasError('invalidPhoneNumber')">
                            The phone number is not valid for the selected country.
                        </div>
                    </div>
                </div>
        
                <div class="col-md-6 mb-3">
                    <label class="form-label custom-label mb-2">Work Email<span class="text-danger">*</span></label>
                    <input type="email" class="form-control custom-input" formControlName="workEmail">
                </div>
        
                <div class="col-md-12 mb-3">
                    <label class="form-label custom-label mb-2">Attachment (Image and PDF only)<span class="text-danger">*</span></label>
                    <input type="file" class="form-control custom-input" (change)="onChangeexperience($event);onChange($event)">
                </div>
            </div>
        
            <div class="d-flex justify-content-end gap-3 mt-4">
                <button type="button" class="custom-btn btn-secondary" (click)="close()">Close</button>
                <button type="submit" class="custom-btn btn-primary" [disabled]="experienceForm.invalid">Update</button>
            </div>
        </form>
    </div>
</div>
