<div class="custom-main-component-container">
    <!--header-->
    <div class="mb-3">
        <div class="component-header">Settings</div>
    </div>

    <!--tabs content-->
    <div class="mb-3">
        <app-settings-role-permissions-module-tabs />
    </div>

    <!-- Add Input-->
    <div class="mb-4">
        <form [formGroup]="roleForm" (ngSubmit)="onSubmit()">
            <div class="custom-settings-add-input input-group">
                <input type="text" class="form-control custom-input" placeholder="Please enter role" aria-label="role"
                    aria-describedby="role" formControlName="role" (keypress)="formValidation.restrictInput($event)">
                <span class="input-group-text" id="role">
                    <button type="submit" class="custom-btn btn-primary" [disabled]="roleForm.invalid">
                        {{'Add'| translate}}
                    </button>
                </span>
            </div>
            <div *ngIf="roleForm.get('role')?.touched || roleForm.get('role')?.dirty" class="error-msg">
                <!-- Required validation message -->
                <div *ngIf="roleForm.get('role')?.hasError('required')">Please enter role</div>
                <div class="error-msg" *ngIf="roleForm.get('role')?.errors?.['pattern']">Enter a valid role </div>
            </div>
        </form>
    </div>

    <!--Data Content-->
    <ng-container *ngIf="dataLoad; else maincontent">
        <ng-template #loadingSpinner>
            <div class="custom-compoent-data-loader">
                <app-data-loader-content />
            </div>
        </ng-template>
        <ng-container *ngTemplateOutlet="loadingSpinner"></ng-container>
    </ng-container>

    <ng-template #maincontent>
        <div class="custom-settings-data-table">
            <table class="w-100">
                <thead>
                    <th class="col-span-2"></th>
                </thead>
                <tbody>
                    @if(rolesdetails.length > 0){
                    @for(role of rolesdetails ; track role) {
                    <tr>
                        <td class="w-75">{{role.name}}</td>
                        <td class="w-25">
                            <div class="d-flex gap-4">
                                <!--Update-->
                                <div>
                                    <a (click)="openupdate(role)">
                                        <img src="/settings-icon/edit.png" alt="edit icon" class="settings-common-icon">
                                    </a>
                                </div>
                                <!--Delete-->
                                <div>
                                    <a (click)="opendelete(role)">
                                        <img src="/settings-icon/trash-2.png" alt="edit icon" class="settings-common-icon">
                                    </a>
                                </div>
                            </div>
                        </td>
                    </tr>
                    }
                    }@else {
                    <tr>
                        <td colspan="2">
                            <app-no-data-found></app-no-data-found>
                        </td>
                    </tr>
                    }
                </tbody>
            </table>
        </div>
    </ng-template>
</div>

<!--Update popup-->
<ng-template #updatepopup let-modal>
    <form [formGroup]="updateForm" (ngSubmit)="updateRole(rolesDeletedata)">
        <div class="custom-main-popup-container" ngbAutofocus>
            <div class="custom-poup-header-content popup-header-border">
                <div class="pt-2">
                    <p class="popup-heading mb-0">{{'Update'|translate}}</p>
                </div>
                <div>
                    <a (click)="close(modal)"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
                </div>
            </div>
            <div class="custom-main-popup-content">
                <div class="mb-4">
                    <label for="exampleFormControlInput1" class="form-label custom-label mb-2">{{'Role'|translate}}<span
                            class="error-msg">*</span></label>
                    <input type="text" class="form-control custom-input" formControlName="firstName"
                        placeholder="Please enter role" (keypress)="formValidation.restrictInput($event)">
                    <div *ngIf="updateForm.get('firstName')?.touched || updateForm.get('firstName')?.dirty"
                        class="error-msg">
                        <div *ngIf="updateForm.get('firstName')?.hasError('required')">Please enter role</div>
                        <div *ngIf="updateForm.get('firstName')?.errors?.['pattern']">Enter a valid role </div>
                    </div>
                </div>

                <div class="custom-modal-footer">
                    <button type="button" class="custom-btn btn-secondary" (click)="close(modal)">{{'Close'|translate}}</button>
                    <button type="submit" class="custom-btn btn-primary" [disabled]="updateForm.invalid">{{'Update'|translate}}</button>
                </div>
            </div>
        </div>
    </form>
</ng-template>

<!--Delete Confirmation popup-->
<ng-template #deletepopup let-modal>
    <div class="modal-body" ngbAutofocus>
        <div class="custom-main-popup-content text-center p-4">
            <div class="py-5">
                <img src="/icons/delete-icon.png" alt="delete-icon" class="confirmation-icon mb-5">
                <p class="confirmation-text">{{'Are you sure you want to Delete?'|translate}}</p>
            </div>
            <div class="d-flex gap-5 pt-2 w-100">
                <button class="custom-btn btn-secondary w-50 py-2" (click)="modal.close()">{{'No'|translate}}</button>
                <button class="custom-btn btn-primary w-50 py-2"
                    (click)="deleteRole(rolesDeletedata)">{{'yes'|translate}}</button>
            </div>
        </div>
    </div>
</ng-template>
