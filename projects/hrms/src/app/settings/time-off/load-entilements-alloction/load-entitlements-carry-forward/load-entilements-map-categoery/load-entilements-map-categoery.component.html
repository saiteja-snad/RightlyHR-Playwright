<div class="custom-main-component-container">
    <div class="d-flex gap-2 justify-content-end  mb-2">
        <div>
            <img src="images\leave-allocation.png" alt="leaves-icon" class="leave-icon">
        </div>
        <div class="d-flex align-items-center map-text m-0">Auto-map 3 categories</div>
    </div>

    <div class="custom-table-content w-100">
        <table class="w-100">
            <thead>
                <th class="text-center">
                    Source Category ({{ currentYear }})
                </th>

                <th class="text-center">
                    Mapping
                </th>

                <th class="text-center">
                    Target Category ({{ nextYear }})
                </th>
            </thead>
            <tbody>
                <tr *ngFor="let item of currentYearData">

                    <td class="text-center">
                        <span>{{item.categoryCode}}</span>
                        <span class="categoryname" [style.color]="item.categoryColor">
                            {{ item.name }} {{currentYear}}
                        </span>
                        <div class="eligible-text" *ngIf="item.carryForwardAllowed">Eligible for Carry Forward</div>
                        <div class="eligible-text" *ngIf="item.encashAllowedType">Eligible for Encash</div>
                    </td>
                    <td class="text-center">
                        <i class="bi bi-arrow-right"></i>
                    </td>
                    <td>
                        <div class="custom-p-select-content">
                            <p-select [options]="nextYearData" class="form-select custom-select"
                                placeholder="Please select target category " optionLabel="name" optionValue="id">
                            </p-select>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="footer-content">
        <div class="d-flex justify-content-end align-items-center gap-3">
            <button type="button" class="custom-btn btn-secondary" (click)="navigationtoback()">Back</button>
            <button type="submit" class="custom-btn btn-primary" (click)="navigationtofinal()">Commit & Process</button>
        </div>
    </div>

</div>
