<div class="container-fluid">
  <!--new changes in progress bar-->
  <div class="progress-container px-4"
    *ngIf="prosempdata.substatus.toLowerCase() == 'offer letter generated' || prosempdata.substatus.toLowerCase() == 'offer letter released' || 
     prosempdata.substatus.toLowerCase() == 'offer letter regenerated' || prosempdata.substatus.toLowerCase() == 'offer letter accepted' || 
     prosempdata.substatus.toLowerCase() == 'appointment letter generated' || prosempdata.substatus.toLowerCase() == 'appointment letter accepted' || 
     prosempdata.substatus.toLowerCase() == 'appointment letter regenerated'">
    <div class="bar-content px-4">
      <progress class="progress-bar" [value]="currentStep" [max]="visibleSteps.length - 1"></progress>
    </div>
  
    <div class="number-container px-4">
      <div class="step text-center" *ngFor="let step of visibleSteps; let i = index"
        [class.active]="currentStep >= i + 1">
        <div class="bullet">{{ i + 1 }}</div>
      </div>
    </div>
  
    <div class="text-container">
      <div class="text-center step-text progress-text pt-2" *ngFor="let step of visibleSteps; let i = index"
        [class.active]="currentStep >= i + 1">{{ step.name }}
      </div>
    </div>
  </div>

  <!--Progress bar before submission of Documents-->
  <div class="progress-container2"
    *ngIf="prosempdata.substatus=='Requested Documents' || prosempdata.substatus=='Documents Submitted' || this.prosempdata.substatus=='Documents Rejected' || 
        this.prosempdata.substatus=='Documents Verified'|| this.prosempdata.substatus=='Documents Accepted' || this.prosempdata.substatus.toLowerCase() === 'offer letter accepted'">
    <div class="custom-width-2">
      <div class="progress-bar-content">
        <progress class="progress-bar2" [value]="currentStepp" [max]="1"></progress>
      </div>
      <div class="steps-container2">
        <div class="step2" *ngFor="let step of step2; let i = index" [class.activee]="currentStepp >= i + 1">
          <div class="bullet2 mb-2">{{ i + 1 }}</div>
          <div class="text-wrap progress-text">{{ step.name }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
