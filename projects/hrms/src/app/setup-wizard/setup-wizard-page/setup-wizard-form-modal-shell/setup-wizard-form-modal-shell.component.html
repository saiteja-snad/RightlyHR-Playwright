<div class="wizard-form-modal-shell">
  <div class="wizard-form-modal-header">
    <button type="button" class="custom-btn btn-secondary btn-sm" (click)="onClose()">
      <i class="bi bi-arrow-left me-1"></i> Back to Wizard
    </button>
    <h5 class="wizard-form-modal-title mb-0">{{ title }}</h5>
    <button type="button" class="wizard-form-modal-close" (click)="onClose()" aria-label="Close">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <div class="wizard-form-modal-body">
    <ng-container *ngComponentOutlet="formComponent" />
  </div>
</div>
