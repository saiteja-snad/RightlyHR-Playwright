<div class="custom-main-component-container">
    @if (router.url !== '/settings/dynamic-forms/create-form' && router.url !== '/settings/dynamic-forms/view-form' 
    && router.url !== '/settings/dynamic-forms/update-form') {
    <!--header-->
    <div class="d-flex align-items-center justify-content-between mb-3">
        <div class="component-header">Settings</div>
        <div *ngIf="rbac.allowedToAccess('Dynamic Forms Module.create')">
            <!-- @if (rbac.allowedToAccess('Dynamic-form.create')) { -->
            <button class="custom-btn btn-primary" (click)="navigateToCreateFormComponent()">Create a Form</button>
            <!-- } -->
        </div>
    </div>

    <!--tabs content-->
    <div class="mb-3">
        <app-setting-dynamic-forms-tabs />
    </div>

    <!--Content-->
    <div class="custom-setting-right-content p-3">
        <router-outlet />
    </div>
    } @else {
    <router-outlet />
    }
</div>
