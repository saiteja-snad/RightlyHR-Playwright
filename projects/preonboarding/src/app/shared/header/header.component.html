<div class="header-main-container d-flex justify-content-between align-items-center" ngbAutofocus>
    <div>
        <img src="/logos/rightlyhr-full-logo.png" alt="RightlyHr Logo" class="logo-image">
    </div>

    <div class="d-flex align-items-center gap-3">
        <div>
            <img src="images\profile-img.png" alt="Profile Image" class="profile-img cursor">
        </div>
        <div>
            <p class="name mb-0">{{prospectiveEmpData.firstName}} {{prospectiveEmpData.middleName}}
                {{prospectiveEmpData.lastName}}</p>
            <p class="email mb-0">{{prospectiveEmpData.emailaddress}}</p>
        </div>
        <div class="dropdown">
            <a type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <img src="/icons/logout-icon.png" alt="Logout Icon" class="logout-icon cursor">
            </a>
            <ul class="dropdown-menu custom-dropdown-menu">
                <li><a class="dropdown-item" (click)="openlogoutModal()">Logout</a></li>
            </ul>
        </div>
    </div>
</div>

<ng-template #logoutpopup let-modal>
    <div class="result-popup-content text-center" ngbAutofocus>
        <p class="confirmation-text mb-5">Are you sure you want to logout?</p>
        <div class="d-flex justify-content-center w-100 gap-5">
            <button class="custom-btn btn-secondary w-50 py-2 px-5" (click)="close()">Close</button>
            <button class="custom-btn btn-primary w-50 py-2 px-5" (click)="logOut()">Logout</button>
        </div>
    </div>
</ng-template>
