<div class="custom-main-component-container">
    <div class="custom-table-content w-50">
        <ng-container *ngIf="regularizationvalue!.length > 0; else noDataTemplate">
            <table class="w-100">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Value</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor=" let permi of regularizationvalue ;let i = index">
                        <td>{{ permi.attribute }}</td>
                        <td>
                            <ng-container *ngIf="editingIndex !== i">{{ permi.value }}</ng-container>
                            <ng-container *ngIf="editingIndex === i">
                                <input class="form-control" type="text" [(ngModel)]="temporaryValue"
                                    (keypress)="validateDecimal($event, permi.attribute)" (keydown.tab)="editingIndex === i" />
                            </ng-container>
                        </td>
                        <td class="text-center">
                            <ul class="dropdown-menu custom-dropdown-menu" *ngIf="editingIndex !== i; else editingMode">
                                <li>
                                    <a class="dropdown-item" (click)="enableEditForPermissionRegulization(i, permi.id, permi.value, permi.entity)">
                                    <i class="bi bi-pencil me-2"></i>Update</a>
                                </li>
                              </ul>
                            <ng-template #editingMode>
                                <div class="d-flex gap-2">
                                    <button class="custom-btn btn-primary" type="button"  (click)="submitPermissionEligibilityValue(i, temporaryValue)">
                                        Update
                                    </button>
                                    <button class="custom-btn btn-secondary" type="button" (click)="disableEdit()">Cancel</button>
                                </div>
                            </ng-template>
                        </td>
                    </tr>
                </tbody>
            </table>
        </ng-container>
    </div>
</div>

<ng-template #noDataTemplate>
    <tr>
        <td colspan="3"><app-no-data-found></app-no-data-found></td>
    </tr>
</ng-template>
