<div class="custom-main-component-container w-100">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <p class="component-header mb-0" (click)="Cancel()">
                <i class="bi bi-arrow-90deg-left me-2"></i>{{'View Policy' | translate}}
            </p>
        </div>
    </div>
    <form [formGroup]="policyForm" (ngSubmit)="submit()">
        <div class="custom-setting-right-content w-100 p-3">
            <!--Select Fields-->
            <div class="d-flex gap-3 mt-4">
                <div class="custom-p-select-content">
                    <label class="form-label custom-label">{{'Year' | translate}}<span
                            class="text-danger">*</span></label>
                    <p-select [options]="yearDetails" optionLabel="name" placeholder="Select year"
                        formControlName="year" class="form-select custom-select">
                    </p-select>
                </div>
                <div class="custom-p-select-content">
                    <label class="form-label custom-label">{{'Location' | translate}}<span
                            class="text-danger">*</span></label>
                    <p-select [options]="jobLocationDropDownData" optionLabel="jobLocationName" optionValue=""
                        formControlName="location" placeholder="Select location" class="form-select custom-select"
                        (onChange)="getSubLocationByid($event.value)">
                    </p-select>
                </div>
                <div class="custom-p-select-content">
                    <label class="form-label custom-label">{{'Sub Location' | translate}}<span
                            class="text-danger">*</span></label>
                    <p-select [options]="subLocationsDropdown" optionLabel="jobSubLocationName" optionValue=""
                        formControlName="subLocation" placeholder="Please select sub location"
                        (onChange)="getShiftBYid($event)" class="form-select custom-select"></p-select>
                </div>
                <div class="custom-p-select-content">
                    <label class="form-label custom-label">{{'Shift' | translate}}<span
                            class="text-danger">*</span></label>
                    <p-select [options]="shiftDropdown" optionLabel="shiftName" optionValue="shift"
                        formControlName="shift" placeholder="Select shift" class="form-select custom-select"></p-select>
                </div>
            </div>
            <div class="card custom-background-card p-3 mt-2">
                <div class="row">
                    <div class="card custom-background-card p-3 mt-2" formArrayName="policies">
                        <div class="row mb-2" *ngFor="let holiday of policies.controls; let i = index"
                            [formGroupName]="i">

                            <div class="col-md-4">
                                <label class="form-label custom-label">{{'Policy Name' | translate}}<span
                                        class="text-danger">*</span></label>
                                <input type="text" formControlName="policyName" class="form-control custom-input"
                                    placeholder="Please enter policy name" />
                            </div>
                            <div class="col-md-3">
                                <label class="form-label custom-label">{{'Policy Attachment (Image and PDF only)' |
                                    translate}}<span class="text-danger">*</span></label>
                                <div [ngbPopover]="popContent" triggers="click" placement="top">
                                    <i class="bi bi-info-circle-fill cursor"></i>
                                </div>
                                <ng-template #popContent>
                                    <div>{{ getPolicyAttachmentName(holiday.get('policyFile')?.value) }}</div>
                                </ng-template>
                                <div *ngIf="holiday.get('policyFile')?.touched && holiday.get('policyFile')?.invalid"
                                    class="error-msg">
                                    {{'Policy File is required' | translate}}.
                                </div>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label custom-label">{{'Description' | translate}}<span
                                        class="text-danger">*</span></label>
                                <input type="text" formControlName="policyDescription" class="form-control custom-input"
                                    placeholder="Please enter description">

                            </div>
                        </div>
                    </div>
                    <!-- Submit Button -->

                </div>
            </div>
            <div class=" d-flex justify-content-end gap-3 p-3">
                <button type="button" class="custom-btn btn-secondary" (click)="Cancel()">{{'Close'|translate}}</button>
                <button type="button" class="custom-btn btn-secondary" *ngIf="!hideBUTTON"
                    (click)="cloneshiftsPolicy1()" [disabled]="policyForm.invalid">{{'Clone'|translate}}</button>
            </div>

        </div>

    </form>
</div>
<ng-template #deletepopup let-modal>
    <div class="result-popup-content" ngbAutofocus>

        <div>
            <img src="/icons/reject.png" alt="delete-icon" class="confirmation-delete-icon">
            <p class="confirmation-text">{{'Are you sure you want to close?'|translate}}</p>
        </div>
        <div class="custom-modal-footer">
            <button type="button" class="custom-btn btn-secondary "
                (click)="closeDelete(modal)">{{'No'|translate}}</button>
            <button type="button" class="custom-btn btn-primary " (click)="onDelete(modal)">{{'Yes'|translate}}</button>
        </div>
    </div>

</ng-template>
