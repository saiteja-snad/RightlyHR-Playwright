<div class="custom-main-component-container">
    <div class="component-header-content">
        <div class="heading-content">
            <!-- <div class="commpoment-name">Holidays<span class="ms-2">>></span></div> -->
            <div class="component-header">Holidays</div>
            <div>
                <img src="\icons\moduelicon.png" alt="Icon" placement="bottom" [ngbPopover]="popContent"
                    class="module-icon">
            </div>
        </div>

        <div class="d-flex gap-2 align-items-center">
            <label class="form-label custom-label m-0" for="">Select Year:</label>
            <form autocomplete="off" [formGroup]="optionalholidaysform">
                <div class="custom-p-select-content">
                    <p-select formControlName="selectedYear" [options]="years" placeholder="Select Year"
                        class="form-select custom-select" (onChange)="onYearChange()">
                    </p-select>
                </div>
            </form>
        </div>
    </div>

    <ng-template #popContent>
        <app-module-information [moduleInfo]="moduleinfo" />
    </ng-template>

    <div>
        <router-outlet></router-outlet>
    </div>
</div>
