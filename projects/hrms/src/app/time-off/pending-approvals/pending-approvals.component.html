<div class="custom-main-component-container">
    <div class="component-header-content">
        <div>
            @if (router.url !== '/time-off/pending-approvals/assessmentform') {
            <p class="component-header mb-0">{{'Pending Approvals'|translate}}</p>
            }
            @else {
            <p class="component-header mb-0" (click)="navigate()">
                <i class="bi bi-arrow-90deg-left me-2 cursor"></i>{{'Assessment Form'|translate}}
            </p>
            }
        </div>
    </div>

    <!--Module Information-->
    <div>
        <app-module-information [moduleInfo]="moduleinfo" />
    </div>

    <div class="d-flex gap-3 w-100">
        @if (router.url != '/time-off/pending-approvals/assessmentform') {
        <div class="component-left-tabs-container">
            <app-pending-approvals-tabs />
        </div>
        }

        <div class="component-right-content">
            <router-outlet />
        </div>
    </div>
</div>
