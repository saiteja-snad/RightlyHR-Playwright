<div class="custom-main-component-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <p class="component-header mb-0">
                <i class="bi bi-arrow-90deg-left cursor me-2"></i>Org Leave Balance
            </p>
        </div>

        <div class="d-flex gap-3 flex-wrap">
            <div>
                <label class="form-label custom-label pt-2" for="">Search Employee</label>
                <div class="custom-p-select-content">
                    <p-select [options]="employeeiddetails" optionValue="employeeId" optionLabel="fullName" [filter]="true"
          filterBy="fullName" [showClear]="true" placeholder="Please select employee" (onChange)="Onclick($event)"
          class="custom-select w-100">
        </p-select>
                </div>
            </div>
            <div class="d-flex align-items-center gap-3">
                <label class="form-label custom-label pt-2" for="">Month</label>

                <div class="custom-p-select-content">
                    <p-select optionValue="value" placeholder="Month" optionLabel="name"
                        class="custom-select"></p-select>
                </div>
            </div>
            <div class="d-flex align-items-center gap-3">
                <label class="form-label custom-label pt-2" for="">Year</label>
                <div class="d-flex align-items-center gap-2">
                    <div class="custom-p-select-content">
                        <p-select [options]="years" optionLabel="label" optionValue="value" [(ngModel)]="selectedYear"
                            placeholder="Select year" class="form-select custom-select"
                            (onChange)="onSelectYear($event)">
                        </p-select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="team-data-content">
        <!--Employee Accordian-->
        <p-accordion value="0" class="mb-3">
            <p-accordion-panel value="0">
                <p-accordion-header>John Doe (SD213456)</p-accordion-header>
                <p-accordion-content>
                    <div class="employee-data-table">
                        <table class="w-100">
                            <thead>
                                <th class="text-start">Category</th>
                                <th>Entitled</th>
                                <th>Booked</th>
                                <th>Processed</th>
                                <th>Available</th>
                                <th></th>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="text-start">Sick Leaves</td>
                                    <td>1</td>
                                    <td>0</td>
                                    <td>1</td>
                                    <td class="avaliable-number">2</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </p-accordion-content>
            </p-accordion-panel>
        </p-accordion>
    </div>
</div>
