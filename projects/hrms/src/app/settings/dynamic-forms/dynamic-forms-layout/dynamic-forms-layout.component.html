<div class="custom-main-component-container">
    @if (router.url !== '/settings/dynamic-forms/create-form' && router.url !== '/settings/dynamic-forms/view-form'
    && router.url !== '/settings/dynamic-forms/update-form') {
    <!--header-->
    <div class="component-header-content">
         <div class="heading-content">
            <div class="commpoment-name cursor">Settings<span class="ms-2">>></span></div>
            <div class="component-header">Dynamic Forms</div>
            <div>
                <img src="\icons\moduelicon.png" alt="Icon" placement="bottom" [ngbPopover]="popContent"
                    class="module-icon">
            </div>
        </div>

        <div>
            @if (rbac.allowedToAccess('Dynamic Forms Module.create')) {
            <button class="custom-btn btn-primary" (click)="navigateToCreateFormComponent()">Create a Form</button>
            }
        </div>
    </div>
    <!--Module Information-->
    <ng-template #popContent>
        <app-module-information [moduleInfo]="moduleinfo" />
    </ng-template>


    <div class="d-flex gap-3 w-100">
        <!--tabs content-->
        <div class="custom-component-left-content">
            <app-setting-dynamic-forms-tabs />
        </div>
        <div class="card custom-component-right-content p-3">
            <router-outlet></router-outlet>
        </div>
    </div>
    } @else {
    <router-outlet />
    }
</div>
