<div class="custom-sub-tabs-container">
  <ul class="nav flex-column">
    <li class="nav-item" *ngFor="let tab of navTabs">
      <div class="nav-link" (click)="navigateToAccessedRoute(tab.link)" [class.active-nav-link]="isActiveRoute(tab.link)">
        <img [src]="tab.icon" alt="Icon" class="icon mb-2">
        <div class="d-flex">{{ tab.label }}</div>
      </div>
      <div class="tabs-border-bottom"></div>
    </li>
  </ul>
</div>
