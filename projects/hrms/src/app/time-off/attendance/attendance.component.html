<div class="custom-main-component-container mt-3">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <p class="component-header cursor mb-0">Attendance</p>
        </div>
        <div class="d-flex gap-3">
            <label class=" employee-lable" for="">Select</label>

            <div> <select class="form-select custom-select" aria-label="Default select example">
                    <option selected>Year</option>
                    <option value="1">One</option>
                    <option value="2">Two</option>
                    <option value="3">Three</option>
                </select></div>
            <div> <select class="form-select custom-select" aria-label="Default select example">
                    <option selected>Mouth</option>
                    <option value="1">One</option>
                    <option value="2">Two</option>
                    <option value="3">Three</option>
                </select></div>
            <label class=" employee-lable" for="">Select Employee</label>
            <div> <select class="form-select custom-select" aria-label="Default select example">
                    <option selected>Select Employee</option>
                    <option value="1">One</option>
                    <option value="2">Two</option>
                    <option value="3">Three</option>
                </select></div>
            <button type="button" class="custom-btn btn-primary"><i class="bi bi-plus me-2"></i>My Attendance</button>
        </div>
    </div>
    <div class="row">

        <div class=" col-9">
            <div class="custom-table-content ">
                <table class="w-100">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Leave Type</th>
                            <th>Duration</th>
                            <th>Availed</th>
                            <th>Reason</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of attendanceData ">
                            <td>{{item.date}}</td>
                            <td>Sick Leave</td>
                            <td>1</td>
                            <td>5</td>
                            <td>
                                <div>
                                    <span>
                                        <a type="button" placement="top" [ngbPopover]="reason">
                                            <img src="images\info-fill.png" alt="info icon" class="info-icon">
                                        </a>
                                        <ng-template #reason>
                                            <div>
                                                <p class="mb-0">Feaver </p>
                                            </div>
                                        </ng-template>
                                    </span>
                                </div>
                            </td>
                            <td>20/9/2024</td>
                            <td>20/9/2024</td>
                            <td [ngClass]="getStatusClass(item.status)">{{item.status}}</td>
                        </tr>

                    </tbody>
                </table>
            </div>
        </div>
        <div class="col-3">
            <div class="custom-table-content ">
                <table>
                 <tbody>
                    <tr>
                        <td >present</td>
                        <td class="text-end">20</td>
                    </tr>
                 </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
