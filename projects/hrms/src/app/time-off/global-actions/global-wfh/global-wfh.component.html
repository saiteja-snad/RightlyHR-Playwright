<div class="custom-main-component-container">
  <div class="component-header-content">
    <div class="heading-content">
      <div class="commpoment-name">On Behalf Of <span class="ms-1"><i class="bi bi-chevron-double-right"></i></span>
      </div>
      <div class="component-header">Global WFH</div>
      <div>
        <app-module-info-icon placement="bottom" [ngbPopover]="popContent" class="cursor" />
      </div>
    </div>
  
    <div class="d-flex gap-2">
      <div class="d-flex gap-2 align-items-center">
        <label class="form-label custom-label filter-labels m-0" for="">Select Year</label>
        <form autocomplete="off" [formGroup]="yearSelectionForm">
          <div class="custom-p-select-content">
            <p-select formControlName="selectedYear" [options]="years" placeholder="Select Year"
              class="form-select custom-select" (onChange)="onYearChange()">
            </p-select>
          </div>
        </form>
      </div>
      <div>
        @if(rbac.allowedToAccess('Request Global Permission Button.view')){
        <button type="button" class="custom-btn btn-primary" (click)="openAdd()">Request Global WFH</button>
        }
      </div>
    </div>
  </div>

  <!--Module Information-->
  <ng-template #popContent>
    <app-module-information [moduleInfo]="moduleinfo" />
  </ng-template>

  <div class="d-flex gap-3 w-100">
    <div class="component-left-tabs-container">
      <app-global-actions-tabs />
    </div>
  
    <div class="component-right-content">
      <div class="custom-table-content">
      </div>
    </div>
  </div>
</div>
