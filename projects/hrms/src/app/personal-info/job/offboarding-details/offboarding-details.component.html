<div class="custom-main-component-container">
  @if(!loading){
  <div class="card custom-background-card p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <span class="component-sub-header">Offboarding Info</span>
      </div>
    </div>

    <!-- Reactive Form -->
    <form autocomplete="off" [formGroup]="offboardingForm">
      <div class="row">
        <div class="col-lg-4 col-md-6 mb-3">
          <label for="exitReason" class="form-label custom-label mb-2">Exit Reason</label>
          <input type="text" class="form-control  custom-input" placeholder="Please enter exit reason"
            formControlName="exitReason">
          <div class="error-msg"
            *ngIf="offboardingForm.get('exitReason')?.invalid && offboardingForm.get('exitReason')?.touched">
            Exit Reason is required.
          </div>
        </div>

        <div class="col-lg-4 col-md-6 mb-3">
          <label for="eligibleForRehire" class="form-label custom-label mb-2">Eligible For Rehire</label>
          <input type="text" class="form-control  custom-input" placeholder="Please enter eligible for rehire"
            formControlName="eligibleForRehire">
          <div class="error-msg"
            *ngIf="offboardingForm.get('eligibleForRehire')?.invalid && offboardingForm.get('eligibleForRehire')?.touched">
            Eligible For Rehire is required.
          </div>
        </div>

        <div class="col-lg-4 col-md-6 mb-3">
          <label for="relievingType" class="form-label custom-label mb-2">Relieving Type</label>
          <input type="text" class="form-control custom-input" id="relievingType" formControlName="relievingType"
            placeholder="Please enter relieving type" />
          <div class="error-msg"
            *ngIf="offboardingForm.get('relievingType')?.invalid && offboardingForm.get('relievingType')?.touched">
            Relieving Type is required.
          </div>
        </div>

        <div class="col-lg-4 col-md-6 mb-3">
          <label for="lastWorkingDay" class="form-label custom-label mb-2">Last Working Day</label>
          <input type="date" class="form-control custom-input" id="lastWorkingDay" formControlName="lastWorkingDay" />
          <div class="error-msg"
            *ngIf="offboardingForm.get('lastWorkingDay')?.invalid && offboardingForm.get('lastWorkingDay')?.touched">
            Last Working Day is required.
          </div>
        </div>
      </div>
    </form>
  </div>
}
  @else {
  <div class="card custom-background-card p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <p-skeleton width="10rem" height="2rem"></p-skeleton>
      
    </div>
    <form>
      <div class="row">
        <div class="col-md-6 col-lg-4 mb-3" *ngFor="let i of [1,2,3,4,5,6]">
          <p-skeleton width="7rem" height="1rem" styleClass="mb-2"></p-skeleton>
          <p-skeleton width="100%" height="2rem"></p-skeleton>
        </div>
      </div>
    </form>
  </div>
  }
</div>
