<table class="w-100 ">
    <tbody>
        <tr *ngFor="let role of roles">
            <td (click)="onRoleClick(role)" class="no-border ">{{ role.name }}
            </td>
        </tr>
    </tbody>
</table>

<div>
    <form [formGroup]="createAssigneeForm" autocomplete="off" (ngSubmit)="createAssignee(createAssigneeForm)">
        <div class="d-flex  align-items-center gap-2 justify-content-end  p-3">
            <div class="w-25">
                <p-multiSelect formControlName="selected_user" [options]="usersList" name="user" id="user"
                    optionLabel="fullName" placeholder="Search User" field="selectedUser" class="w-100"
                    [selectedItemsLabel]="customLabelTemplate" (ngModelChange)="selectedUserDetails($event)">
                    <ng-template let-user pTemplate="item">
                        <div>{{ user.firstName }} {{ user.middleName }} {{ user.lastName }}</div>
                    </ng-template>
                </p-multiSelect>

            </div>
            <div>
                <button type="submit" class="main-custom-btn custom-btn-primary py-2 px-3"
                    [disabled]="createAssigneeForm.invalid">Add</button>
            </div>

        </div>
    </form>
</div>

<div>
    <table class="w-100">
        <tbody>
            <tr *ngFor="let user of roleAssigneeUsers">
                <td>
                    {{ user.firstName }}
                    <span *ngIf="user.middleName"> {{ user.middleName }} </span>
                    {{ user.lastName }}
                </td>
                <td class="text-end delete-icon" (click)="onUserClick(user)"><b><i class="bi bi-trash3"></i></b>
                </td>

            </tr>
        </tbody>
    </table>
</div>
