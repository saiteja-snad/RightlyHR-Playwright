<div class="custom-main-component-container w-100">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <p class="component-header mb-0" (click)="nagvition()">
        <i class="bi bi-arrow-90deg-left me-2"></i>{{'Add Holiday' | translate}}
      </p>
    </div>
  </div>

  <form [formGroup]="holidayForm" (ngSubmit)="submit()">
    <div class="custom-setting-right-content w-100 p-4">
      <!--Select Fields-->
      <div class="d-flex gap-3 mb-4">
        <div class="custom-p-select-content">
          <p-select [options]="yearDetails" optionLabel="name" placeholder="Select Year" formControlName="year"
            class="form-select custom-select">
          </p-select>
        </div>
        <div class="custom-p-select-content">
          <p-select [options]="jobLocationDropDownData" optionLabel="jobLocationName" optionValue=""
            formControlName="location" placeholder="Select Location" class="form-select custom-select"
            (onChange)="getSubLocationByid($event.value)">
          </p-select>
        </div>
        <div class="custom-p-select-content">
          <p-select [options]="subLocationsDropdown" optionLabel="jobSubLocationName" optionValue="id"
            formControlName="subLocation" placeholder="Please select Sub Location" (onChange)="getShiftBYid($event.value)"
            class="form-select custom-select"></p-select>
        </div>
        <div class="custom-p-select-content">
          <p-select [options]="shiftDropdown" optionLabel="shiftName" optionValue="id" formControlName="shift"
            placeholder="Select shift" class="form-select custom-select"></p-select>
        </div>
        <div>
          <button type="button" [disabled]="holidayForm?.get('year')?.invalid || holidayForm?.get('location')?.invalid || holidayForm?.get('subLocation')?.invalid || holidayForm?.get('shift')?.invalid" class="custom-btn btn-primary" (click)="addMomentRow()">
            <i class="bi bi-plus me-2"></i> {{'Add Holidays' | translate}} 
          </button>
        </div>
      </div>

      <div class="" formArrayName="holidays">
          <div class="card custom-background-card p-3 mb-4"  *ngFor="let holiday of holidays.controls; let i = index" [formGroupName]="i">
            <div class="row">
              <div class="col-md-5">
                <label class="form-label custom-label">{{'Holiday Name' | translate}}<span class="text-danger">*</span></label>
                <input type="text" formControlName="holidayName" class="form-control custom-input"
                  placeholder="Please enter Holiday Name" />
              </div>
              <!-- <div class="col-md-5">
                <label class="form-label custom-label">{{'Holiday Date' | translate}}<span class="text-danger">*</span></label>
                <input type="date" formControlName="holidayDate" class="form-control custom-input" />
              </div> -->
              <div class="col-md-5">
                <div class="form-group position-relative">
                  <label class="form-label custom-label mb-1">
                    {{ 'Holiday Date' | translate }}<span class="text-danger">*</span>
                  </label>
                  <input
                    type="date"
                    formControlName="holidayDate"
                    class="form-control custom-input"
                   
                  />
                </div>
              </div>
              
              
              <div class="col-md-2 d-flex align-items-end">
                <div class="form-check">
                  <input type="checkbox" formControlName="isOptional" class="form-check-input"/>
                  <label class="form-check-label">{{'Optional' | translate}}</label>
                </div>
                <button type="button" class="btn btn-sm btn-danger ms-2" (click)="removeHolidayRow(i)"
                  *ngIf="holidays.length > 1">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>
          </div>
          <!-- Submit Button -->
      </div>

      <div class="d-flex justify-content-end ">
        <button class="custom-btn btn-primary mt-3" [disabled]="holidayForm.invalid"  type="submit">{{'Submit' | translate}}</button>
      </div>
      
    </div>
  </form>
</div>
