<div class="custom-main-component-container">
    <div class="component-header-content">
        <div>
            <p class="component-header mb-0">Regularizations</p>
        </div>
        <div class="d-flex gap-3">
            <label class="form-label custom-label mt-3">{{'My Team'| translate}}</label>
            <div class="custom-p-select-content">
                <p-select [options]="getEmployeeInfo" optionLabel="fullName" optionValue="employeeId"
                    name="myteamemployees" placeholder="Select Employee Name" [filter]="true" [virtualScroll]="false"
                    [autoDisplayFirst]="false" required (onChange)="onCheckemployee($event.value)">
                </p-select>
            </div>
        </div>

    </div>

    <!--Module Information-->
    <div>
        <app-module-information [moduleInfo]="moduleinfo" />
    </div>

    <div class="d-flex gap-3 w-100">
        <div class="component-left-tabs-container">
            <app-regularization-tabs />
        </div>

        <div class="component-right-content">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
