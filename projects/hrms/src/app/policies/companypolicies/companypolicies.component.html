<div class="custom-main-component-container  ">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <p class="component-header cursor mb-0"><i class="bi bi-arrow-90deg-left me-2"></i> Policies</p>
    </div>
  <div class="d-flex align-items-center ms-2">
    <span class="me-2">Select year:</span>
    <form [formGroup]="policiesform" class="m-0">
      
      <p-select formControlName="selectedYear" [options]="years" 
       [style]="{ width: 'auto' }" class="form-select form-select-sm">
      </p-select>
    </form>
  </div>
</div>

    <div class="custom-table-content">
      <table class="w-100">
          <thead>
              <tr>
                <th>Policy Name</th>
                <th>Description</th>
                <th>Attachment</th>

              </tr>
          </thead>
          <tbody>
              <ng-container *ngIf="((orgPolicyItemsArray) ?? []).length > 0; else noDataTemplate">
                  <tr *ngFor="let item of orgPolicyItemsArray">
                    <td>{{item.policyName}}</td>
                    <td>{{item.policyDescription}}</td>
                    <td data-bs-toggle="modal" data-bs-target="#exampleModal">
                      <!-- <a class="dropdown-item" (click)="onViewClick(item.policyAttachment)">
                        <i class="bi bi-paperclip me-2"></i>View
                      </a> -->

                      
                        <!-- <li><a class="dropdown-item" (click)="onViewClick(item.policyAttachment)"><i
                              class="bi bi-paperclip me-2"></i>View</a>
                        </li> -->
                        <a type="button" class="view-text text-nowrap" (click)="onViewClick(item.policyAttachment)">
                          <i class="bi bi-paperclip"></i>View
                        </a>
                     
                    </td>
                  </tr>
              </ng-container>
              <!-- No Data Found Template -->
              <ng-template #noDataTemplate>
                  <tr>
                      <td>
                          <app-no-data-found />
                      </td>
                  </tr>
              </ng-template>
          </tbody>
      </table>
  </div>
<!-- </ng-template> -->
  <!-- </div> -->
  
  <!-- Modal -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Policy</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" ></button>
        </div>
        <div class="modal-body" style="text-align: center;">
            <div class="spinner-border text-primary d-inline-block ms-3" style="width: 2rem;height: 2rem;"
            role="status">
            <span class="sr-only"></span>
          </div>
        </div>
          
         
        <p *ngIf="!EduImageUrl; else imageView">
            <ngx-doc-viewer [url]="EduViewURL" viewer="google" style="width:100%;height:100vh;"></ngx-doc-viewer>
          </p>
          
            
            <ng-template #imageView>
              <img [src]="EduImageUrl" alt="My Image" class="modal-image">
            </ng-template> 
         
        </div>
        <div class="modal-footer">
        </div>
      </div>
    </div>
