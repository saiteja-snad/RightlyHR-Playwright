<div class="custom-main-component-container">
    <div class="component-header-content">
          <div class="heading-content">
            <div class="commpoment-name">Time off<span class="ms-2">>></span></div>
            <div class="component-header">Regularizations</div>
            <div>
                <img src="\icons\moduelicon.png" alt="Icon" placement="bottom" [ngbPopover]="popContent" class="module-icon">
            </div>
        </div>
        <div class="d-flex align-items-center gap-3">
            <label class="form-label custom-label m-0">{{'My Team'| translate}}</label>
            <div class="custom-p-select-content">
                <p-select [options]="getEmployeeInfo" optionLabel="fullName" optionValue="employeeId"
                    class="form-select custom-select" name="myteamemployees" placeholder="Select Employee Name"
                    [filter]="true" required (onChange)="onCheckemployee($event.value)">
                </p-select>
            </div>
        </div>
    </div>

   <!--Module Information-->
    <ng-template #popContent>
        <app-module-information [moduleInfo]="moduleinfo"  />
    </ng-template>


    <div class="d-flex gap-3 w-100">
        <div class="component-left-tabs-container">
            <app-regularization-tabs />
        </div>

        <div class="component-right-content">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
