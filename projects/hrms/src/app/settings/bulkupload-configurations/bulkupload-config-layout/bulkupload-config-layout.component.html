<div class="custom-main-component-container">
    <div class="component-header-content d-flex justify-content-between align-items-center">
        <app-settings-header />
        <div class="d-flex align-items-center gap-2">
            @if (isActiveRoute('/settings/bulkupload-configurations/historylog')) {
            <button type="button" class="custom-btn btn-secondary position-relative text-nowrap" (click)="toggleHistoryFilters()">
                <i class="bi bi-funnel me-2"></i>{{ 'Filters' | translate }}
                <span *ngIf="isFilterIndicatorActive" class="filter-indicator"></span>
            </button>
            }
            @if (store.response() && store.currentStage() === 'VALIDATE' && !isActiveRoute('/settings/bulkupload-configurations/historylog')) {
            <div>
                <button class="float-end custom-btn btn-secondary" (click)="reUploadInput.click()">
                    <i class="bi bi-arrow-clockwise me-2"></i>{{'Re-Upload'}}
                </button>
                <input #reUploadInput type="file" hidden accept=".xlsx, .xls, .csv"
                    (change)="onModalFileSelected($event, true)">
            </div>
            }
        </div>
    </div>

    <div class="employee-fields-main-container d-flex gap-3 w-100">
        <div class="component-left-tabs-container">
            <app-bulkupload-sidebar-tabs />
        </div>
        <div class="custom-setting-right-content">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
