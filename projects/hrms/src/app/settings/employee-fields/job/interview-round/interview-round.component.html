<div class="custom-main-component-container">
    <form [formGroup]="interviewForm" (ngSubmit)="onSubmit()"  *ngIf="rbac.allowedToAccess('interview round.create')">
        <!-- Add Input-->
        <div class="mb-4">
            <div class="custom-settings-add-input input-group">
                <input type="text" class="form-control custom-input" placeholder="Please enter Interview "
                    formControlName="interview" aria-label="interview" aria-describedby="interview"
                    (keydown)="formValidations.restrictInput($event); formValidations.blockNonAlphabets($event)">
                <span class="input-group-text" id="gender">
                    <button type="submit" class="custom-btn btn-primary" [disabled]="interviewForm.invalid">{{'Add'|translate}}</button>
                </span>
            </div>
            <div *ngIf="interviewForm.get('interview')?.touched && interviewForm.get('interview')?.invalid" class="error-msg">
                <div *ngIf="interviewForm.get('interview')?.errors?.['required']">{{'interview round is required'|translate}}</div>
            </div>
        </div>
    </form>

    <!--Data Content-->
    <div class="custom-settings-data-table">
        <table class="w-100">
            <thead>
                <tr>
                    <th class="col-span-2"></th>
                </tr>
            </thead>
            <tbody>
                @if (rbac.allowedToAccess('interview.view')) {
                @for (interview of interviewdetails; track $index) {
                <tr>
                    <td class="w-75">{{ interview.roundname}}</td>
                    <td class="w-25">
                        <div class="d-flex gap-4">
                            <!--Update-->
                            <div>
                                <a (click)="openupdate(interview)">
                                    <img src="/settings-icon/edit.png" alt="edit icon" class="settings-common-icon">
                                </a>
                            </div>
                            <!--Delete-->
                            <div>
                                <a (click)="opendelete(interview)">
                                    <img src="/settings-icon/trash-2.png" alt="edit icon" class="settings-common-icon">
                                </a>
                            </div>
                        </div>
                    </td>
                </tr>
                }
                }
            </tbody>
        </table>
    </div>
</div>

<!--Update popup-->
<ng-template #updatepopup let-modal>
    <form [formGroup]="updateForm" >
        <div class="custom-main-popup-container" ngbAutofocus>
            <div class="custom-poup-header-content popup-header-border">
                <div class="pt-2">
                    <p class="popup-heading mb-0">{{'Edit interview '|translate}}</p>
                </div>
                <div>
                    <a (click)="close(modal)"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
                </div>
            </div>
            <div class="custom-main-popup-content">
                <div class="mb-4">
                    <label for="exampleFormControlInput1" class="form-label custom-label mb-2">{{'interview'|translate}}
                        <span class="error-msg">*</span></label>
                    <input type="text" class="form-control custom-input" formControlName="roundname1"
                        placeholder="Please enter round name" 
                        (keydown)="formValidations.restrictInput($event); formValidations.blockNonAlphabets($event)">
                    <div *ngIf="updateForm.get('roundname1')?.touched && updateForm.get('roundname1')?.invalid" class="error-msg mt-2">
                        <div *ngIf="updateForm.get('roundname1')?.errors?.['required']">{{'Round  name is required'|translate}}</div>
                    </div>
                </div>
                <div class="custom-modal-footer">
                    <button type="button" class="custom-btn btn-secondary" (click)="close(modal)">{{'Close'|translate}}</button>
                    <button type="submit" class="custom-btn btn-primary" (click)="updateinterview(modal)" [disabled]="updateForm.invalid">
                        {{'Update'|translate}}</button>
                </div>
            </div>
        </div>
    </form>
</ng-template>

<!--Delete Confirmation popup-->
<ng-template #deletepopup let-modal>
    <div class="result-popup-content" ngbAutofocus>
        <div>
            <img src="/icons/delete-icon.png" alt="delete-icon" class="confirmation-delete-icon">
            <p class="confirmation-text">{{'Are you sure you want to Delete?'|translate}}</p>
        </div>
        <div class="custom-modal-footer">
            <button type="button" class="custom-btn btn-secondary" (click)="closeDelete(modal)">
                {{'No'|translate}}</button>
            <button type="button" class="custom-btn btn-primary"
                (click)="onDeleteinterview(modal)">{{'Yes'|translate}}</button>
        </div>
    </div>
</ng-template>
