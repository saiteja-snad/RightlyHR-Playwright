<div class="custom-main-component-container mt-3">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <p class="main-content-heading cursor mb-0">Permission</p>
        </div>
        <div class="d-flex gap-3">
            <button type="button" class="custom-btn btn-primary" (click)="openModal(addpremission)"><i
                    class="bi bi-plus me-2"></i>Request
                Permission</button>
        </div>
    </div>
    <div class="row">
        <div class="col-4">
            <app-premissions-tabs></app-premissions-tabs>
        </div>
        <div class=" col-8">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>

<ng-template #addpremission let-modal>
    <div class="custom-main-popup-container" ngbAutofocus>
        <div class="d-flex justify-content-between popup-header-border p-4">
            <div class="pt-2">
                <p class="popup-heading mb-0">Request Premission</p>
            </div>
            <div>
                <a (click)="modal.dismiss()"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
            </div>
        </div>
        <div class="custom-main-popup-content p-4">
            <form [formGroup]="permissionForm" (ngSubmit)="applyPermission(permissionForm)">
                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label for="Date" class="form-label custom-label mb-2">Date<span
                                class="text-danger">*</span></label>
                        <input type="date" class="form-control custom-input" formControlName="permissionDate"  id="Date"
                            onkeydown="return false" placeholder="Select Date" />
                    </div>
                </div>
                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="duration" class="form-label custom-label mb-2">Duration<span
                                class="text-danger">*</span></label>
                        <div class="custom-p-select-content">
                            <p-select [options]="duration" optionLabel="name"  id="duration" formControlName="duration" placeholder="Please select duration"
                            class="form-select custom-select" />
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="leaveType" class="form-label custom-label mb-2">Premission Type<span
                                class="text-danger">*</span></label>
                        <div class="custom-p-select-content">
                            <p-select [options]="leaveTypes" optionLabel="name" formControlName="leaveType"
                                placeholder="Please select permission type" id="leaveType" class="form-select custom-select" />
                        </div>
                    </div>

                </div>


                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label for="reason" class="form-label custom-label mb-2">Reason <span
                                class="text-danger">*</span></label>
                        <textarea class="form-control custom-input" formControlName="reason" id="reason"  rows="3"
                        placeholder="Type here"
                            placeholder="Type Here"></textarea>
                    </div>

                </div>
                <div class="d-flex justify-content-end gap-3 mt-4">
                    <button type="reset" class="custom-btn btn-secondary" (click)="modal.dismiss()">Close</button>
                    <button type="submit" class="custom-btn btn-primary" [disabled]="permissionForm.invalid || spinnerLoader">
                         @if(spinnerLoader){
                        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                        <span >{{'Loading..'}}...</span>
                        }@else {
                        <span>{{'Request'}}</span>
                        }</button>
                </div>
            </form>
        </div>
    </div>
</ng-template>
