<div class="cards-grid-container">
    <div *ngFor="let tab of filteredTabs;">
        <div class="settings-sub-tabs-card" [routerLink]="tab.link">
            <div class="sub-tabs-header">
                <img [src]="tab.icon" alt="Icon" class="icon">
                <div class="label-name">{{ tab.label }}</div>
            </div>
            <div class="subject-text">{{tab.description}}</div>
        </div>
    </div>
</div>
