<div class="custom-main-component-container">
    <div class="d-flex justify-content-between align-items-center">
        <div> <span class="family-sub-header">Bank Details</span></div>
        <div class="plus-button">
            <span class="anchor"><i class="bi bi-plus plus-icon px-2 "></i><span type="button"
                    (click)="openModal(addBankModal)" class="plus-text">Add
                    New</span></span>
        </div>
    </div>
    <div class="custom-table-content mt-2">
        <table class="w-100">
            <thead>
                <tr>
                    <th>Bank Name</th>
                    <th>Account Name</th>
                    <th>Account Number</th>
                    <th>IFSC Code</th>
                    <th>Proof</th>
                    <th>Primary Bank</th>
                    
                    <th class="text-center">Actions</th>

                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>b.tech</td>
                    <td>sasi</td>
                    <td>ff</td>
                    <td>67.9</td>
                   

                    <td> <a type="button" class="me-2 dowload-text"><i class="bi bi-download  me-2"></i>Download</a>
                    </td>
                    <td>no</td>
                    <td class="text-center">
                        <div class="dropdown">
                            <span type="button" data-bs-toggle="dropdown">
                                <i class="bi bi-three-dots-vertical"></i>
                            </span>
                            <ul class="dropdown-menu custom-dropdown-menu">
                                <li (click)="openModal(updateEducationmodal)"><a class="dropdown-item"><i
                                            class="bi bi bi-pencil  me-2"></i>Update</a></li>
                                <li><a class="dropdown-item"><i class="bi bi bi-trash3 me-2"></i>Delete</a></li>

                            </ul>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<ng-template #addBankModal let-modal>
    <div class="custom-main-popup-container" ngbAutofocus>
        <div class="d-flex justify-content-between popup-header-border p-4">
            <div class="pt-2">
                <p class="popup-heading mb-0">Add New Bank Details</p>
            </div>
            <div>
                <a (click)="modal.dismiss()"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
            </div>
        </div>
        <div class="custom-main-popup-content p-4">
            <form action="">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Bank Name<span
                                class="text-danger">*</span></label>
                        <div class="custom-p-select-content">
                            <p-select [options]="educationtypes" optionLabel="name"
                                placeholder="Please select bank name" class="form-select custom-select" />
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Account Holder's
                            Name<span class="text-danger">*</span></label>
                        <input type="type" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="`Please enter account holder's name">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Account Number<span
                                class="text-danger">*</span></label>
                        <input type="number" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter account number">

                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">IFSC Code<span
                                class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter IFSC code">

                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label class="form-label custom-label mb-2">Attachment (Image and PDF only)<span
                                class="text-danger">*</span></label>
                        <input type="file" class="form-control custom-input" />
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <div class=" d-flex align-items-center">
                            <div class="form-check form-switch" style="font-size: x-large; margin-right: 4px;">
                                <input class="form-check-input" type="checkbox" id="flexSwitchCheckCheckedIsPrimary"
                                    [checked]="true" />
                            </div>
                            <p for="flexSwitchCheckCheckedIsPrimary" class="form-label custom-label mt-3 ">Primary Bank
                            </p>
                        </div>
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-3 mt-4">
                    <button type="reset" class="custom-btn btn-secondary" (click)="modal.dismiss()">Close</button>
                    <button type="submit" class="custom-btn btn-primary">Add</button>
                </div>
            </form>
        </div>
    </div>
</ng-template>


<ng-template #updateEducationmodal let-modal>
    <div class="custom-main-popup-container" ngbAutofocus>
        <div class="d-flex justify-content-between popup-header-border p-4">
            <div class="pt-2">
                <p class="popup-heading mb-0">Add Education Details</p>
            </div>
            <div>
                <a (click)="modal.dismiss()"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
            </div>
        </div>
        <div class="custom-main-popup-content p-4">
            <form action="">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Education<span
                                class="text-danger">*</span></label>
                        <div class="custom-p-select-content">
                            <p-select [options]="educationtypes" optionLabel="name"
                                placeholder="Please select education*" class="form-select custom-select" />
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">University<span
                                class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter university">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Specialization<span
                                class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter specialization">

                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">GPA<span
                                class="text-danger">*</span></label>
                        <input type="number" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter GPA">

                    </div>
                </div>
                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">From Date<span
                                class="text-danger">*</span></label>
                        <input type="date" class="form-control custom-input" id="exampleFormControlInput1">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">To Date<span
                                class="text-danger">*</span></label>
                        <input type="date" class="form-control custom-input" id="exampleFormControlInput1">
                    </div>

                </div>
                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label class="form-label custom-label">Attachment (Image and PDF only)<span
                                class="text-danger">*</span></label>
                        <input type="file" class="form-control custom-input" />
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-3 mt-4">
                    <button type="reset" class="custom-btn btn-secondary" (click)="modal.dismiss()">Close</button>
                    <button type="submit" class="custom-btn btn-primary">Update</button>
                </div>
            </form>
        </div>
    </div>
</ng-template>
