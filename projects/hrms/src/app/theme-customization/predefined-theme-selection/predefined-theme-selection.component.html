<div class="themes-container">
    <!-- Appearance -->
    <div class="component-header mb-3">{{'Appearance' | translate}}</div>
    <div class="themes-grid mb-4">
        <div class="theme-content appearance-content" [class.confirmedTheme]="confirmedAppearance === appearance.value"
            *ngFor="let appearance of appearances" [class.selected]="selectedAppearance === appearance.value"
            (click)="selectedAppearanceMode(appearance.value)">
            <div class="check-icon" *ngIf="selectedAppearance === appearance.value">
                <i class="bi bi-check-circle"></i>
            </div>
            <div class="theme-preview" [ngClass]="appearance.class">
                <i class="bi" [ngClass]="appearance.icon"></i>
            </div>
            <div class="theme-name">{{ appearance.name | translate }}</div>
        </div>
    </div>

    <!-- Colors -->
    <div class="component-header mb-3">{{'Theme Colors' | translate}}</div>
    <div class="themes-grid mb-4">
        <div class="theme-content" [class.confirmedTheme]="confirmedTheme === theme.value"
            *ngFor="let theme of themes" [class.selected]="selectedTheme === theme.value"
            (click)="selectedThemeColor(theme.value)">
            <div class="check-icon" *ngIf="selectedTheme === theme.value">
                <i class="bi bi-check-circle"></i>
            </div>
            <div class="theme-preview" [ngClass]="theme.class"></div>
            <div class="theme-name">{{ theme.name }}</div>
        </div>
    </div>

    <!-- Fonts -->
    <div class="component-header mb-3">{{'Font Styles' | translate}}</div>
    <div class="themes-grid">
        <div class="theme-content font-content" [class.confirmedFont]="confirmedFont === font.value" *ngFor="let font of fonts"
            [class.selected]="selectedFont === font.value" (click)="selectedFontFamily(font.value)">
            <div class="check-icon" *ngIf="selectedFont === font.value"></div>
            <div class="theme-name">{{ font.name }}</div>
        </div>
    </div>
</div>
