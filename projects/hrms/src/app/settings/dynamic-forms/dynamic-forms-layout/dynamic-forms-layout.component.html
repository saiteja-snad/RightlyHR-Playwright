<div class="custom-main-component-container">
    @if (router.url !== '/settings/dynamic-forms/create-form' && router.url !== '/settings/dynamic-forms/view-form'
    && router.url !== '/settings/dynamic-forms/update-form') {
    <!--header-->
    <div class="component-header-content">
        <div class="heading-content">
            <app-settings-header />
        </div>

        <div>
            @if (rbac.allowedToAccess('Dynamic Forms Module.create')) {
            <button class="custom-btn btn-primary" (click)="navigateToCreateFormComponent()">Create a Form</button>
            }
        </div>
    </div>

    <div class="d-flex gap-3 w-100">
        <div class="card custom-component-right-content">
            <router-outlet></router-outlet>
        </div>
    </div>
    } @else {
    <router-outlet />
    }
</div>
