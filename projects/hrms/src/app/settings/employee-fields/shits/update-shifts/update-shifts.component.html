<div class="custom-main-component-container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <p class="component-header cursor mb-0" (click)="nagvition()"><i class="bi bi-arrow-90deg-left me-2"></i>
                Add Shits</p>
        </div>
    </div>
    <div class="component-nav-tabs-container card px-2 mb-3">
        <p-tabs value="0" scrollable>
            <p-tablist>
                <ng-container *ngFor="let tab of navTabs;">
                    <p-tab [value]="tab.link">
                        <a [routerLink]="tab.link" routerLinkActive="nav-tab-active" class="nav-link">
                            {{ tab.label }}
                        </a>
                    </p-tab>
                </ng-container>
            </p-tablist>
        </p-tabs>
    </div>


    <div class="card custom-card">
        <div class="p-3">
            <div>
                <form [formGroup]="shiftForm" (ngSubmit)="updateshift(shiftForm)">
                    <div class="row g-2 mb-3">
                        <!-- Year -->
                        <div class="col-md-3 mb-3">
                            <label class="form-label custom-label mb-2">Year <span class="text-danger">*</span></label>
                            <div class="custom-p-select-content">
                                <p-select formControlName="year" placeholder="Select Year" [options]="years"
                                    class="form-select custom-select"></p-select>
                            </div>

                            <div class="error-msg"
                                *ngIf="shiftForm.controls['year'].invalid && 
                                                        (shiftForm.controls['year'].touched || shiftForm.controls['year'].dirty)">
                                <div *ngIf="shiftForm.controls['year'].errors?.['required']">
                                    Year is required
                                </div>
                            </div>
                        </div>

                        <!-- Location -->
                        <div class="col-md-3 mb-3">
                            <label class="form-label custom-label mb-2">Location <span
                                    class="text-danger">*</span></label>
                            <div class="custom-p-select-content">
                                <p-select formControlName="location" placeholder="Select Sub Location"
                                    optionLabel="jobLocationName" optionValue="id" class="form-select custom-select"
                                    [disabled]="!shiftForm.get('location')?.valid" [options]="locations">
                                </p-select>
                            </div>

                            <div class="error-msg"
                                *ngIf="shiftForm.controls['location'].invalid &&  (shiftForm.controls['location'].touched || shiftForm.controls['location'].dirty)">
                                <div *ngIf="shiftForm.controls['location'].errors?.['required']">
                                    Location is required
                                </div>
                            </div>
                        </div>

                        <!-- Sub Location -->
                        <div class="col-md-3 mb-3">
                            <label class="form-label custom-label mb-2">Sub Location <span
                                    class="text-danger">*</span></label>
                            <div class="custom-p-select-content">
                                <!-- <p-select formControlName="subLocation" placeholder="Select Sub Location" optionLabel="jobSubLocationName" optionValue="id"
                                    class="form-select custom-select" [disabled]="!shiftForm.get('location')?.valid"
                                    [options]="subLocations">
                                </p-select> -->
                                <p-select formControlName="subLocation" placeholder="Select Sub Location"
                                    optionLabel="jobSubLocationName"  optionValue="id" [options]="sublocation"
                                    [disabled]="!shiftForm.get('location')?.valid" class="form-select custom-select">
                                </p-select>
                            </div>
                            <div class="error-msg"
                                *ngIf="shiftForm.controls['subLocation'].invalid && 
                                                        (shiftForm.controls['subLocation'].touched || shiftForm.controls['subLocation'].dirty)">
                                <div *ngIf="shiftForm.controls['subLocation'].errors?.['required']">
                                    Sub Location is required
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3 mb-3 mt-5">
                            <button type="button" class="custom-btn btn-primary" (click)="addShift()">
                                <i class="bi bi-plus me-2"></i> Add New Shift
                            </button>
                        </div>
                    </div>
                    <div formArrayName="shifts">
                        <div *ngFor="let shift of shifts.controls; let i = index" [formGroupName]="i"
                            class="card p-3 mb-4 custom-shift-item-card">

                            <div class="row mb-3">
                                <!-- Shift Code -->
                                <div class="col-md-2">
                                    <label class="form-label custom-label">Shift Code<span
                                            class="text-danger">*</span></label>
                                    <input type="text" class="form-control custom-input" formControlName="shiftCode"
                                        placeholder="Please enter shift code" />
                                    <div *ngIf="shift.get('shiftCode')?.invalid && (shift.get('shiftCode')?.dirty || shift.get('shiftCode')?.touched)"
                                        class="error-msg">
                                        <span *ngIf="shift.get('shiftCode')?.errors?.['required']">Shift code is
                                            required</span>
                                    </div>
                                </div>

                                <!-- Shift Name -->
                                <div class="col-md-2">
                                    <label class="form-label custom-label">Shift Name<span
                                            class="text-danger">*</span></label>
                                    <input type="text" class="form-control custom-input" formControlName="shiftName"
                                        placeholder="Please enter shift name" />
                                    <div *ngIf="shift.get('shiftName')?.invalid && (shift.get('shiftName')?.dirty || shift.get('shiftName')?.touched)"
                                        class="error-msg">
                                        <span *ngIf="shift.get('shiftName')?.errors?.['required']">Shift name is
                                            required</span>
                                    </div>
                                </div>

                                <!-- Color -->
                                <div class="col-md-2">
                                    <label class="form-label custom-label">Color</label>
                                    <input type="color" class="form-control custom-input" formControlName="color" />
                                </div>

                                <!-- Start Time -->
                                <div class="col-md-2">
                                    <label class="form-label custom-label">Start Time<span
                                            class="text-danger">*</span></label>
                                    <input type="time" class="form-control custom-input" formControlName="startTime" />
                                    <div *ngIf="shift.get('startTime')?.invalid && (shift.get('startTime')?.dirty || shift.get('startTime')?.touched)"
                                        class="error-msg">
                                        <span *ngIf="shift.get('startTime')?.errors?.['required']">Start time is
                                            required</span>
                                    </div>
                                </div>

                                <!-- End Time -->
                                <div class="col-md-2">
                                    <label class="form-label custom-label">End Time<span
                                            class="text-danger">*</span></label>
                                    <input type="time" class="form-control custom-input" formControlName="endTime" />
                                    <div *ngIf="shift.get('endTime')?.invalid && (shift.get('endTime')?.dirty || shift.get('endTime')?.touched)"
                                        class="error-msg">
                                        <span *ngIf="shift.get('endTime')?.errors?.['required']">End time is
                                            required</span>
                                    </div>
                                </div>
                            </div>
                            <div class="row mb-3">

                                <!-- Grace Period -->
                                <div class="col-md-2">
                                    <label class="form-label custom-label">Grace Period</label>
                                    <input type="number" class="form-control custom-input" formControlName="gracePeriod"
                                        placeholder="Grace period" />
                                </div>

                                <!-- Lates Allowed -->
                                <div class="col-md-2">
                                    <label class="form-label custom-label">Lates Allowed</label>
                                    <input type="number" class="form-control custom-input"
                                        formControlName="latesAllowed" placeholder="Lates allowed" />
                                </div>

                                <!-- Break Time -->
                                <div class="col-md-2">
                                    <label class="form-label custom-label">Break Time</label>
                                    <input type="number" class="form-control custom-input" formControlName="breakTime"
                                        placeholder="Break time" />
                                </div>

                                <!-- Half Day Minimum Hours -->
                                <div class="col-md-2">
                                    <label class="form-label custom-label">Half Day Min Hrs</label>
                                    <input type="number" class="form-control custom-input"
                                        formControlName="halfDayMinHrs" placeholder="Half day min hrs" />
                                </div>

                                <!-- Full Day Minimum Hours -->
                                <div class="col-md-2">
                                    <label class="form-label custom-label">Full Day Min Hrs</label>
                                    <input type="number" class="form-control custom-input"
                                        formControlName="fullDayMinHrs" placeholder="Full day min hrs" />
                                </div>

                                <!-- Delete Icon -->
                                <div class="col-md-2 mt-4 d-flex align-items-center justify-content-end">
                                    <button type="button" class="custom-icon btn" (click)="shifts.removeAt(i)">
                                        <i class="bi bi-trash text-danger"></i>
                                    </button>
                                </div>
                            </div>

                        </div>

                    </div>

                    <div class=" d-flex justify-content-end gap-3 p-3">
                        <button type="button" class="custom-btn btn-secondary" (click)="Cancel()">Cancel</button>
                        <button type="button" class="custom-btn btn-secondary" *ngIf="!hideBUTTON" (click)="cloneshiftsPolicy1(shiftId)" [disabled]="shiftForm.invalid">Clone</button>
                        <button type="button" class="custom-btn btn-secondary" *ngIf="!hideBUTTON" (click)="publish()" [disabled]="shiftForm.invalid">Publish</button>
                        <button type="submit" class="custom-btn btn-primary"
                            [disabled]="shiftForm.invalid">Submit</button>
                    </div>

                </form>
            </div>


        </div>

    </div>
</div>
<!--Delete Confirmation popup-->
<ng-template #deletepopup let-modal>
    <div class="modal-body" ngbAutofocus>
        <div class="custom-main-popup-content text-center p-4">
            <div class="py-4">
                <img src="/icons/delete-icon.png" alt="delete-icon" class="confirmation-icon mb-4">
                <p class="confirmation-text">{{'Are you sure you want to Cancel?'|translate}}</p>
            </div>
            <div class="d-flex gap-5 pt-2 w-100">
                <button type="button" class="custom-btn btn-secondary w-50 py-2"(click)="closeDelete(modal)">{{'No'|translate}}</button>
                <button type="button" class="custom-btn btn-primary w-50 py-2" (click)="onDelete(modal)">{{'Yes'|translate}}</button>
            </div>
        </div>
    </div>
  </ng-template>
