<div class="component-nav-tabs-container card ">
    <p-tabs value="0" scrollable>
        <p-tablist>
            <ng-container *ngFor="let tab of filteredTabs;">
                <p-tab [value]="tab.link">
                    <a (click)="navigateWithFilters(tab.link)" class="nav-link cursor" 
                    [class.active-nav-link]="isDocumentTabActive(tab.link)" >{{ tab.label | translate }}</a>
                </p-tab>
            </ng-container>
        </p-tablist>
    </p-tabs>
</div>
