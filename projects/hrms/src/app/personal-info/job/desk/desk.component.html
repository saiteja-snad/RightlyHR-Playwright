<div>
    <div class="custom-table-content mt-2">
        <table class="w-100">
            <thead>
                <tr>
                    <th>DESK ID </th>
                    <th>DESK TYPE</th>
                    <th>DESK STAUS</th>
                    <th>ALLOCATED DATE</th>
                    <th>RELEASED DATE</th>
                </tr>
            </thead>
            <tbody>
                <ng-container *ngIf="((deskdata | async) ?? []).length > 0; else noDataTemplate">
                    <tr *ngFor="let data of deskdata | async">
                        <td>{{ data.deskName }}</td>
                         <td>{{ data.deskType }}</td>  
                         <td>{{ data.status }}</td>
                         <td>{{ data.allocatedDate |dateformat }}</td>
                         <td>{{ data.releavedDate ? (data.releavedDate | dateformat) : 'N/A' }}</td>

                       </tr>
                </ng-container>
            
                <ng-template #noDataTemplate>
                    <tr>
                        <td>
                            <app-no-data-found />
                        </td>
                    </tr>
                </ng-template>
            </tbody>
        </table>
    </div>
</div>
