<div class="custom-main-component-container">
    <form [formGroup]="CompensationForm" (ngSubmit)="addReason()" *ngIf="rbac.allowedToAccess('Compensation Reason.create')">
        <!-- Add Input-->
        <div class="mb-4">
            <div class="custom-settings-add-input input-group">
                <input type="text" class="form-control custom-input" placeholder="Please enter compensation reason"
                    formControlName="Reason" aria-label="reason" aria-describedby="reason"
                    (keydown)="formValidations.restrictInput($event); formValidations.blockNonAlphabets($event)">
                <span class="input-group-text" id="reason">
                    <button type="submit" class="custom-btn btn-primary"
                        [disabled]="CompensationForm.invalid">{{'Add'|translate}}</button></span>
            </div>
            <div *ngIf="CompensationForm.get('Reason')?.touched && CompensationForm.get('Reason')?.invalid" class="error-msg mt-2">
                <div *ngIf="CompensationForm.get('Reason')?.errors?.['required']">{{'Compensation reason is required'|translate}}</div>
            </div>
        </div>
    </form>

    <!--Data Content-->
    <div class="custom-settings-data-table">
        <table class="w-100">
            <thead>
                <tr>
                    <th class="col-span-2"></th>
                </tr>
            </thead>
            <tbody>
                @for (reason of CompensationReason; track $index) {
                <tr>
                    <td class="w-75">{{ reason.reason}}</td>
                    <td class="w-25">
                        <div class="d-flex gap-4">
                            <!--Update-->
                            <div>
                                <a (click)="openupdate(reason)" *ngIf="rbac.allowedToAccess('Compensation Reason.update')"><img src="/settings-icon/edit.png" alt="edit icon"
                                        class="settings-common-icon"></a>
                            </div>
                            <!--Delete-->
                            <div>
                                <a (click)="opendelete(reason)" *ngIf="rbac.allowedToAccess('Compensation Reason.delete')"><img src="/settings-icon/trash-2.png" alt="edit icon"
                                        class="settings-common-icon"></a>
                            </div>
                        </div>
                    </td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>

<!--Update popup-->
<ng-template #updatepopup let-modal>
    <form [formGroup]="updateForm">
        <div class="custom-main-popup-container" ngbAutofocus>
            <div class="d-flex justify-content-between popup-header-border p-3">
                <div class="pt-2">
                    <p class="popup-heading mb-0">{{'Edit Compensation Reason'|translate}}</p>
                </div>
                <div>
                    <a (click)="close(modal)"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
                </div>
            </div>
            <div class="custom-main-popup-content p-4">
                <div class="mb-4">
                    <label for="exampleFormControlInput1" class="form-label custom-label mb-2">{{'Compensation Reason'|translate}}
                        <span class="error-msg">*</span></label>
                    <input type="text" class="form-control custom-input" formControlName="UpdateReason" placeholder="Please enter compensation reason"
                    (keydown)="formValidations.restrictInput($event); formValidations.blockNonAlphabets($event)">
                    <div *ngIf="updateForm.get('UpdateReason')?.touched && updateForm.get('UpdateReason')?.invalid" class="error-msg mt-2">
                        <div *ngIf="updateForm.get('UpdateReason')?.errors?.['required']">{{'Compensation reason is required'|translate}}</div>
                    </div>
                </div>
                <div class="d-flex gap-5 w-100 pt-3">
                    <button type="button"  class="custom-btn btn-secondary w-50 py-2" (click)="close(modal)">{{'Close'|translate}}</button>
                    <button type="button"  class="custom-btn btn-primary w-50 py-2" (click)="updateReason(modal)" [disabled]="updateForm.invalid">{{'Update'|translate}}</button>
                </div>
            </div>
        </div>
    </form>
</ng-template>

<!--Delete Confirmation popup-->
<ng-template #deletepopup let-modal>
    <div class="modal-body" ngbAutofocus>
        <div class="custom-main-popup-content text-center p-4">
            <div class="py-4">
                <img src="/icons/delete-icon.png" alt="delete-icon" class="confirmation-icon mb-4">
                <p class="confirmation-text">{{'Are you sure you want to Delete?'|translate}}</p>
            </div>
            <div class="d-flex gap-5 pt-2 w-100">
                <button type="button" class="custom-btn btn-secondary w-50 py-2"(click)="closeDelete(modal)">{{'No'|translate}}</button>
                <button type="button" class="custom-btn btn-primary w-50 py-2" (click)="onDelete(modal)">{{'Yes'|translate}}</button>
            </div>
        </div>
    </div>
</ng-template>
