<div class="custom-main-component-container">
    <div class="card myinfo-content-card p-4">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <span class="myinfo-sub-header">Onboarding Details</span>
            </div>
            <div *ngIf="!buttons">
                <a (click)="showButtons()"><i class="bi bi-pencil-square"></i></a>
            </div>
            <div class="d-flex justify-content-end gap-3" *ngIf="buttons">
                <button type="reset" class="custom-btn btn-secondary" (click)="showButtons()">Close</button>
                <button type="submit" class="custom-btn btn-primary" (click)="showButtons()">Save</button>
            </div>
        </div>

        <!--input content-->
        <div class="myinfo-input-content">
            <form action="">
                <div class="row">
                    <div class="col-md-6 col-lg-4 mb-4">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Status<span
                                class="text-danger">*</span></label>
                        <input type="date" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter status">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-4">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Duration of
                            Training<span class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter duration of training">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-4">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Training End
                            Date<span class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter offer sent status">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-4">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Date Of Joining

                            <span class="text-danger">*</span></label>
                        <input type="date" class="form-control custom-input" id="exampleFormControlInput1">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-4">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Branch Location /
                            Code
                            <span class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter branch location /code">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Probation End Date

                            Status<span class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter probation end date">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-4">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Probation Status
                            <span class="text-danger">*</span></label>
                        <input type="date" class="form-control custom-input" id="exampleFormControlInput1">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-4">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Notice Period Status
                            Sent By<span class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter trainee offer sent by">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-4">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Background Check
                            Status
                            <span class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter trainee offer sent status">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Salary Hold
                            <span class="text-danger">*</span></label>
                        <input type="date" class="form-control custom-input" id="exampleFormControlInput1">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">PF
                            <span class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter trainee offer sent by">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">ESIC
                            <span class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter trainee appointment sent status">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">PT
                            <span class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter trainee appointment sent status">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Total Previous Years
                            Experience
                            <span class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter trainee appointment sent status">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Remote Login
                            <span class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter trainee appointment sent status">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Work Location
                            <span class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter trainee appointment sent status">
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
