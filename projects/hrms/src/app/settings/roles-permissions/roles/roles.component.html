<div class="card main-settings-layout p-4">
    <!-- Add Input-->
    <div>
        <div class="custom-settings-add-input input-group mb-5">
            <input type="text" class="form-control custom-input" placeholder="Please enter role"
                aria-label="role" aria-describedby="role">
            <span class="input-group-text" id="role"><button type="button"
                    class="custom-btn btn-primary">Add</button></span>
        </div>
    </div>
    <!--Data Content-->
    <div>
        <div class="custom-settings-data-table">
            <table class="w-100">
                <thead>
                    <th class="col-span-2"></th>
                </thead>
                <tbody>
                    <tr>
                        <td class="w-75">Admin</td>
                        <td class="w-25">
                            <div class="d-flex gap-4">
                                <!--Update-->
                                <div>
                                    <a (click)="openupdate()"><img src="/settings-icon/edit.png" alt="edit icon"
                                            class="settings-common-icon"></a>
                                </div>
                                <!--Delete-->
                                <div>
                                    <a (click)="opendelete()"><img src="/settings-icon/trash-2.png" alt="edit icon"
                                            class="settings-common-icon"></a>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!--Update popup-->
<ng-template #updatepopup let-modal>
    <div class="custom-main-popup-container" ngbAutofocus>
        <div class="d-flex justify-content-between popup-header-border p-4">
            <div class="pt-2">
                <p class="popup-heading mb-0">Update</p>
            </div>
            <div>
                <a (click)="close()"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
            </div>
        </div>
        <div class="custom-main-popup-content p-5">
            <div class="mb-4">
                <label for="exampleFormControlInput1" class="form-label custom-label mb-2">role<span class="error-msg">*</span></label>
                <input type="text" class="form-control custom-input" formControlName="firstName"
                    placeholder="Please enter role">
            </div>
            <div class="d-flex gap-5 pt-4 w-100">
                <button class="custom-btn btn-secondary w-50 py-3">Close</button>
                <button class="custom-btn btn-primary w-50 py-3">Update</button>
            </div>
        </div>
    </div>
</ng-template>

<!--Delete Confirmation popup-->
<ng-template #deletepopup let-modal>
    <div class="modal-body" ngbAutofocus>
        <div class="custom-main-popup-content text-center p-4">
            <div class="py-5">
                <img src="/icons/delete-icon.png" alt="delete-icon" class="confirmation-icon mb-5">
                <p class="confirmation-text">Are you sure you want to Delete?</p>
            </div>
            <div class="d-flex gap-5 pt-2 w-100">
                <button class="custom-btn btn-secondary w-50 py-3">No</button>
                <button class="custom-btn btn-primary w-50 py-3">yes</button>
            </div>
        </div>
    </div>
</ng-template>
