<div class="custom-main-component-container">
    <!-- Add Input-->
    <div class="mb-4">
        <form [formGroup]="assetCategorydata" (ngSubmit)="postasset(assetCategorydata)">
            <div class="custom-settings-add-input input-group">
                <input type="text" class="form-control custom-input" placeholder="Please enter asset Category"
                    aria-label="role" aria-describedby="role" formControlName="assetcaassetCategory">
                <span class="input-group-text" id="role">
                    <button type="submit" class="custom-btn btn-primary" [disabled]="assetCategorydata.invalid">{{'Add'|
                        translate}}</button>
                </span>
            </div>
            <div *ngIf="assetCategorydata.get('assetcaassetCategory')?.touched || assetCategorydata.get('assetcaassetCategory')?.dirty"
                class="error-msg">
                <!-- Required validation message -->
                <div *ngIf="assetCategorydata.get('assetcaassetCategory')?.hasError('required')">Please enter asset
                    Category</div>
            </div>
        </form>
    </div>

    <!--Data Content-->
    <div class="custom-table-content mt-2">
        <table class="w-100">
            <thead>
                <th>Asset Category</th>
                <th>Actions</th>
            </thead>
            <tbody>
                <ng-container *ngIf="((assetCategorys | async) ?? []).length > 0; else noDataTemplate">
                    <tr *ngFor="let asset of assetCategorys | async">
                        <td>{{asset.name}}</td>
                        <td class="text-center">
                            <div class="d-flex gap-4">

                                <div>
                                    <a (click)="openupdate(updateassetcatgey, asset)"><img src="/settings-icon/edit.png"
                                            alt="edit icon" class="settings-common-icon">
                                    </a>
                                </div>

                                <div>
                                    <a (click)="opendelete(deleteconformation,asset)"><img
                                            src="/settings-icon/trash-2.png" alt="edit icon"
                                            class="settings-common-icon"></a>
                                </div>
                            </div>
                        </td>
                    </tr>
                </ng-container>

                <ng-template #noDataTemplate>
                    <tr>
                        <td>
                            <app-no-data-found />
                        </td>
                    </tr>
                </ng-template>

            </tbody>
        </table>
    </div>
</div>


<ng-template #updateassetcatgey let-modal>
    <div class="custom-main-popup-container" ngbAutofocus>
        <div class="custom-poup-header-content popup-header-border">
            <div >
                <p class="popup-heading mb-0">Update Asset Category</p>
            </div>
            <div>
                <a (click)="modal.dismiss()"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
            </div>
        </div>

        <div class="custom-main-popup-content ">
            <form [formGroup]="assetCategorydataForm"
                (ngSubmit)="updateassetscategory(assetCategorydataForm);modal.dismiss()">
                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label for="assetCategory" class="form-label custom-label mb-2">Asset Category <span
                                class="text-danger">*</span></label>
                        <input type="text" id="assetCategory" formControlName="assetcaassetCategorydata"
                            class="form-control custom-input" placeholder="Enter asset category" />
                        <small class="text-danger"
                            *ngIf="assetCategorydataForm.get('assetcaassetCategorydata')?.errors?.['required']">
                            Asset Category is required
                        </small>
                        <small class="text-danger"
                            *ngIf="assetCategorydataForm.controls['assetcaassetCategorydata'].errors?.['maxlength']">
                            Asset Category should not exceed 30 characters
                        </small>
                    </div>

                </div>
                <div class="custom-modal-footer">
                    <button type="button" class="custom-btn btn-secondary"
                        (click)="modal.dismiss();assetCategorydataForm.reset()">Close</button>
                    <button type="submit" class="custom-btn btn-primary"
                        [disabled]=" assetCategorydataForm.invalid">Update</button>
                </div>
            </form>
        </div>
    </div>
</ng-template>


<ng-template #deleteconformation let-modal>
    <div class="result-popup-content" ngbAutofocus>
        <div>
            <img src="icons\delete-icon.png" alt="failure icon" class="confirmation-delete-icon">
            <p class="confirmation-text mb-4">Are you sure you want to delete the Asset Category?</p>
        </div>
        <div class="custom-modal-footer">
            <button type="button" class="custom-btn btn-secondary" (click)="modal.dismiss()">No</button>
            <button type="submit" class="custom-btn btn-primary" (click)="deleteasstescatagorydata()">Yes</button>
        </div>
    </div>
</ng-template>
