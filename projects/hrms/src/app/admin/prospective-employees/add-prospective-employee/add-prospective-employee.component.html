<div class="custom-main-popup-container">
    <div class="d-flex justify-content-between popup-header-border p-4">
        <div class="pt-2">
            <p class="popup-heading mb-0">Add Prospective Employee</p>
        </div>
        <div>
            <a (click)="close()"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
        </div>
    </div>
    <div class="custom-main-popup-content p-4">
        <form action="">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="exampleFormControlInput1" class="form-label custom-label mb-2">First Name<span class="text-danger">*</span></label>
                    <input type="email" class="form-control custom-input" id="exampleFormControlInput1" placeholder="Please enter first name">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Middle Name<span class="text-danger">*</span></label>
                    <input type="email" class="form-control custom-input" id="exampleFormControlInput1" placeholder="Please enter middle name">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Last Name<span
                            class="text-danger">*</span></label>
                    <input type="email" class="form-control custom-input" id="exampleFormControlInput1"
                        placeholder="Please enter last name">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Personal Email ID<span class="text-danger">*</span></label>
                    <input type="email" class="form-control custom-input" id="exampleFormControlInput1" placeholder="Please enter personal email Id">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Designation<span class="text-danger">*</span></label>
                    <div class="custom-p-select-content">
                        <p-select [options]="designation" optionValue="id" optionLabel="name" placeholder="Please select designation" class="form-select custom-select" />
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Employment Type<span class="text-danger">*</span></label>
                    <div class="custom-p-select-content">
                        <p-select [options]="employeementType" optionLabel="name" placeholder="Please select employment type" class="form-select custom-select" />
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Location<span class="text-danger">*</span></label>
                    <div class="custom-p-select-content">
                        <p-select [options]="location" optionLabel="name" placeholder="Please select location" class="form-select custom-select" />
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Sub Location<span class="text-danger">*</span></label>
                    <div class="custom-p-select-content">
                        <p-select [options]="sublocation" optionLabel="name" placeholder="Please select sub location" class="form-select custom-select" />
                    </div>
                </div>
            </div>
            <div class="d-flex justify-content-end gap-3 mt-4">
                <button type="reset" class="custom-btn btn-secondary" (click)="close()">Close</button>
                <button type="submit" class="custom-btn btn-primary">Add</button>
            </div>
        </form>
    </div>
</div>
