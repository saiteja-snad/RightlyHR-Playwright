<div class="custom-main-component-container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <p class="component-header mb-0">WHF</p>
        </div>
        <div>
            <button type="button" class="custom-btn btn-primary" (click)="openModal(addwfh)"><i class="bi bi-plus me-2"></i>Request WFH</button>
        </div>
    </div>
    <div class="d-flex gap-3 w-100">
        <div class="custom-component-left-content">
            <app-wfh-approvaltabs/>
        </div>
        <div class="custom-component-right-content">
            <router-outlet/>
        </div>
    </div>
</div>

<!--Add Work Form Home-->
<ng-template #addwfh let-modal>
    <div class="custom-main-popup-container" ngbAutofocus>
        <div class="d-flex justify-content-between popup-header-border p-3">
            <div class="pt-2">
                <p class="popup-heading mb-0">Request WFH</p>
            </div>
            <div>
                <a (click)="modal.dismiss();addWFHForm.reset()"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
            </div>
        </div>

        <div class="custom-main-popup-content p-3">
            <form [formGroup]="addWFHForm" (ngSubmit)="applyWFH(addWFHForm)" class="custom-form">
                <!-- Worked Date -->
                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label for="workedDate" class="form-label custom-label mb-2">Worked Date<span
                                class="text-danger">*</span></label>
                        <input type="date" class="form-control custom-input" onkeydown="return false" id="workedDate"
                            formControlName="workedDate"[min]="alloweddates" 
                            [max]="alloweddates" (change)="getWFHBal(addWFHForm.get('workedDate')?.value)">
                            <div *ngIf="addWFHForm.get('workedDate')?.touched && addWFHForm.get('workedDate')?.invalid" class="error-msg">
                                Worked Date is required.
                              </div>
                    </div>

                    <!-- Availing -->
                    <div class="col-md-12 mb-3">
                        <label class="form-label custom-label mb-3">Availing<span class="text-danger">*</span></label>
                        <div class="d-flex gap-3">
                            <div class="form-check">
                                <input type="radio" class="form-check-input" id="halfDay" value="Half Day"
                                    formControlName="availing">
                                    
                                <label class="form-check-label custom-label" for="halfDay">Half Day</label>
            
                                <!-- Half Day Selection -->
                                <div class="row" *ngIf="addWFHForm.get('availing')?.value === 'Half Day'">
                                    <div class="col-md-12 mb-3">
                                        <label class="form-label custom-label mb-2">Select Half<span
                                                class="text-danger">*</span></label>
                                        <div class="d-flex gap-3">
                                            <div class="form-check">
                                                <input type="radio" class="form-check-input" id="firstHalf" [value]="1"
                                                    formControlName="halfType">
                                                <label class="form-check-label" for="firstHalf">First Half</label>
                                            </div>
                                            <div class="form-check">
                                                <input type="radio" class="form-check-input" id="secondHalf" [value]="3"
                                                    formControlName="halfType">
                                                <label class="form-check-label" for="secondHalf">Second Half</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-check">
                                <input type="radio" class="form-check-input" id="fullDay" value="Full Day"
                                    formControlName="availing" [value]="2" (change)="updateDuration()">
                                <label class="form-check-label custom-label" for="fullDay">Full Day</label>
                            </div>
                        </div>
                    </div>
            
                    <!-- Reason -->
                    <div class="col-md-12 mb-3">
                        <label for="reason" class="form-label custom-label mb-2">Reason<span class="text-danger">*</span></label>
                        <textarea class="form-control custom-input" id="reason" formControlName="reason" rows="3"
                            placeholder="Type here"></textarea>
                            <div *ngIf="addWFHForm.get('reason')?.touched && addWFHForm.get('reason')?.invalid" class="error-msg">
                                Reason is required.
                              </div>
                    </div>

                    <div class="col-md-12 mb-3" *ngIf="availablebalance">
                        <b>Balance:{{availablebalance}}</b>
                      
                    </div>
                </div>
            
                <!-- Action Buttons -->
                <div class="d-flex justify-content-end gap-3">
                    <button type="reset" class="custom-btn btn-secondary"
                        (click)="modal.dismiss();this.addWFHForm.reset()">Close</button>
                    <button type="submit" class="custom-btn btn-primary" [disabled]="addWFHForm.invalid || spinnerLoader">
                        @if(spinnerLoader){
                        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                        <span>{{'Loading..'}}...</span>
                        }@else {
                        <span>{{'Request'}}</span>
                        }</button>
                </div>
            </form>
        </div>
    </div>
</ng-template>
