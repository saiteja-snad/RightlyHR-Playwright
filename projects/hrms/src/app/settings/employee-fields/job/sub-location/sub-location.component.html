<button type="button" (click)="openDialog()" class="custom-btn btn-primary">{{'Add' | translate}}</button>

<!-- Add Popup Modal -->

<ng-template #addpopup let-modal>
    <form [formGroup]="AddForm">
        <div class="custom-main-popup-container" ngbAutofocus>
            <div class="d-flex justify-content-between popup-header-border p-4">
                <div class="pt-2">
                    <p class="popup-heading mb-0">{{ 'Sub Location' | translate }}</p>
                </div>
                <div>
                    <a (click)="close(modal)">
                        <img src="icons/close.png" alt="Close Icon" class="close-icon" />
                    </a>
                </div>
            </div>

            <div class="custom-main-popup-content p-5">
                <!-- Location  Name Field -->
                <div class="mb-4">
                    <label for="jobgrade" class="form-label custom-label mb-2">
                        {{ 'Location' | translate }} <span class="error-msg">*</span>
                    </label>
                    <div class="custom-p-select-content">
                        <select title="text" class="form-control custom-input" formControlName="AddSubLocation">
                            <option value="" disabled selected>Please select Location</option>
                            <option *ngFor="let subloc of SubLocationdetails" [value]="subloc.jobLocationId">
                                {{ subloc.jobLocationName }}
                            </option>
                        </select>
                    </div>
                    <div *ngIf="AddForm.get('AddSubLocation')?.touched && AddForm.get('AddSubLocation')?.invalid" class="error-msg mt-2">
                        <div *ngIf="AddForm.get('AddSubLocation')?.errors?.['required']">{{'Loaction is required'|translate}}</div>
                    </div>
                </div>
                <!-- sublocation Field -->
                <div class="mb-4">
                    <label for="AddLocation" class="form-label custom-label mb-2">
                        {{ 'Sub Location' | translate }} <span class="error-msg">*</span>
                    </label>
                    <input type="text" class="form-control custom-input" formControlName="AddLocation"
                        placeholder="Please Enter SubLocation" 
                        (keydown)="formValidations.restrictInitialSpace($event); formValidations.blockNonAlphabets($event)"  />
                    <div *ngIf="AddForm.get('AddLocation')?.touched && AddForm.get('AddLocation')?.invalid"
                        class="error-msg">
                        {{ 'Sub location is required' | translate }}.
                    </div>
                </div>
                <!-- Buttons -->
                <div class="d-flex gap-5 pt-4 w-100">
                    <button type="button" class="custom-btn btn-secondary w-50 py-3" (click)="close(modal)">
                        {{ 'Close' | translate }}
                    </button>
                    <button type="button" class="custom-btn btn-primary w-50 py-3" (click)="addSublocation(modal)"
                        [disabled]="AddForm.invalid">
                        {{ 'Add' | translate }}
                    </button>
                </div>
            </div>
        </div>
    </form>
</ng-template>

<div class="custom-main-component-container">
    <div class="custom-table-content mt-2">
        <table class="w-100">
            <thead>
                <tr>
                    <th>Location</th>
                    <th>Sub Location</th>
                    <th class="text-center">Actions</th>
                </tr>
            </thead>
            <tbody>
                <ng-container>
                    <tr *ngFor="let subloc of SubLocationdetails">
                        <td>{{subloc.jobLocationName}}</td>
                        <td>{{subloc.jobSubLocationName}}</td>
                        <td class="text-center">
                            <div class="dropdown">
                                <span type="button" data-bs-toggle="dropdown">
                                    <i class="bi bi-three-dots-vertical"></i>
                                </span>
                                <ul class="dropdown-menu custom-dropdown-menu">
                                    <li (click)="openupdateDialog()">
                                        <a class="dropdown-item">
                                            <i class="bi bi-pencil me-2"></i>Update
                                        </a>
                                    </li>
                                    <li (click)="opendelete()">
                                        <a class="dropdown-item">
                                            <i class="bi bi-trash3 me-2"></i>Delete
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </td>
                    </tr>
                </ng-container>
                <!-- No Data Found Template -->
                <!-- <ng-template #noDataTemplate>
            <tr>
              <td colspan="9" class="text-center"><app-no-data-found></app-no-data-found></td>
            </tr>
          </ng-template> -->
            </tbody>
        </table>
    </div>

</div>
