<div class="custom-main-component-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <p class="component-header cursor mb-0">My Expenses</p>
        </div>
        @if(rbac.allowedToAccess('Expenses Module.create')){
        <div>
            <button type="button" (click)="navigatetoAddExpenses()" class="custom-btn btn-primary">
                <i class="bi bi-plus me-2"></i>Add New Expense
            </button>
        </div>
        }
    </div>

    <!--Module Information-->
    <div>
        <app-module-information [moduleInfo]="moduleinfo"/>
     </div>

    <div class="d-flex gap-3 w-100">
        <div class="custom-component-left-content">
            <app-expenes-header-tabs></app-expenes-header-tabs>
        </div>

        <div class="card custom-component-right-content p-3">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
