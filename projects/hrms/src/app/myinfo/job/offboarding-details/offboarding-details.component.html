<div class="custom-main-component-container">
    <div class="card myinfo-content-card p-4">
      <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
          <span class="myinfo-sub-header">Offboarding Details</span>
        </div>
        <div *ngIf="!buttons">
          <a (click)="enableForm()"><i class="bi bi-pencil-square"></i></a>
        </div>
        <div class="d-flex justify-content-end gap-3" *ngIf="buttons">
          <button type="reset" class="custom-btn btn-secondary" (click)="disableForm()">Close</button>
          <button type="submit" class="custom-btn btn-primary" [disabled]="offboardingForm.invalid" >Save</button>
        </div>
      </div>
  
      <!-- Reactive Form -->
      <div class="myinfo-input-content">
        <form [formGroup]="offboardingForm">
          <div class="row">
            <div class="col-lg-4 col-md-6 mb-4">
              <label for="exitReason" class="form-label custom-label mb-2">Exit Reason<span class="text-danger">*</span></label>
              <select
                class="form-select"
                id="exitReason"
                formControlName="exitReason"
                [disabled]="!isEditing"
              >
                <option [ngValue]="undefined" disabled>Select</option>
                <option *ngFor="let item of terminationDetails" [ngValue]="item.reason">{{ item.reason }}</option>
              </select>
              <div class="error-msg" *ngIf="offboardingForm.get('exitReason')?.invalid && offboardingForm.get('exitReason')?.touched">
                Exit Reason is required.
              </div>
            </div>
  
            <div class="col-lg-4 col-md-6 mb-4">
              <label for="eligibleForRehire" class="form-label custom-label mb-2">Eligible For Rehire<span class="text-danger">*</span></label>
              
              <div class="error-msg" *ngIf="offboardingForm.get('eligibleForRehire')?.invalid && offboardingForm.get('eligibleForRehire')?.touched">
                Eligible For Rehire is required.
              </div>
            </div>
  
            <div class="col-lg-4 col-md-6 mb-4">
              <label for="relievingType" class="form-label custom-label mb-2">Relieving Type<span class="text-danger">*</span></label>
              <input
                type="text"
                class="form-control custom-input"
                id="relievingType"
                formControlName="relievingType"
                placeholder="Please enter relieving type"
                [disabled]="!isEditing"
              />
              <div class="error-msg" *ngIf="offboardingForm.get('relievingType')?.invalid && offboardingForm.get('relievingType')?.touched">
                Relieving Type is required.
              </div>
            </div>
  
            <div class="col-lg-4 col-md-6 mb-4">
              <label for="lastWorkingDay" class="form-label custom-label mb-2">Last Working Day<span class="text-danger">*</span></label>
              <input
                type="date"
                class="form-control custom-input"
                id="lastWorkingDay"
                formControlName="lastWorkingDay"
                [disabled]="!isEditing"
              />
              <div class="error-msg" *ngIf="offboardingForm.get('lastWorkingDay')?.invalid && offboardingForm.get('lastWorkingDay')?.touched">
                Last Working Day is required.
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
