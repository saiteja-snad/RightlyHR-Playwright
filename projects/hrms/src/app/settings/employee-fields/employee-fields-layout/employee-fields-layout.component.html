<div>
    @if (shouldShowSection()) {
    <!--header-->
    <div class="mb-3">
        <div class="heading-content">
            <div class="commpoment-name">Settings<span class="ms-1"><i class="bi bi-chevron-double-right"></i></span></div>
            <div class="component-header">Employee Fields</div>
            <div>
                <img src="\icons\moduelicon.png" alt="Icon" placement="bottom" [ngbPopover]="popContent"
                    class="module-icon">
            </div>
        </div>
    </div>

    <!--Module Information-->
    <ng-template #popContent>
        <app-module-information [moduleInfo]="moduleinfo" />
    </ng-template>
    <!--tabs content-->
    <div class="mb-3">
        <app-settings-employee-fields-module-tabs />
    </div>
    }
    <!--Content-->
    <div class="employee-fields-main-container d-flex gap-3 w-100">
        @if (shouldShowSection() && router.url !== '/settings/employee-fields/no-due-clearnce' ) {
        <!--sub tabs Content-->
        <div class="custom-component-left-content">
            <div *ngIf="isActive('/settings/employee-fields/personal')">
                <app-settings-personal-tabs />
            </div>

            <div *ngIf="isActive('/settings/employee-fields/job')">
                <app-settings-job-tabs />
            </div>
            <div *ngIf="isActive('/settings/employee-fields/manage-shifts')">
                <app-settings-manage-shits-tabs />
            </div>

            <div *ngIf="isActive('/settings/employee-fields/manage-holidays')">
                <app-settings-manage-holidays-tabs />
            </div>

            <div *ngIf="isActive('/settings/employee-fields/manage-policies')">
                <app-settings-manage-policies-tabs />
            </div>

            <div *ngIf="isActive('/settings/employee-fields/expenes')">
                <app-settings-expenes-configurtions-tabs />
            </div>

            <div *ngIf="isActive('/settings/employee-fields/manage-weekends')">
                <app-manage-weekends-tabs />
            </div>

            <div *ngIf="isActive('/settings/employee-fields/manage-dsts')">
                <app-manage-dst-tabs />
            </div>
        </div>
        <div class="custom-setting-right-content p-3">
            <router-outlet />
        </div>
        } @else {
        <div class="w-100">
            <router-outlet />
        </div>
        }
    </div>
</div>
