<div class="custom-main-component-container">
    @if(!dataLoad){
    <div class="custom-table-content">
        <ng-container *ngIf="eligibilityCriterias!.length > 0; else noDataTemplate">
            <table class="w-100">
                <thead>
                    <tr>
                        <th>{{ 'Name' | translate }}</th>
                        <th>{{ 'Value' | translate }}</th>
                        <th class="text-center" *ngIf="rbac.allowedToAccess('Comp Off Entitlement Tab.update')">{{ 'Action' | translate }}</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let criteria of eligibilityCriterias ;let i = index">
                        <td>{{ criteria.name }}</td>
                        <td>
                            <ng-container *ngIf="editingIndex !== i">
                                {{ criteria.value }}
                            </ng-container>

                            <ng-container *ngIf="editingIndex === i">
                                <input class="form-control" type="text"
                                    [(ngModel)]="temporaryValue"
                                    (keypress)="validateDecimal($event, criteria.value)"
                                    (keydown.tab)="editingIndex === i"
                                   />
                            </ng-container>
                        </td>

                        <td class="text-center" *ngIf="rbac.allowedToAccess('Comp Off Entitlement Tab.update')">
                            <div class="dropdown" *ngIf="editingIndex !== i; else editingMode">
                                <a data-bs-toggle="dropdown" aria-expanded="false">
                                    <i class="bi bi-three-dots-vertical"></i>
                                </a>
                                <ul class="dropdown-menu custom-dropdown-menu">
                                    <li>
                                        <a class="dropdown-item" (click)="enableEdit(i, criteria.id, criteria.value)"><i class="bi bi-pencil me-2"></i>{{ 'Update' | translate }}</a>
                                    </li>
                                </ul>
                            </div>

                            <ng-template #editingMode>
                            <div class="d-flex gap-2">
                                <button class="custom-btn btn-primary" type="button" (click)="submitCompOffValue(i, temporaryValue)">
                                    {{ 'Update' | translate }}
                                </button>
                                <button class="custom-btn btn-secondary" type="button" (click)="disableEdit()">
                                    {{ 'Cancel' | translate }}
                                </button>
                            </div>
                            </ng-template>
                        </td>
                    </tr>
                </tbody>
            </table>
        </ng-container>
    </div>
} @else { <div class="custom-compoent-data-loader">
    <app-data-loader-content />
</div>}
</div>

<ng-template #noDataTemplate>
    <tr>
        <td colspan="2">
            <app-no-data-found></app-no-data-found>
        </td>
    </tr>
</ng-template>
