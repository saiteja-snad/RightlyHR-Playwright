<div class="custom-main-component-container">
    <div class="component-header-content">
        @if (router.url !== '/time-off/pending-approvals/assessmentform') {
        <div class="heading-content">
            <div class="commpoment-name">Time Off<span class="ms-1"><i class="bi bi-chevron-double-right"></i></span>
            </div>
            <div class="component-header">Pending Approvals</div>
            <div>
                <img src="\icons\moduelicon.png" alt="Icon" placement="bottom" [ngbPopover]="popContent"
                    class="module-icon">
            </div>
            <ng-template #popContent>
                <app-module-information [moduleInfo]="moduleinfo" />
            </ng-template>
        </div>
        }
        @else {
        <div class="heading-content">
            <div class="commpoment-name cursor" (click)="navigate()">Time off
                <span class="ms-1"><i class="bi bi-chevron-double-right"></i></span>
            </div>
            <div class="component-header">Assessment Form</div>
            <div>
                <img src="\icons\moduelicon.png" alt="Icon" placement="bottom" [ngbPopover]="popContent"
                    class="module-icon">
            </div>
            <ng-template #popContent>
                <app-module-information [moduleInfo]="moduleinfo" />
            </ng-template>
        </div>
        }
        @if (router.url == '/time-off/pending-approvals/time-sheets') {
        <form [formGroup]="datepickerForm" (ngSubmit)="onSubmit()">
            <div class="d-flex gap-3 align-items-center">
                @if(isFilterApplied()) {
                <button type="button" class="clear-all-btn" (click)="resetForm()">{{'Clear All' | translate}}</button>
                }
                <div class="custom-date-range-picker">
                    <p-datepicker formControlName="dateRange" [placeholder]="'Please select date range'"
                        selectionMode="range" [showIcon]="true" [readonlyInput]="true" [maxDate]="today">
                    </p-datepicker>
                </div>

                <div class="custom-p-multiSelect-content">
                    <!-- <p-select [options]="projectsData" optionLabel="displayName" optionValue="projectId" [filter]="true"
                        [resetFilterOnHide]="true" filterBy="displayName" formControlName="projectId"
                        placeholder="Please select project" class="form-select custom-select"
                        (onChange)="onProjectChange($event)">
                    </p-select> -->
                    <p-multiSelect [options]="projectsData" optionLabel="displayName" optionValue="phaseId"
                        [filter]="true" [resetFilterOnHide]="true" filterBy="displayName" formControlName="phaseId"
                        defaultLabel="Please select project/phase" class="form-select custom-select"
                        (onChange)="onProjectChange($event)">
                    </p-multiSelect>

                </div>

                <!-- Resource MultiSelect Dropdown -->
                <div class="custom-p-multiSelect-content">
                    <p-multiSelect [options]="resourcesList" optionLabel="fullName" optionValue="id" [filter]="true"
                        defaultLabel="Please select resource"[resetFilterOnHide]="true" formControlName="resourceId"
                        class="form-select custom-select "  (onChange)="onresourceChange($event)"></p-multiSelect>
                </div>
                <div>
                    <button class="custom-btn btn-primary" type="submit" [disabled]="!isAnyFieldSelected()">{{'Apply' |
                        translate}}</button>
                </div>
            </div>
        </form>
        }
    </div>

    <div class="d-flex gap-3 w-100">
        @if (router.url != '/time-off/pending-approvals/assessmentform') {
        <div class="component-left-tabs-container">
            <app-pending-approvals-tabs />
        </div>
        }
        <div class="component-right-content">
            <router-outlet />
        </div>
    </div>
</div>
