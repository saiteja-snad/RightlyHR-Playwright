<div class="custom-main-component-container">
    <div class="component-header-content">
        <div class="heading-content">
            <div class="commpoment-name">Time Off<span class="ms-1"><i class="bi bi-chevron-double-right"></i></span></div>
            <div class="component-header">Extra Hours</div>
            <div>
                <img src="\icons\moduelicon.png" alt="Icon" placement="bottom" [ngbPopover]="popContent" class="module-icon">
            </div>
        </div>
        
        <div class="d-flex align-items-center gap-3">
            @if(rbac.allowedToAccess('All Employees (Extra Hours).view') && rbac.allowedToAccess('My Team (Extra Hours).view')) {
            <div class="d-flex align-items-center gap-2">
                <label for="education" class="form-label custom-label text-nowrap filter-labels m-0">
                    {{'Select Employee' | translate}}</label>
                <div class="custom-p-select-content">
                    <p-select [options]="activeEmplist" [filter]="true" filterBy="label" resetFilterOnHide="true"
                     optionLabel="label" optionValue="value" showClear="true" placeholder="Select employee name"
                     (onChange)="onCheckemployee($event.value)" class="form-select custom-select"></p-select>
                </div>
            </div>
            }
            @else if(rbac.allowedToAccess('All Employees (Extra Hours).view')) {
            <div class="d-flex align-items-center gap-2">
                <label for="education" class="form-label custom-label text-nowrap filter-labels m-0">{{'Select Employee' | translate}}</label>
                <div class="custom-p-select-content">
                    <p-select [options]="activeEmplist" [filter]="true" filterBy="label" resetFilterOnHide="true" optionLabel="label"
                    optionValue="value" showClear="true" placeholder="Select employee name" (onChange)="onCheckemployee($event.value)" 
                    class="form-select custom-select"></p-select>
                </div>
            </div>
            }
            @else if (rbac.allowedToAccess('My Team (Extra Hours).view')) {
            <label class="form-label filter-labels m-0">{{'My Team'| translate}}</label>
            <div class="custom-p-select-content">
                <p-select [options]="getEmployeeInfo" optionLabel="fullName" optionValue="employeeId"
                    class="form-select custom-select" name="myteamemployees" placeholder="Select employee name"
                    [filter]="true" resetFilterOnHide="true" showClear="true" required
                    (onChange)="onCheckemployee($event.value)">
                </p-select>
            </div>
            }
            <div class="d-flex gap-2 align-items-center">
                <label class="form-label custom-label filter-labels m-0" for="">Select Year</label>
                <form autocomplete="off" [formGroup]="yearSelectionForm">
                    <div class="custom-p-select-content">
                        <p-select formControlName="selectedYear" [options]="years" placeholder="Select Year"
                            class="form-select custom-select" (onChange)="onYearChange()">
                        </p-select>
                    </div>
                </form>
            </div>
        </div>
    </div>

   <!--Module Information-->
    <ng-template #popContent>
        <app-module-information [moduleInfo]="moduleinfo"  />
    </ng-template>

    <div class="d-flex gap-3 w-100">
        <div class="component-left-tabs-container">
            <app-extra-hours-tabs/>
        </div>

        <div class="component-right-content">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
