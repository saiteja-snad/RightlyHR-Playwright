<div class="custom-main-component-container mt-3">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <p class="main-content-heading cursor mb-0">Leave Balance</p>
        </div>
        <div class="d-flex gap-3">
            <button type="button" (click)="openModal(addleave)" class="custom-btn btn-primary"><i
                    class="bi bi-plus me-2"></i>Request Leave</button>
        </div>
    </div>
    <div>

        <div class="row row-cols-sm-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 row-cols-xxl-5">
            @for (item of cardItems; track $index) {
            <div class="col">
                <div class="card employee-details-card cursor w-100 mb-3">
                    <div class="d-flex align-items-center justify-content-center">
                        <p class="label text-nowrap mb-2 mt-2">{{item.label}}</p>
                    </div>
                    <div class="d-flex align-items-center  justify-content-center gap-3">

                        <div class="card profile-card"
                            [ngStyle]="{'background-color': item.backgroundColor,'color': item.profileColor}">
                            <i class="bi bi-house"></i>
                        </div>
                    </div>
                    <div class="p-0">
                        <hr class="dashed-line">
                    </div>
                    <div>
                        <div class="d-flex justify-content-between p-3">

                            <p class="count mb-0">Available:{{item.available}}</p>
                            <p class="count mb-0">Processed:{{item.available}}</p>

                        </div>

                        <div class="d-flex justify-content-between p-3">
                            <p class="count mb-0">Entitled:{{item.available}}</p>
                            <p class="count mb-0">Booked:{{item.available}}</p>
                        </div>
                    </div>
                </div>

            </div>
            }
        </div>
        <div>
            <app-leaves-approvaltabs></app-leaves-approvaltabs>
        </div>

        <div>
            <router-outlet></router-outlet>
        </div>
    </div>
</div>



<ng-template #addleave let-modal>
    <div class="custom-main-popup-container" ngbAutofocus>
        <div class="d-flex justify-content-between popup-header-border p-4">
            <div class="pt-2">
                <p class="popup-heading mb-0">Request Leave</p>
            </div>
            <div>
                <a (click)="modal.dismiss()"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
            </div>
        </div>
        <div class="custom-main-popup-content p-4">
            <form action="">
                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Leave Type<span
                                class="text-danger">*</span></label>
                        <p-select [options]="leaveType" optionLabel="name" placeholder="Please select leave type"
                            class="form-select custom-select" />
                    </div>
                </div>
                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Start Date<span
                                class="text-danger">*</span></label>
                        <input type="date" class="form-control custom-input" id="exampleFormControlInput1">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">End Date<span
                                class="text-danger">*</span></label>
                        <input type="date" class="form-control custom-input" id="exampleFormControlInput1">
                    </div>

                </div>

                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label class="form-label custom-label mb-3">Availing<span class="text-danger">*</span></label>
                        <div class="d-flex gap-3">
                            <div class="form-check">
                                <input type="radio" class="form-check-input" id="halfDay" name="availing"
                                    value="Half Day">
                                <label class="form-check-label" for="halfDay">Half Day</label>
                            </div>
                            <div class="form-check">
                                <input type="radio" class="form-check-input" id="fullDay" name="availing"
                                    value="Full Day">
                                <label class="form-check-label" for="fullDay">Full Day</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Reason For Leave<span
                                class="text-danger">*</span></label>
                        <textarea class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter reason"></textarea>
                    </div>

                </div>
                <div class="d-flex justify-content-end gap-3 mt-4">
                    <button type="reset" class="custom-btn btn-secondary" (click)="modal.dismiss()">Close</button>
                    <button type="submit" class="custom-btn btn-primary">Request</button>
                </div>
            </form>
        </div>
    </div>
</ng-template>
