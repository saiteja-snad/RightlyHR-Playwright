<div class="custom-main-component-container">
    <!-- Add Input-->
    <div>
        <form [formGroup]="saluationForm" (ngSubmit)="onSubmit()" >
        <div class="custom-settings-add-input input-group mb-5">
            <input type="text" class="form-control custom-input" placeholder="Please enter salutation"
                aria-label="salutation" aria-describedby="salutation" formControlName ="saluation">
            <span class="input-group-text" id="salutation"><button type="submit"
                    class="custom-btn btn-primary">{{'Add'|translate}}</button></span>
        </div>
        </form>
    </div>
    <!--Data Content-->
    <div>
        <div class="custom-settings-data-table">
            <table class="w-100">
                <thead>
                    <th class="col-span-2"></th>
                </thead>
                <tbody>
                    @for (sal of saluationdetails ; track sal.name) {
                    <tr *ngFor="let sal of saluationdetails">
                        <td class="w-75">{{sal.titlename}}</td>
                        <td class="w-25">
                            <div class="d-flex gap-4">
                                <!--Update-->
                                <div>
                                    <a (click)="openupdate(sal)"><img src="/settings-icon/edit.png" alt="edit icon"
                                            class="settings-common-icon"></a>
                                </div>
                                <!--Delete-->
                                <div>
                                    <a (click)="opendelete(sal)"><img src="/settings-icon/trash-2.png" alt="edit icon"
                                            class="settings-common-icon"></a>
                                </div>
                            </div>
                        </td>
                    </tr>
                }
                </tbody>
            </table>
        </div>
    </div>
</div>

<!--Update popup-->
<ng-template #updatepopup let-modal>
    <form [formGroup]="updateForm">
    <div class="custom-main-popup-container" ngbAutofocus>
        <div class="d-flex justify-content-between popup-header-border p-4">
            <div class="pt-2">
                <p class="popup-heading mb-0">{{'Update'|translate}}</p>
            </div>
            <div>
                <a (click)="close(modal)"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
            </div>
        </div>
        <div class="custom-main-popup-content p-5">
            <div class="mb-4">
                <label for="exampleFormControlInput1" class="form-label custom-label mb-2"><span class="error-msg">*</span></label>
                <input type="text" class="form-control custom-input" formControlName="firstName"
                    placeholder="Please enter Salutation">
            </div>
            <div class="d-flex gap-5 pt-4 w-100">
                <button class="custom-btn btn-secondary w-50 py-3"(click)="close(modal)">{{'Close'|translate}}</button>
                <button class="custom-btn btn-primary w-50 py-3" (click)="updateSal(saluationdetails)">{{'Update'|translate}}</button>
            </div>
        </div>
   
   </div>
</form>
</ng-template>

<!--Delete Confirmation popup-->
<ng-template #deletepopup let-modal>
    <div class="modal-body" ngbAutofocus>
        <div class="custom-main-popup-content text-center p-4">
            <div class="py-5">
                <img src="/icons/delete-icon.png" alt="delete-icon" class="confirmation-icon mb-5">
                <p class="confirmation-text">{{'Are you sure you want to Delete?'|translate}}</p>
            </div>
            <div class="d-flex gap-5 pt-2 w-100">
                <button class="custom-btn btn-secondary w-50 py-3" (click)="modal.close()">{{'No'|translate}}</button>
                <button class="custom-btn btn-primary w-50 py-3"(click)="deletesal(saluationdetails)">{{'yes'|translate}}</button>
            </div>
        </div>
    </div>
</ng-template>
