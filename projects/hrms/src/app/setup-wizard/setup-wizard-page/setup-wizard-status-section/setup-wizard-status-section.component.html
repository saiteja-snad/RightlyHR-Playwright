<div class="setup-wizard-status-layout d-flex gap-3 w-100">
  @if (visibleTabs().length > 0) {
    <div class="setup-wizard-status-nav">
      <div class="component-side-nav-tabs-container py-3">
        <ul class="nav flex-column">
          @for (tab of visibleTabs(); track tab.id) {
            <li class="nav-item">
              <button
                type="button"
                class="nav-link wizard-status-tab"
                [class.active-nav-link]="activeTab() === tab.id"
                (click)="setActiveTab(tab.id)"
              >
                {{ tab.label }}
                <span>({{ tabCount(tab) }})</span>
              </button>
            </li>
          }
        </ul>
      </div>
    </div>
  }

  <div class="setup-wizard-status-content flex-grow-1 min-w-0">
    @switch (moduleKey()) {
      @case ('shifts') {
        <app-pending-shifts [class.d-none]="activeTab() !== 'pending'" />
        <app-published-shifts [class.d-none]="activeTab() !== 'published'" />
      }
      @case ('holidays') {
        <app-pending-holidays [class.d-none]="activeTab() !== 'pending'" />
        <app-published-holidays [class.d-none]="activeTab() !== 'published'" />
      }
      @case ('weekends') {
        <app-pending-weekends [class.d-none]="activeTab() !== 'pending'" />
        <app-published-weekends [class.d-none]="activeTab() !== 'published'" />
      }
      @case ('policies') {
        <app-pending-policies [class.d-none]="activeTab() !== 'pending'" />
        <app-published-policies [class.d-none]="activeTab() !== 'published'" />
      }
      @case ('leave-category') {
        <app-pending-leavecategory [class.d-none]="activeTab() !== 'pending'" />
        <app-published-leavecategory [class.d-none]="activeTab() !== 'published'" />
      }
    }
  </div>
</div>
