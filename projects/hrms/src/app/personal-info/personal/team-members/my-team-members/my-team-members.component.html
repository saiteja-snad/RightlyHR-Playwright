<div class="custom-main-component-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <!-- <div>
            <span class="component-sub-header">My Team View</span>
        </div> -->
    </div>
    <div class="main-content">
        <div class="mb-3">
            <!--personal info tabs-->
            <div *ngIf="isActive('/personalinfo')">
                <app-team-members-tabs />
            </div>
            <!--My info tabs-->
            <div *ngIf="isActive('/myinfo')">
                <app-my-info-team-numbers-tab />
            </div>
        </div>
        <div class="input-group custom-search mb-3">
            <span class="input-group-text custom-input-group-search" id="basic-addon1"><i
                    class="bi bi-search"></i></span>
            <input type="search" class="form-control custom-search-input"
                [placeholder]="'Search by employee id / employee name / work email / phone number' | translate" aria-label="Username"
                #search="ngModel" [(ngModel)]="searchValue" autocomplete="off" aria-describedby="basic-addon1">
        </div>
        <div class="custom-tree-table">

    <div *ngIf="teamMemberData 
      | myteamsearch : searchValue : ['fusionEmpId','fullName','workEmail','contact'] 
      as filteredMembers">

        <p-treetable [value]="filteredMembers"
                     [scrollable]="true"
                     [tableStyle]="{'min-width':'60rem'}"
                     (onNodeCollapse)="onCollapse($event)">

            <!-- Table Header -->
            <ng-template pTemplate="header">
                <tr>
                    <th>{{ 'Employee ID' | translate }}</th>
                    <th>{{ 'Employee Name' | translate }}</th>
                    <th>{{ 'Work Email' | translate }}</th>
                    <th>{{ 'Phone Number' | translate }}</th>
                </tr>
            </ng-template>

            <!-- Table Body -->
            <ng-template pTemplate="body" let-rowNode let-rowData="rowData">
                <tr [ttRow]="rowNode">
                    <td>
                        <p-treetable-toggler [rowNode]="rowNode"></p-treetable-toggler>
                        {{ rowData.fusionEmpId }}
                    </td>
                    <td>
                        <a [ngClass]="{'select-item cursor': rowData.isAccess}" (click)="rowData.isAccess && select(rowData)">
                                    {{ rowData.fullName }}</a>
                    </td>
                    <!-- <td>{{ rowData.fullName }}</td> -->
                    <td>{{ rowData.workEmail }}</td>
                    <td>{{ rowData.contact }}</td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
                <tr>
                        <div class="nodata-tree-table">
                            <app-no-data-found></app-no-data-found>
                        </div>
                    
                </tr>
            </ng-template>

        </p-treetable>

    </div>
</div>


    </div>
</div>
