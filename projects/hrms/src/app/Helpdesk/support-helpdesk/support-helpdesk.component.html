<div class="custom-main-component-container">
  <div class="component-header-content py-2" *ngIf="!hideTabs">
    <div class="heading-content">
      <div class="commpoment-name"> {{'Help Desk' | translate}}<span class="ms-1"><i
            class="bi bi-chevron-double-right"></i></span>
      </div>
      <div class="component-header">{{'Team Queries' | translate}}</div>
      <div>
        <app-module-info-icon placement="bottom" [ngbPopover]="popContent" />
      </div>
    </div>
    <div class="d-flex align-items-center gap-3">
      <app-applicable-policies-trigger [moduleKey]="applicablePolicies.moduleKey"
        [subModuleKey]="applicablePolicies.subModuleKey">
      </app-applicable-policies-trigger>
    </div>
  </div>

  <!--Module Information-->
  <ng-template #popContent>
    <app-module-information [moduleInfo]="moduleinfo" />
  </ng-template>

  <div *ngIf="!hideTabs" class="mb-3">
    <app-helpdesk-header-tabs />
  </div>

  <div class="d-flex gap-3 w-100">
    <!--sub module tabs-->
    <div *ngIf="!hideTabs" class="component-left-tabs-container">
      <app-helpdesk-component-tabs></app-helpdesk-component-tabs>
    </div>

    <div class="component-right-content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
