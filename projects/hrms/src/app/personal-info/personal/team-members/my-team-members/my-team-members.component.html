<div class="custom-main-component-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <!-- <div>
            <span class="component-sub-header">My Team View</span>
        </div> -->
    </div>
    <div class="main-content">
        <div class="mb-3">
            <!--personal info tabs-->
            <div *ngIf="isActive('/personalinfo')">
                <app-team-members-tabs />
            </div>
            <!--My info tabs-->
            <div *ngIf="isActive('/myinfo')">
                <app-my-info-team-numbers-tab />
            </div>
        </div>

        <div class="custom-tree-table">
            <p-treetable [value]="teamMemberData" [scrollable]="true" [tableStyle]="{'min-width':'60rem'}">
                <ng-template pTemplate="header">
                    <tr>
                        <th>Employee Id</th>
                        <th>Employee Name</th>
                        <th>Work Email</th>
                        <th>Phone Number</th>
                    </tr>
                </ng-template>
        
                <ng-template pTemplate="body" let-rowNode let-rowData="rowData">
                    <tr [ttRow]="rowNode">
                        <!-- FusionEmpId with toggler -->
                        <td>
                            <p-treetable-toggler [rowNode]="rowNode"></p-treetable-toggler>
                            {{ rowData.fusionEmpId }}
                        </td>
                        <!-- Full Name -->
                        <td>{{ rowData.fullName }}</td>
                        <!-- Work Email -->
                        <td>{{ rowData.workEmail }}</td>
                        <!-- Contact number -->
                        <td>{{ rowData.contact }}</td>
                    </tr>
                </ng-template>
            </p-treetable>
        </div>
    </div>
</div>
