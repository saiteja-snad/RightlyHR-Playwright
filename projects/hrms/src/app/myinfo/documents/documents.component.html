<div class="custom-main-component-container">
   <div class="employee-fields-main-container d-flex gap-3 w-100">
      <div class="custom-component-left-content p-3">
         @for(folder of folders; track $index){
         <div (click)="onFolderSelectded(folder, folder.name)" class="folder-content cursor px-2"
            [ngClass]="{'active': selectedMainFolder === folder}">
            <i class="bi bi-folder-fill foldder-icon" [ngClass]="{'fa-caret-right': !folder.expanded, 'fa-caret-down': folder.expanded}"></i>
            <span class="folder-name px-2">{{ folder.name | lastValue }}</span>
         </div>
         }

         @for(subFolder of selectedFolder; track $index){

         @if(!subFolder.isNotVisible){

         <div class="folder-content">
            <i class="bi bi-folder-fill foldder-icon" ></i>
            <span class="folder-name px-2">{{ subFolder.name | lastValue }}</span>
         </div>}
         }
      </div>
      <div class="custom-setting-right-content p-3">

      </div>
   </div>
</div>
