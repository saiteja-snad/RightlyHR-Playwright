<div class="custom-main-popup-container">
    <div class="d-flex justify-content-between popup-header-border p-4">
        <div class="pt-2">
            <p class="popup-heading mb-0">Add Experience Details</p>
        </div>
        <div>
            <a (click)="close()"><img src="/images/close.png" alt="Close Icon" class="close-icon"></a>
        </div>
    </div>
    <div class="custom-main-popup-content p-4">
        <form action="">
            <div class="row">
                <div class="col-md-12 mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="checkDefault">
                        <label class="form-check-label custom-label" for="checkDefault">
                            Default checkbox
                        </label>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="eventDate" class="form-label custom-label mb-2">Company Name<span
                            class="text-danger">*</span></label>
                    <input type="text" class="form-control custom-input" id="education">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="eventDate" class="form-label custom-label mb-2">Employeement Type<span
                            class="text-danger">*</span></label>
                    <div class="custom-p-select-content">
                        <p-select [options]="JobemploymenttypeDetails" optionLabel="jobType1" optionValue="jobType1"
                            id="" formControlName="education" placeholder="Please select education"
                            class="form-select custom-select"></p-select>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="eventDate" class="form-label custom-label mb-2">From Date<span
                            class="text-danger">*</span></label>
                    <input type="date" class="form-control custom-input" id="specialization">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="eventDate" class="form-label custom-label mb-2">To Date<span
                            class="text-danger">*</span></label>
                    <input type="date" class="form-control custom-input" id="">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="title" class="form-label custom-label mb-2">Job Role<span
                            class="text-danger">*</span></label>
                    <input type="text" class="form-control custom-input" id="" placeholder="Please enter event title">
                </div>
                <div class="col-md-12 mb-3">
                    <label for="file" class="form-label custom-label mb-2">Roles & Responsibilities<span
                            class="text-danger">*</span></label>
                    <textarea class="form-control custom-input" name="" id=""></textarea>
                </div>
                <div class="mb-3">
                    <p class="popup-heading mb-0">Previous Employer Details</p>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="title" class="form-label custom-label mb-2">Contact Name<span
                            class="text-danger">*</span></label>
                    <input type="text" class="form-control custom-input" id="end date"
                        placeholder="Please enter event title">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="title" class="form-label custom-label mb-2">Contact Number<span
                            class="text-danger">*</span></label>
                    <input type="number" class="form-control custom-input" id="end date"
                        placeholder="Please enter event title">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="title" class="form-label custom-label mb-2">Work Email<span
                            class="text-danger">*</span></label>
                    <input type="email" class="form-control custom-input" id="end date"
                        placeholder="Please enter event title">
                </div>
                <div class="col-md-12 mb-3">
                    <label for="file" class="form-label custom-label mb-2">Attachment(Image and PDF only)<span
                            class="text-danger">*</span></label>
                    <input type="file" class="form-control custom-input" id="file"
                        (change)="onChangeexperience($event);onChange($event)">
                </div>
            </div>
            <div class="d-flex justify-content-end gap-3 mt-4">
                <button type="reset" class="custom-btn btn-secondary" (click)="close()">Close</button>
                <button type="submit" class="custom-btn btn-primary">Add</button>
            </div>
        </form>
    </div>
</div>
