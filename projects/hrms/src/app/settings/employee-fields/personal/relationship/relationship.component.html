<div class="custom-main-component-container">
    <form [formGroup]="RelationForm" (ngSubmit)="addRelationship()" *ngIf="rbac.allowedToAccess('Relationship.create')">
        <!-- Add Input-->
        <div class="mb-4">
            <div class="custom-settings-add-input input-group">
                <input type="text" class="form-control custom-input" placeholder="Please enter relation"
                    formControlName="Relationship" aria-label="relation" aria-describedby="relation"
                    (keydown)="formValidations.restrictInput($event); formValidations.blockNonAlphabets($event)">
                <span class="input-group-text" id="gender">
                    <button type="submit" class="custom-btn btn-primary"
                        [disabled]="RelationForm.invalid">{{'Add'|translate}}</button></span>
            </div>
            <div *ngIf="RelationForm.get('Relationship')?.touched && RelationForm.get('Relationship')?.invalid" class="error-msg mt-2">
                <div *ngIf="RelationForm.get('Relationship')?.errors?.['required']">{{'Relationship is required'|translate}}</div>
            </div>
        </div>
    </form>

    <!--Data Content-->
    <div class="custom-settings-data-table">
        <table class="w-100">
            <thead>
                <tr>
                    <th class="col-span-2"></th>
                </tr>
            </thead>
            <tbody>
                @if (rbac.allowedToAccess('Relationship.view')) {
                @for (rel of RelationshipDetail; track $index) {
                <tr>
                    <td class="w-75">{{ rel.relationship1}}</td>
                    <td class="w-25">
                        <div class="d-flex gap-4">
                            <!--Update-->
                            <div>
                                <a (click)="openupdate(rel)" *ngIf="rbac.allowedToAccess('Relationship.update')"><img src="/settings-icon/edit.png" alt="edit icon"
                                        class="settings-common-icon"></a>
                            </div>
                            <!--Delete-->
                            <div>
                                <a (click)="opendelete(rel)" *ngIf="rbac.allowedToAccess('Relationship.delete')"><img src="/settings-icon/trash-2.png" alt="edit icon"
                                        class="settings-common-icon"></a>
                            </div>
                        </div>
                    </td>
                </tr>
                }
            }
            </tbody>
        </table>
    </div>
</div>

<!--Update popup-->
<ng-template #updatepopup let-modal>
    <form [formGroup]="updateForm">
        <div class="custom-main-popup-container" ngbAutofocus>
            <div class="custom-poup-header-content popup-header-border">
                <div class="pt-2">
                    <p class="popup-heading mb-0">{{'Edit Relationship'|translate}}</p>
                </div>
                <div>
                    <a (click)="close(modal)"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
                </div>
            </div>
            <div class="custom-main-popup-content p-4">
                <div class="mb-4">
                    <label for="exampleFormControlInput1" class="form-label custom-label mb-2">{{'Relationship'|translate}}
                        <span class="error-msg">*</span></label>
                    <input type="text" class="form-control custom-input" formControlName="Relationship"
                        placeholder="Please enter relationship"
                        (keydown)="formValidations.restrictInput($event); formValidations.blockNonAlphabets($event)">
                    <div *ngIf="updateForm.get('Relationship')?.touched && updateForm.get('Relationship')?.invalid" class="error-msg mt-2">
                        <div *ngIf="updateForm.get('Relationship')?.errors?.['required']">{{'Relationship is required'|translate}}</div>
                    </div>
                </div>
                <div class="custom-modal-footer">
                    <button type="button" class="custom-btn btn-secondary" (click)="close(modal)">{{'Close'|translate}}</button>
                    <button type="button" class="custom-btn btn-primary" (click)="updateRelation(modal)" [disabled]="updateForm.invalid">{{'Update'|translate}}</button>
                </div>
            </div>
        </div>
    </form>
</ng-template>

<!--Delete Confirmation popup-->
<ng-template #deletepopup let-modal>
    <div class="result-popup-content" ngbAutofocus>

            <div class="py-4">
                <img src="/icons/delete-icon.png" alt="delete-icon" class="confirmation-delete-icon">
                <p class="confirmation-text">{{'Are you sure you want to Delete?'|translate}}</p>
            </div>
            <div class="custom-modal-footer">
                <button type="button" class="custom-btn btn-secondary"(click)="closeDelete(modal)">{{'No'|translate}}</button>
                <button type="button" class="custom-btn btn-primary" (click)="onDelete(modal)">{{'Yes'|translate}}</button>
            </div>
        </div>
   
</ng-template>
