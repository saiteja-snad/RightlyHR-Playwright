<div class="custom-main-component-container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <p class="main-content-heading mb-0">My Info</p>
        </div>
        <div>
            <button class="custom-btn btn-primary" *ngIf="isActive('myinfo/job')">Inactive</button>
            <button class="custom-btn btn-primary" *ngIf="isActive('myinfo/team-members')" (click)="openModal(changermmodal)">Change RM</button>
        </div>
    </div>

    <!--nav tabs content-->
    <div>
        <div *ngIf="isActive('myinfo/personal')" class="mb-3">
            <app-my-info-personal-tabs></app-my-info-personal-tabs>
        </div>
        <div *ngIf="isActive('myinfo/job')" class="mb-3">
            <app-myinfo-job-tabs></app-myinfo-job-tabs>
        </div>
    </div>

    <div class="myinfo-main-container d-flex gap-4">
        <!--User profile content-->
        <div class="card user-profile-content p-4">
            <app-profile-info-details />
        </div>

        <!--main content-->
        <div class="card myinfo-main-content p-4">
            <router-outlet />
        </div>
    </div>




    <ng-template #changermmodal let-modal>
        <div class="custom-main-popup-container">
            <div class="d-flex justify-content-between popup-header-border p-4">
                <div class="pt-2">
                    <p class="popup-heading mb-0">Change RM</p>
                </div>
                <div>
                    <a (click)="modal.dismiss()"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
                </div>
            </div>
            <div class="custom-main-popup-content p-4">
                <form action="">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Select Team Member(s)
                                <span class="text-danger">*</span></label>
                            <div class="custom-p-select-content">
                                <p-select optionLabel="name" placeholder=" Select Team Member(s)"
                                    class="form-select custom-select" (ngModelChange)="getSelectedTeamMembersLabel()" />
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Select Reporting
                                Manager<span class="text-danger">*</span></label>
                            <div class="custom-p-select-content">
                                <p-select optionLabel="name" placeholder=" Select Reporting Manager" 
                                    class="form-select custom-select"                                                                                                                                                                                                                                                                                                                                          />
                            </div>
                        </div>

                    </div>
    
                    <div class="d-flex justify-content-end gap-3 mt-4">
                        <button type="reset" class="custom-btn btn-secondary" (click)="modal.dismiss()">Close</button>
                        <button type="submit" class="custom-btn btn-primary">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </ng-template>
