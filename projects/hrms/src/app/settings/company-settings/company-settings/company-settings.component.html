<div class="custom-main-component-container">
  <div class="card custom-background-card p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="component-sub-header">Company Settings</div>
      <div>
        <a ><i class="bi bi-pencil-square component-edit-icon"></i></a>
      </div>
      <div class="d-flex justify-content-end gap-2">
        <button type="reset" class="custom-btn btn-secondary" >Close</button>
        <button type="submit" class="custom-btn btn-primary" 
         >Save</button>
      </div>
    </div>

    <!--input content-->
    <form autocomplete="off">
  
        <div class="image-content">
            <img [src]="imageUrl ? imageUrl : 'images/alternate.png'" alt="profile Image" class="profile-image">
            <div class="edit-icon-content">
                <label for="formFile" class="form-label">
                    <img src="/personal-info-icons/editimages.png" alt="edit-icon" class="edit-icon cursor"></label>
                <input class="form-control d-none" type="file" id="formFile" accept=".jpg" (change)="chooseNewProfile($event)">
            </div>
        </div>
        

      <div class="row" >
        <div class="col-md-6 col-lg-4 mb-3"  >
          <label for="employeeId" class="form-label custom-label mb-2" >Company Name<span
              class="text-danger">*</span></label>
          <input type="text" autocomplete="off" class="form-control custom-input" id="company-name"
             placeholder="Please enter company name" />
        </div>

        <div class="col-md-6 col-lg-4 mb-3"  >
          <label for="employeeId" class="form-label custom-label mb-2" >Company Email<span
              class="text-danger">*</span></label>
          <input type="text" autocomplete="off" class="form-control custom-input" id="company-email"
             placeholder="Please enter company email" />
        </div>

         <div class=" col-md-6 col-lg-4 mb-3 d-flex custom-input-group position-relative custom-phone-number-content w-100">
            <div>
              <lib-country-list [selectedCountryConfig]="selectedCountryConfig"
                [selectedCountryCode]="selectedworkcoutrycode()" [countryListConfig]="countryListConfig"
                class="country-input" 
                (onCountryChange)="onCountryChange($event)">
              </lib-country-list>
            </div>
            <input type="text" class="form-control custom-input" 
              (input)="onWorkNumberInput()" 
              placeholder="Please enter work number" id="phonenumbers" aria-describedby="phonenumbers"
              autocomplete="off" required>
          </div>

        <div class="col-md-6 col-lg-4 mb-3"  >
          <label for="employeeId" class="form-label custom-label mb-2" >Company Address<span
              class="text-danger">*</span></label>
          <textarea  autocomplete="off" class="form-control custom-input" id="company-address"
             placeholder="Please enter company address" > </textarea>
        </div>



        <div class="col-md-6 col-lg-4 mb-3" >
          <label for="salutation" class="form-label custom-label mb-2">Default Currency<span
              class="text-danger">*</span></label>
          <div class="custom-p-select-content">
            <p-select  optionLabel="titlename" placeholder="Please select default currency"
                class="form-select custom-select"
              ></p-select>
          </div>
        </div>


        <div class="col-md-6 col-lg-4 mb-3" >
          <label for="salutation" class="form-label custom-label mb-2">Date Format<span
              class="text-danger">*</span></label>
          <div class="custom-p-select-content">
            <p-select  optionLabel="titlename" placeholder="Please select date format"
                class="form-select custom-select"
              ></p-select>
          </div>
        </div>


        <div class="col-md-6 col-lg-4 mb-3" >
          <label for="salutation" class="form-label custom-label mb-2">Time Zone<span
              class="text-danger">*</span></label>
          <div class="custom-p-select-content">
            <p-select  optionLabel="titlename" placeholder="Please select time zone"
                class="form-select custom-select"
              ></p-select>
          </div>
        </div>



        <div class="col-md-6 col-lg-4 mb-3" >
          <label for="salutation" class="form-label custom-label mb-2">Primary Language<span
              class="text-danger">*</span></label>
          <div class="custom-p-select-content">
            <p-select  optionLabel="titlename" placeholder="Please select primary language"
                class="form-select custom-select"
              ></p-select>
          </div>
        </div>


        <div class="col-md-6 col-lg-4 mb-3">
          <label for="dob" class="form-label custom-label mb-2">Fiscal Year Settings<span class="text-danger">*</span></label>
          <input type="date" class="form-control custom-input" id="dob" 
            onkeypress="return false" />
        </div>

        <div class="col-md-6 col-lg-4 mb-3">
          <label for="firstName" class="form-label custom-label mb-2">PAN Number<span
              class="text-danger">*</span></label>
          <input type="text" autocomplete="off" class="form-control custom-input" id="PAN-number"
            placeholder="Please enter PAN number"
            />
        </div>

         <div class="col-md-6 col-lg-4 mb-3">
          <label for="firstName" class="form-label custom-label mb-2">GSTIN<span
              class="text-danger">*</span></label>
          <input type="text" autocomplete="off" class="form-control custom-input" id="GSTIN"
            placeholder="Please enter GSTIN"
            />
        </div>

        <div class="col-md-6 col-lg-4 mb-3">
          <label for="lastName" class="form-label custom-label mb-2">CIN Number<span class="text-danger">*</span></label>
          <input type="text" autocomplete="off" class="form-control custom-input" id="CIN-number"
            placeholder="Please enter CIN number"
           >
        </div>
        <div class="col-md-6 col-lg-4 mb-3">
          <label for="gender" class="form-label custom-label mb-2">Gender<span class="text-danger">*</span></label>
          <div class="custom-p-select-content">
            <p-select  optionLabel="genderName" optionValue="genderName"
              placeholder="Please select gender" formControlName="gender" class="form-select custom-select"></p-select>
          </div>
      
        </div>

      

        <div class="col-md-6 col-lg-4 mb-3">
          <label for="bloodGroup" class="form-label custom-label mb-2">Country/Region
          </label>
          <div class="custom-p-select-content">
            <p-select  optionLabel="name" placeholder="Please select country/region"
               class="form-select custom-select"></p-select>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
