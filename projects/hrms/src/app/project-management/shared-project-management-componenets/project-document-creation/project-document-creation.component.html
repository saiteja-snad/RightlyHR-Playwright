<div class="custom-main-popup-container" ngbAutofocus>
    <div class="custom-poup-header-content popup-header-border">
        <div>
            <p class="popup-heading mb-0">{{'Add Document' | translate}}</p>
        </div>
    </div>

    <div class="custom-main-popup-content">
        <form [formGroup]="addDocumentForm" autocomplete="off" (ngSubmit)="addDocument()">
            <div class="row">
                <!-- Document Type -->
                <div class="col-md-6 mb-3">
                    <label for="documentType" class="form-label custom-label mb-2">{{'Document Type' | translate}}
                        <span class="text-danger">*</span></label>
                    <div class="custom-p-select-content">
                        <p-select [options]="documentTypes" filterBy="value" [filter]="true" [resetFilterOnHide]="true"
                            optionLabel="value" optionValue="value" formControlName="documentType"
                            [placeholder]="'Please select document type' | translate" class="form-select custom-select"></p-select>
                    </div>
                    <div class="error-msg" *ngIf="addDocumentForm.get('documentType')?.touched && addDocumentForm.get('documentType')?.invalid">
                        {{'Document Type is required' | translate}}</div>
                </div>

                <!-- File Name -->
                <!-- <div class="col-md-6 mb-3">
                    <label for="documentName" class="form-label custom-label mb-2">File Name
                        <span class="text-danger">*</span></label>
                    <input type="text" id="documentName" formControlName="documentName" [minlength]="2" [maxlength]="101"
                        class="form-control custom-input" placeholder="Please enter file name" />
                    <div class="error-msg">
                        <div *ngIf="addDocumentForm.get('documentName')?.touched && addDocumentForm.get('documentName')?.errors?.['required']">
                            File Name is required</div>
                        <div *ngIf="addDocumentForm.get('documentName')?.errors?.['maxCharacters'] || addDocumentForm.get('documentName')?.errors?.['maxlength']">
                            {{ 'File Name must be less than or equal to 100 characters' | translate }}</div>
                        <div *ngIf="addDocumentForm.get('documentName')?.errors?.['minCharacters'] || addDocumentForm.get('documentName')?.errors?.['minlength']">
                            {{ 'File Name must be at least 2 characters' | translate }}</div>
                    </div>
                </div> -->

                <!-- Document Attachment -->
                <div class="col-md-6 mb-3">
                    <label for="documentAttachment" class="form-label custom-label mb-2">{{'Attachment' | translate}}
                        <span class="text-danger">*</span></label>
                    <input type="file" accept=".png, .jpg, .jpeg, .pdf, .doc, .docx, .xls, .xlsx"
                        (change)="onChangeClientAttachment($event)" id="documentAttachment"
                        formControlName="documentUrl" class="form-control custom-input px-0" />
                    <div class="error-msg" *ngIf="fileErrorMessage">{{ fileErrorMessage }}</div>
                    <div class="error-msg" *ngIf="addDocumentForm.get('documentUrl')?.touched && 
                    addDocumentForm.get('documentUrl')?.invalid &&!fileErrorMessage">{{'Attachment is required' | translate}}</div>
                </div>
            </div>

            <!-- Form Buttons -->
            <div class="custom-modal-footer">
                <button type="button" class="custom-btn btn-secondary"
                    (click)="closepopup(confirmationpopupfornodue)">{{'Cancel' | translate}}</button> <button type="submit"
                    class="custom-btn btn-primary" [disabled]="addDocumentForm.invalid || spinnerLoader">
                    @if (spinnerLoader) {
                    <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                    <span>{{'Loading' | translate}}...</span>
                    } @else {
                    <span>{{'Add'| translate}}</span>
                    }
                </button>
            </div>
        </form>
    </div>
</div>

<!--Confirmation-->
<ng-template #confirmationpopupfornodue let-model>
    <div class="result-popup-content" ngbAutofocus>
        <div>
            <img src="icons/reject.png" alt="failure icon" class="confirmation-delete-icon">
            <p class="confirmation-text">{{'Are you sure you want to cancel?' | translate}}</p>
        </div>
        <div class="custom-modal-footer">
            <button type="button" (click)="model.dismiss()" class="custom-btn btn-secondary">{{'No' | translate}}</button>
            <button type="button" class="custom-btn btn-primary" (click)="close();model.dismiss()">{{'Yes' | translate}}</button>
        </div>
    </div>
</ng-template>
