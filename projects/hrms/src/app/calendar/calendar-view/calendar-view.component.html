<div class="custom-main-component-container">
  <div class="component-header-content py-2">
    <div class="heading-content">
      <div class="component-header">Calendar</div>
      <div>
        <img src="\icons\moduelicon.png" alt="Icon" placement="bottom" [ngbPopover]="popContent" class="module-icon">
      </div>
    </div>
  </div>

  <!--Module Information-->
  <ng-template #popContent>
    <app-module-information [moduleInfo]="moduleinfo" />
  </ng-template>

  <!--Content-->
  <div class="d-flex gap-3 w-100">
    <!--sub tabs Content-->
    <div class="custom-component-left-content">
      <div class="form-check d-flex align-items-center">
        <input type="checkbox" class="form-check-input me-2" id="showBirthdays" [(ngModel)]="showBirthdays"
          (change)="filterEventsByTitle()">
        <div class="box mt-1 me-2" [ngStyle]="{'background-color':  '#E1E8FE','border-color':'#8f96af'}"></div>
        <label class="form-check-label" for="showBirthdays">
          <img src="calendar/birthday.png" alt="Birthday Image" class="custom-event-icon me-1">{{ 'Birthdays' |
          translate}}
        </label>
      </div>
    
      <div class="form-check d-flex align-items-center">
        <input type="checkbox" class="form-check-input me-2" id="showAnniversaries" [(ngModel)]="showAnniversaries"
          (change)="filterEventsByTitle()">
        <div class="box mt-1 me-2" [ngStyle]="{'background-color':  '#FEE7E1','border-color':'#d6a192'}"></div>
        <label class="form-check-label" for="showAnniversaries"><img src="calendar/milestone.png" alt="Mile Stone Icon"
            class="custom-event-icon me-1">{{ 'Anniversaries' | translate}}</label>
      </div>
    
      <div class="form-check d-flex align-items-center">
        <input type="checkbox" class="form-check-input me-2" id="showJoinees" [(ngModel)]="showJoinees"
          (change)="filterEventsByTitle()">
        <div class="box mt-1 me-2" [ngStyle]="{'background-color':  '#FEE1F7','border-color':'#db83c3'}"></div>
        <label class="form-check-label" for="showJoinees"><img src="calendar/new-joinees.png" alt="New Joinee icon"
            class="custom-event-icon me-1">{{ 'New Joinees' | translate }}</label>
      </div>
    
      <div class="form-check d-flex align-items-center">
        <input type="checkbox" class="form-check-input me-2" id="showHolidays" [(ngModel)]="showHolidays"
          (change)="filterEventsByTitle()">
        <div class="box mt-1 me-2" [ngStyle]="{'background-color':  '#E1FEF4','border-color':'#6cb39b'}"></div>
        <label class="form-check-label" for="showHolidays"><img src="calendar/holidays.png" alt="Mile Stone Icon"
            class="custom-event-icon me-1">{{ 'Holidays' | translate }}</label>
      </div>
    </div>

    <div class="calender-content">
      <full-calendar [options]="calendarOptions" [events]="eventsPromise | async">
        <ng-template #eventContent let-arg>
          <!-- <b *ngIf="arg.timeText" >{{ arg.timeText }}</b> -->
          <div class="event-title m-0">{{ arg.event.title }}
            <img [src]="arg.event.display" alt="arg" class="ms-2">
          </div>
        </ng-template>
      </full-calendar>
    </div>
  </div>
</div>
