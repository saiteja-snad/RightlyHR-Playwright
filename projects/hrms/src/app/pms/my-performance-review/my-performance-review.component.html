<div class="custom-main-component-container">
    <div class="component-header-content">
        <div class="heading-content">
            <div class="commpoment-name">{{'PMS'  | translate}} <span class="ms-1"><i class="bi bi-chevron-double-right"></i></span></div>
            <div class="component-header">{{'My Performance Review' | translate}}</div>

            <div>
                <app-module-info-icon placement="bottom" [ngbPopover]="popContent" />
            </div>
        </div>
        <div class="d-flex align-items-center gap-3">
            <app-applicable-policies-trigger [moduleKey]="applicablePolicies.moduleKey"
                [subModuleKey]="applicablePolicies.subModuleKey">
            </app-applicable-policies-trigger>
        </div>
    </div>

    <!--Module Information-->
    <ng-template #popContent>
        <app-module-information [moduleInfo]="moduleinfo" />
    </ng-template>

    <!--PMS Tabs-->
    <div class="mb-3">
        <app-performace-review-tabs />
    </div>

    <div class="mb-3">
        <app-my-performance-tabs />
    </div>

    <div>
        <router-outlet />
    </div>
</div>
