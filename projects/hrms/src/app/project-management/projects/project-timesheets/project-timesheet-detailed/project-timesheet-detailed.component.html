<div class="custom-component-right-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="total-hrs">Total Hours: 1,500:00</div>
        <div></div>
    </div>

    <div class="custom-table-content">
        <table class="w-100">
            <thead>
                <tr>
                    <th>Employee Name</th>
                    <th>Department</th>
                    <th>Team</th>
                    <th>Role</th>
                    <th>Logged Hours</th>
                    <th class="text-center">Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Employee Name</td>
                    <td>Department</td>
                    <td>Team</td>
                    <td>Role</td>
                    <td>Logged Hours</td>
                    <td class="text-center">
                        <a type="button" (click)="openModalLarge(punchintimes);"><app-info-icon /></a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<ng-template #punchintimes let-modal>
    <div class="custom-main-popup-container" ngbAutofocus>
        <div class="custom-poup-header-content popup-header-border">
            <div class="pt-2">
                <p class="popup-heading mb-0">Summary (Jan 1, 2025 )</p>
            </div>
            <div>
                <a (click)="modal.dismiss()"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
            </div>
        </div>

        <div class="custom-main-popup-content custom-accordians">
            <div class="popup-table-wrapper">
                <div class="popup-table-scroll-container">
                    <table class="popup-table">
                        <thead>
                            <tr>
                                <th>Logged Hours</th>
                                <th>Description</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>In</td>
                                <td>Out</td>
                                <td>Duration</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</ng-template>
