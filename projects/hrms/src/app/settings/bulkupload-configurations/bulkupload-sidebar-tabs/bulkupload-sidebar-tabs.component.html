<div class="custom-sub-tabs-container">
  <ul class="nav flex-column">
    <li class="nav-item" *ngFor="let tab of tabs; trackBy: trackByTabId">
      <div class="nav-link cursor-pointer" (click)="navigate(tab.link)" [class.active-nav-link]="isTabActive(tab.link)">
        <img *ngIf="tab.icon" [src]="tab.icon" alt="Icon" class="icon mb-2">
        <div class="d-flex">{{ tab.label | translate }}</div>
      </div>
      <div class="tabs-border-bottom"></div>
    </li>
  </ul>
</div>
