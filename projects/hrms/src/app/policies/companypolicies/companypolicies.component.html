    <div class="mt-4 mb-4" >
      <div class="d-flex">
        <div class="col-6 d-flex align-items-center">
            <span class="selectpo me-2">Select year :</span>
            <form [formGroup]="policiesform" class="mb-0">
              <!-- <select formControlName="selectedYear" class="date" aria-label="Default select example">
                <option *ngFor="let year of years" [value]="year">{{ year }}</option>
              </select> -->
              <p-select formControlName="selectedYear" [options]="years" placeholder="Select Year" optionLabel="label"
               optionValue="value" class="date" aria-label="Default select example">
              </p-select>
            </form>
        </div>
          
      </div>
  
      <div class="custom-table-content">
        <table class="w-100">
          <thead>
            <th>Policy Name</th>
            <th>Description</th>
            <th>Attachment</th>
            <!-- <th>Download</th> -->
          </thead>
          <tbody>
            <ng-container *ngIf="(orgPolicyItemsArray).length; else noResults">
            <tr *ngFor="let item of orgPolicyItemsArray
            ">
              <td>{{item.policyName}}</td>
              <td>{{item.policyDescription}}</td>
              <td data-bs-toggle="modal" data-bs-target="#exampleModal">
                <a class="dropdown-item" (click)="onViewClick(item.policyAttachment)">
                  <i class="bi bi-paperclip me-2"></i>View
                </a>
              </td>
          </tr>
            </ng-container>
            <ng-template #noResults>
              <tr>
                  <td class="text-center noresults" colspan="11">No data found</td>
              </tr>
          </ng-template>
          </tbody>
        </table>
      </div>
    </div>
  
  </div>
  
  <!-- Modal -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Policy</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" ></button>
        </div>
        <div class="modal-body" style="text-align: center;">
            <div class="spinner-border text-primary d-inline-block ms-3" style="width: 2rem;height: 2rem;"
            role="status">
            <span class="sr-only"></span>
          </div>
          <p class="mb-4">Loading...</p>
        </div>
          
         
        <p *ngIf="!EduImageUrl; else imageView">
            <ngx-doc-viewer [url]="EduViewURL" viewer="google" style="width:100%;height:100vh;"></ngx-doc-viewer>
          </p>
          
            
            <ng-template #imageView>
              <img [src]="EduImageUrl" alt="My Image" class="modal-image">
            </ng-template> 
         
        </div>
        <div class="modal-footer">
        </div>
      </div>
    </div>
  <!-- </div> -->
