<div class="custom-sub-tabs-container">
  <ul class="nav flex-column">
    <li class="nav-item" *ngFor="let tab of filteredTabs">
      <div class="nav-link" [routerLink]="[tab.link]" [queryParamsHandling]="'preserve'"  
       [class.active-nav-link]="isDocumentTabActive(tab.link)" >
        <img [src]="tab.icon" alt="Icon" class="icon mb-2">
        <div class="d-flex">{{ tab.label | translate}}</div>
      </div>
      <div class="tabs-border-bottom"></div>
    </li>
  </ul>
</div>
