<div class="custom-main-component-container">
    <div class="main-content-heading my-4">
        <span>Onboarding Documents</span>
    </div>

    <div>
        <form action="">
            <div class="custom-main-sub-content">
                <div class="custom-table-content">
                    <table class="w-100">
                        <thead>
                            <tr>
                                <th>Document Type</th>
                                <th>Document Number</th>
                                <th>Submitted Date</th>
                                <th>Verified By</th>
                                <th>Verification Status</th>
                                <th>Reason</th>
                                <th>Attachment</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>payroll</td>
                                <td>-</td>
                                <td>-</td>
                                <td>-</td>
                                <td>Waiting for submission</td>
                                <td>-</td>
                                <td>-</td>
                                <td><button type="button" class="custom-btn btn-primary py-3" (click)="openUpload()"><i class="bi bi-upload me-2"></i>Upload</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="footer-btn-content d-flex justify-content-end pt-5">
                <button class="custom-btn btn-primary py-3 px-5">Submit</button>
            </div>
        </form>
    </div>
</div>

<ng-template #uploadPopup let-modal>
    <div class="modal-body" ngbAutofocus>
        <div class="custom-main-popup-container">
            <div class="d-flex justify-content-between popup-header-border p-4">
                <div class="pt-2">
                    <p class="popup-heading mb-0">Upload</p>
                </div>
                <div>
                    <a (click)="close()"><img src="/images/close.png" alt="Close Icon" class="close-icon"></a>
                </div>
            </div>
            <div class="custom-main-popup-content p-4">
                <form action="">
                    <div>
                        <div class="mb-3">
                            <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Document Type<span class="text-danger">*</span></label>
                            <input type="email" class="form-control custom-input" id="exampleFormControlInput1"
                                placeholder="document type">
                        </div>
                        <div class="mb-3">
                            <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Document Number<span class="text-danger">*</span></label>
                            <input type="email" class="form-control custom-input" id="exampleFormControlInput1"
                                placeholder="Please enter document number">
                        </div>
                        <div class="col-md-12 mb-3">
                            <label for="file" class="form-label custom-label mb-2">Upload Document<span class="text-danger">*</span></label>
                            <input type="file" class="form-control custom-input" id="file">
                        </div>
                        <div class="mb-5">
                            <p class="note-text"><span class="note me-2">Note:</span>Only Pdf and image are allowed. The file size should be less than 25MB.</p>
                        </div>
                    </div>
                    <div class="d-flex justify-content-end gap-3 mt-4">
                        <button type="reset" class="custom-btn btn-secondary" (click)="close()">Close</button>
                        <button type="submit" class="custom-btn btn-primary">Upload</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</ng-template>
