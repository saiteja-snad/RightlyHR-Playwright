
<div class="component-side-nav-tabs-container py-3">
  <ul class="nav flex-column">
    <li class="nav-item" *ngFor="let tab of statusTabs">
      <a class="nav-link" [routerLink]="[tab.link]" routerLinkActive="active-nav-link">
        {{ tab.label }}
        <ng-container *ngIf="tab.label !== 'Org Leave Balance'">
          ({{ tab.count ?? 0 }})
        </ng-container>
      </a>
    </li>
  </ul>
</div>
