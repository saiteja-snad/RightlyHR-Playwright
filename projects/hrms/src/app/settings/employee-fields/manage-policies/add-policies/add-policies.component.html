<div class="custom-main-component-container w-100">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <p class="component-header mb-0">
        <i class="bi bi-arrow-90deg-left me-2" (click)="navigation()"></i>Add Policies
      </p>
    </div>
  </div>

  <div class="custom-setting-right-content w-100 p-3">
    <!--Select Fields-->
    <div class="d-flex gap-3 mt-4">

      <div class="custom-p-select-content">
        <p-select [options]="salaryHoldDetails" optionLabel="name" placeholder="Select year"
          class="form-select custom-select">
        </p-select>
      </div>
      <div class="custom-p-select-content">
        <p-select [options]="salaryHoldDetails" optionLabel="name" placeholder="Select location"
          class="form-select custom-select">
        </p-select>
      </div>
      <div class="custom-p-select-content">
        <p-select [options]="salaryHoldDetails" optionLabel="name" placeholder="Select Sub-location "
          class="form-select custom-select">
        </p-select>
      </div>

      <div>
        <button type="button" class="custom-btn btn-primary " >
          <i class="bi bi-plus me-2"></i> Add Policies
      </button>
      </div>
    </div>
    <div class="card custom-background-card p-3 mt-2">
      <div class="row">

        <div class="col-md-4">
          <label class="form-label custom-label">Policy Name<span class="text-danger">*</span></label>
          <input type="text" class="form-control custom-input" placeholder="Please enter holiday name" />
        </div>

        <div class="col-md-4">
          <label class="form-label custom-label"> Policy Description<span class="text-danger">*</span></label>
          <textarea class="form-control custom-input" placeholder="Write description here..." rows="1"></textarea>



        </div>
        <div class="col-md-4">
          <label class="form-label custom-label">Policy Attachmen<span class="text-danger">*</span></label>
          <input type="file" class="form-control custom-input" accept=".pdf, image/*" />


        </div>

      </div>
    </div>
  </div>
</div>
