<div class="header-main-container">
    <div class="d-flex justify-content-between align-items-center">
        <!--Logo-->
        <div class="me-4">
            <img src="/logos/SNAD-horizontal-logo.png" alt="Company Logo" class="logo-image">
        </div>

        <!-- <div class="left-content">
            <div>
                <div *ngIf="isActive('myinfo')">
                    <app-myinfo-header-tabs />
                </div>
                <div *ngIf="isActive('personalinfo')">
                    <app-personalinfo-header-tabs />
                </div>
                
            </div>
        </div>  -->

        <div class="d-flex right-content">
            <div class="dropdown">
                <div class="card custom-profile-card p-2" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <div class="d-flex gap-2">
                        <div>
                            <div class="d-flex justify-content-center align-items-center">
                                <p class="name  text-nowrap mb-0">{{empdata?.firstName}} {{empdata?.middleName || ''}}
                                    {{empdata?.lastName}}</p>
                            </div>
                            <div class="d-flex justify-content-center align-items-center">
                                <p class="sub-text text-nowrap mb-0 me-3">{{jobRole}}</p>
                            </div>

                        </div>

                        <div>
                            <a>
                                <img [src]="imageUrl ? imageUrl : 'images/alternate.png'" alt="Profile Image"
                                    class="profile-img cursor">
                            </a>
                        </div>
                    </div>
                </div>

                <ul class="dropdown-menu  custom-drop-down-profile-card">
                    <!-- @if(rbac.allowedToAccess('Invite New User.view')){
                    <li>
                        <a class="dropdown-item" (click)="navigateToAccessedRoute('/admin/active-new-user')">
                            <i class="bi bi-envelope-plus me-2"></i>Invite New User</a>
                    </li>
                    } -->

                    <div>
                        <div class="d-flex justify-content-center mb-2">
                            <div class="image-content">
                                <img [src]="imageUrl ? imageUrl : 'images/alternate.png'" alt="profile Image"
                                    class="profile-image">
                                <div class="edit-icon-content">
                                    <label for="formFile" class="form-label"><img src="/images/editimages.png"
                                            alt="edit-icon" class="edit-icon cursor"></label>
                                    <input class="form-control d-none" type="file" id="formFile" accept=".jpg"
                                        (change)="chooseNewProfile($event)">
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-center align-items-center ">

                            <p class="name mb-0">{{empdata?.firstName}} {{empdata?.middleName || ''}}
                                {{empdata?.lastName}}</p>
                        </div>
                        <div class="d-flex justify-content-center align-items-center">
                            <p class="sub-text mb-0">{{this.empdata?.workEmail || 'N/A'}}</p>
                        </div>
                        <div class="d-flex justify-content-center align-items-center">
                            <p class="sub-text mb-1 ">{{jobRole}}</p>

                        </div>
                        <div>
                            <hr class="dashed-line m-0 ">
                        </div>

                        <div class="d-flex justify-content-center align-items-center mt-2">

                            <a class="view-profile" [routerLink]="['/myinfo/personal/basic-info']">
                                View Profile</a>

                        </div>
                        <div class="d-flex justify-content-center align-items-center cursor  "
                            (click)="openlogoutModal()">
                            <div class="logout-content ">
                                <div>
                                    <img src="/icons/logout-icon.png" alt="Logout" class="logout-icon">
                                </div>
                                <div class="logout-text pt-1">Logout</div>
                            </div>
                        </div>

                    </div>


                </ul>
            </div>
        </div>
    </div>
</div>

<ng-template #logoutpopup let-modal>
    <div class="result-popup-content" ngbAutofocus>
        <div>
            <img src="images\logout-image.png" alt="failure icon" class="confirmation-delete-icon">
            <p class="confirmation-text">Are you sure you want to logout?</p>
        </div>
        <div class="custom-modal-footer">
            <button type="button" class="custom-btn btn-secondary" (click)="close()">{{'No'| translate}}</button>
            <button type="submit" class="custom-btn btn-primary" (click)="onLogout()">
                @if(spinnerLoader){
                <div class="button-loader-content">
                    <span class="spinner-border button-spinner text-light" role="status" aria-hidden="true"></span>
                    <span>{{'Loading...'}}</span>
                </div>
                }@else {
                <span>{{'Yes'| translate}}</span>
                }
            </button>
        </div>
    </div>
</ng-template>
