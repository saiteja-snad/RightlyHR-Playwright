<ng-template #policyViewerModal let-modal>
  <div class="custom-main-popup-container">
    <div class="custom-poup-header-content popup-header-border">
      <div class="pt-2">
        <p class="popup-heading mb-0">{{ selectedPolicy?.policyName }}</p>
      </div>
      <div class="d-flex align-items-center gap-3">
        <a (click)="modal.dismiss(); close()">
          <img src="icons/close.png" alt="Close Icon" class="close-icon">
        </a>
      </div>
    </div>

    <div class="custom-main-popup-content text-center">
      <div class="image-content-view position-relative">
        <div *ngIf="documentLoading" class="d-flex justify-content-center align-items-center position-absolute w-100 h-100 viewer-loader">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <ng-container *ngIf="imageUrl; else documentPreview">
          <img [src]="imageUrl" alt="Policy Image" class="modal-image" />
        </ng-container>

        <ng-template #documentPreview>
          <ngx-doc-viewer
            *ngIf="previewUrl"
            [url]="previewUrl"
            viewer="google"
            class="policy-doc-viewer">
          </ngx-doc-viewer>
        </ng-template>
      </div>

      <div
        class="modal-footer justify-content-end bg-white px-4 py-3 border-top">
        <!-- <form [formGroup]="ackForm" class="d-flex justify-content-between w-100 align-items-center">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="policyAckCheckbox" formControlName="acknowledged" />
            <label class="form-check-label" for="policyAckCheckbox">
              {{ 'I acknowledge that I have read and agree to the policy.' | translate }}
            </label>
          </div>

          <button class="btn btn-primary" type="button" [disabled]="ackForm.invalid || loading" (click)="acknowledgeSelectedPolicy()">
            <span *ngIf="!loading">{{ 'Acknowledge' | translate }}</span>
            <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          </button> -->
          <button type="button" class="custom-btn btn-secondary" (click)="downloadSelectedPolicy()">
          {{ 'Download' | translate }}
        </button>
      </div>
    </div>
  </div>
</ng-template>
