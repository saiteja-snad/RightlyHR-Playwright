<div class="custom-main-component-container">
  <div class="component-header-content pt-2">
    <div class="heading-content">
      <div class="component-header"> Contacts Directory </div>
    </div>
  </div>

  <div class="custom-card p-2 mb-3">
    <div *ngFor="let dept of contactData" class="mb-4">
      <p class="fw-bold fs-5 text-capitalize">{{ dept.department }}</p>

      <div class="cards-container" *ngFor="let item of dept.employees">
        <div class="phone-book-cards">
          <div class="d-flex gap-2 p-2">
            <div class="d-flex justify-content-center align-items-center">
              <img [src]="item.profileUrl" (error)="item.profileUrl = 'images/alternate.png'" alt="profile" class="profile-icon">
            </div>
            <div>
              <p class="name pt-2 mb-2">{{item.name}}</p>
              <p class="label-text mb-2">
                <span class="bi bi-envelope me-1"></span> {{item.emailid}}
              </p>
              <p class="label-text m-0">
                <span class="bi bi-telephone me-1"></span> {{item.contactNumber}}
              </p>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
