<div class="custom-main-component-container w-100">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <p class="component-header mb-0" (click)="Cancel()">
        <i class="bi bi-arrow-90deg-left me-2"></i>{{'Update Policy' | translate}}
      </p>
    </div>
  </div>
  <form autocomplete="off" [formGroup]="policyForm" (ngSubmit)="submit()">
    <div class="custom-setting-right-content w-100 p-3">
      <!--Select Fields-->
      <div class="d-flex gap-3 mb-3">
        <!-- Year -->
        <div>
          <label for="year" class="form-label custom-label mb-2">
            {{ "Year" | translate }}<span class="text-danger">*</span>
          </label>
          <div class="custom-p-select-content">
      
            <p-select [options]="yearDetails" optionLabel="name" placeholder="Select year" formControlName="year"
              class="form-select custom-select">
            </p-select>
          </div>
        </div>
      
        <!-- Location -->
        <div>
          <label for="location" class="form-label custom-label mb-2">
            {{ "Location" | translate }}<span class="text-danger">*</span>
          </label>
          <div class="custom-p-select-content">
            <p-select [options]="jobLocationDropDownData" optionLabel="jobLocationName" optionValue=""
              formControlName="location" placeholder="Select location" class="form-select custom-select"
              (onChange)="getSubLocationByid($event.value)">
            </p-select>
          </div>
        </div>
      
        <!-- Sub Location -->
        <div>
          <label for="subLocation" class="form-label custom-label mb-2">
            {{ "Sub Location" | translate }}<span class="text-danger">*</span>
          </label>
          <div class="custom-p-select-content">
            <p-select [options]="subLocationsDropdown" optionLabel="jobSubLocationName" optionValue=""
              formControlName="subLocation" placeholder="Please select sub location" (onChange)="getShiftBYid($event)"
              class="form-select custom-select"></p-select>
          </div>
        </div>
      
        <!-- Shift -->
        <div>
          <label for="shift" class="form-label custom-label mb-2">
            {{ "Shift" | translate }}<span class="text-danger">*</span>
          </label>
          <div class="custom-p-select-content">
            <p-select [options]="shiftDropdown" optionLabel="shiftName" optionValue="" formControlName="shift"
              placeholder="Select shift" class="form-select custom-select"></p-select>
          </div>
        </div>
      
        <div class="pt-4 mt-1">
          <button type="button" class="custom-btn btn-primary px-4" (click)="addPolicyRow(); hidePublishCloneButtons = true">
            <i class="bi bi-plus me-2"></i>{{'Add New' | translate}}
          </button>
        </div>
      </div>

      <div formArrayName="policies">
        <div *ngFor="let policy of policies.controls; let i = index" [formGroupName]="i"
          class="card custom-background-card p-3 mb-3">
          <div class="d-flex gap-3">
            <div class="w-100">
              <label class="form-label custom-label">{{'Policy Name' | translate}}<span class="text-danger">*</span></label>
              <input type="text" formControlName="policyName" class="form-control custom-input w-100"
                placeholder="Please enter policy name" maxlength="50"
                (keydown)="formValidations.restrictInitialSpace($event)" />
              <div *ngIf="policy.get('policyName')?.touched && policy.get('policyName')?.invalid" class="error-msg">
                {{'Policy Name is required'|translate}}
              </div>
            </div>
        
        
            <div class="w-100">
              <label class="form-label custom-label">
                {{'Policy Attachment (Image and PDF only)' | translate}}<span class="text-danger">*</span>
              </label>
              <div class="d-flex align-items-center gap-2">
                <input type="file" (change)="onPolicyFileChange($event, i)" class="form-control custom-input w-100 px-0" accept=".pdf,image/*"/>
                <div [ngbPopover]="newPopContent" triggers="click" placement="top">
                  <i class="bi bi-info-circle-fill cursor"></i>
                </div>
              </div>
              <ng-template #newPopContent>
                <div>{{ getPolicyAttachmentName(policy.get('policyFile')?.value) }}</div>
              </ng-template>
            </div>
        
            <div class="w-100">
              <div class="d-flex justify-content-between">
                <div>
                  <label class="form-label custom-label">{{'Description' | translate}}<span class="text-danger">*</span></label>
                </div>
                <div>
                  <button title="Delete" type="button" (click)="removePolicyRow(i)" *ngIf="policies.length > 1"
                    class="btn p-0 border-0 bg-transparent">
                    <img src="/icons/red-trash-icon.png" alt="trash-icon" class="red-trash-icon" />
                  </button>
                </div>
              </div>
              <input type="text" formControlName="policyDescription" class="form-control custom-input w-100"
                placeholder="Please enter description" maxlength="50"
                (keydown)="formValidations.restrictInitialSpace($event)" />
              <div *ngIf="policy.get('policyDescription')?.touched && policy.get('policyDescription')?.invalid"
                class="error-msg">
                {{'Policy Description is required'|translate}}
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="d-flex gap-3 justify-content-end pt-4">
        <button type="button" class="custom-btn btn-secondary px-5" (click)="Cancel()">
          {{'Close' | translate}}
        </button>
        <button type="button" class="custom-btn clone-btn px-5" (click)="clonePolicy1()">
          {{'Clone' | translate}}
        </button>
        <button type="button" class="custom-btn publish-btn px-5" (click)="publish()">
          {{'Publish' | translate}}
        </button>
        <button type="submit" class="custom-btn btn-primary px-5" [disabled]="this.policies.invalid">
          {{'Update' | translate}}
        </button>
      </div>
    </div>
  </form>
</div>

<ng-template #deletepopup let-modal>
  <div class="result-popup-content" ngbAutofocus>

    <div>
      <img src="/icons/reject.png" alt="delete-icon" class="confirmation-delete-icon">
      <p class="confirmation-text">{{'Are you sure you want to close?'|translate}}</p>
    </div>
    <div class="custom-modal-footer">
      <button type="button" class="custom-btn btn-secondary " (click)="closeDelete(modal)">{{'No'|translate}}</button>
      <button type="button" class="custom-btn btn-primary " (click)="onDelete(modal)">{{'Yes'|translate}}</button>
    </div>
  </div>

</ng-template>
