<div class="main-layout-container w-100">
    <div class="">
        <app-header />
    </div>
    <div class="display-area">
        <div class="card custom-main-display-card" *ngIf="router.url === '/job-details'">
            <router-outlet/>
        </div>

        <div class="card custom-main-display-card all-main-details-content" *ngIf="router.url !== '/job-details'">
            <div class="d-flex justify-content-center w-100">
               <app-detailed-step-progressbar/>
            </div>
            <div>
                <router-outlet/>
            </div>
        </div>
    </div>
</div>
