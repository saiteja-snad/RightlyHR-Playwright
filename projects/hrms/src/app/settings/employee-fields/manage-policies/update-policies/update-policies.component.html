<div class="custom-main-component-container w-100">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <p class="component-header mb-0" (click)="nagvition()">
          <i class="bi bi-arrow-90deg-left me-2"></i>{{'Update Policy' | translate}}
        </p>
      </div>
    </div>
    <form [formGroup]="policyForm" (ngSubmit)="submit()">
      <div class="custom-setting-right-content w-100 p-3">
        <!--Select Fields-->
        <div class="d-flex gap-3 mt-4">
          <div class="custom-p-select-content">
            <p-select [options]="yearDetails" optionLabel="name" placeholder="Select year" formControlName="year"
              class="form-select custom-select">
            </p-select>
          </div>
          <div class="custom-p-select-content">
            <p-select [options]="jobLocationDropDownData" optionLabel="jobLocationName" optionValue=""
              formControlName="location" placeholder="Select location" class="form-select custom-select"
              (onChange)="getSubLocationByid($event.value)">
            </p-select>
          </div>
          <div class="custom-p-select-content">
            <p-select [options]="subLocationsDropdown" optionLabel="jobSubLocationName" optionValue=""
              formControlName="subLocation" placeholder="Please select sub location" (onChange)="getShiftBYid($event)"
              class="form-select custom-select"></p-select>
          </div>
          <div class="custom-p-select-content">
            <p-select [options]="shiftDropdown" optionLabel="shiftName" optionValue="" formControlName="shift"
              placeholder="Select shift" class="form-select custom-select"></p-select>
          </div>
          <div>
            <button type="button" class="custom-btn btn-primary" (click)="addPolicyRow(); hidePublishCloneButtons = true" >
              <i class="bi bi-plus me-2"></i> {{'Add Row' | translate}}
            </button>
          </div>
        </div>
        <div class="card custom-background-card p-3 mt-2">
          <div class="row">
            <div formArrayName="policies" class="card custom-background-card p-3 mt-2">
              <div *ngFor="let policy of policies.controls; let i = index" [formGroupName]="i"  class="row mb-2">
  
                <div class="col-md-3">
                    <label class="form-label custom-label">{{'Policy Name' | translate}}<span class="text-danger">*</span></label>
                    <input type="text" formControlName="policyName" class="form-control custom-input"
                      placeholder="Please enter policy name" />
                      <div *ngIf="policy.get('policyName')?.touched && policy.get('policyName')?.hasError('required')"
                        class="error-msg">
                        {{'Policy Name is required'|translate}}.
                    </div>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label custom-label">{{'Policy Attachment (Image and PDF only)' | translate}}<span class="text-danger">*</span></label>
                    <input title="text" type="file" formControlName="policyFile" class="form-control custom-input" />
                  </div>
                <div class="col-md-2 d-flex align-items-end">
                    <div class="form-check">
                        <label class="form-label custom-label">{{'Description' | translate}}<span class="text-danger">*</span></label>
                            <input type="text" formControlName="policyDescription" class="form-control custom-input"
                              placeholder="Please enter description" />
                      </div>
                  <button title="text" type="button" class="btn btn-sm btn-danger ms-2" (click)="removePolicyRow(i)"
                    *ngIf="policies.length > 1">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </div>
            </div>
            <!-- Submit Button -->
            
          </div>
        </div>
        
        </div>
        <div class="save-button d-flex justify-content-end">

            @if(!hidePublishCloneButtons){
                <button type="button" class="btn btn-danger mt-3 me-3 rounded-4 ps-4 pe-4 pt-2 pb-2" (click)="openmodel(cancelpopup)" id="submitButton">
                    {{'Cancel' | translate}}
                </button>
                <button type="button" class="btn btn-warning mt-3 me-3 rounded-4 ps-4 pe-4 pt-2 pb-2" (click)="clone()" id="submitButton">
                    {{'Clone' | translate}}
                </button>
                <button  type="button" class="btn btn-success mt-3 me-3 rounded-4 ps-4 pe-4 pt-2 pb-2" (click)="publish()" id="submitButton">
                    {{'Publish' | translate}}
                </button>
                }
                <button type ="submit" class="custom-btn btn-primary mt-3 me-3 rounded-4 ps-4 pe-4 pt-2 pb-2" id="submitButton"
                    [disabled]="this.policies.invalid">
                    {{'Update' | translate}}
                </button>
        </div>
        
    </form>
  </div>

  <ng-template #cancelpopup let-model>
    <div ngbAutofocus>
        <div class="d-flex flex-column justify-content-cenetr align-items-center" >
            <i class="bi bi-exclamation-circle-fill mt-4 mb-3"></i>
            <h4 class="text-center ps-3 pe-3 inactive-poptext">
                {{'Are you sure you want to cancel?' | translate}}
            </h4>
            <div class="d-flex mb-4 pb-2 mt-3 justify-content-around w-100">
                <button type="button" class="custom-btn btn-primary-reject" (click)="model.dismiss()">
                    {{'No' | translate}}
                </button>
                <button type="button" class="custom-btn btn-primary" (click)="cancel();model.dismiss()">
                    {{'Yes' | translate}}
                </button>
            </div>
        </div>
    </div>
</ng-template>
