<div class="heading-content">
    <div class="commpoment-name">Project Management<span class="ms-1"><i class="bi bi-chevron-double-right"></i></span>
    </div>
    @if(isShowClientRoute()){
    <div class="commpoment-name"><a (click)="navigateClient()"><u>Clients</u></a>
        <span class="ms-1"><i class="bi bi-chevron-double-right"></i></span>
    </div>
    }
    @if(isShowProjectRoute() && clients.clientName ){
    <div class="commpoment-name">{{clients.clientName}}
        <span class="ms-1"><i class="bi bi-chevron-double-right"></i></span>
    </div>
    }
    @if(isShowProjectRoute()){
    <div class="commpoment-name">
        <a (click)="navigateProject()"><u>Projects</u></a>
        <span class="ms-1"><i class="bi bi-chevron-double-right"></i></span>
    </div>
    }
    <div class="component-header">{{componentname}}</div>
    @if(!isHideInfo()){
    <div>
        <app-module-info-icon placement="bottom" [ngbPopover]="popContent" />
    </div>
    }
</div>

<!--Module Information-->
<ng-template #popContent>
    <app-module-information [moduleInfo]="moduleinfo" />
</ng-template>
