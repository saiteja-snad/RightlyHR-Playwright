    <!--Data Content-->
    <div class="custom-settings-data-table position-relative w-50">
        @if (!loading) {
        <table class="w-100">
            <thead>
                <tr>
                    <th > Letter Frequency</th>
                </tr>
            </thead>
            <tbody>
                <ng-container *ngIf="letterFrequencies.length > 0; else noDataTemplate">
                    @for (item of letterFrequencies; track $index) {
                    <tr>
                        <td class="w-75">{{item.value}}</td>
                     
                    </tr>
                    }
                </ng-container>
                <ng-template #noDataTemplate>
                    <app-no-data-found />
                </ng-template>
            </tbody>
        </table>
        }
        @else {
        <app-settings-loader />
        }
    </div>
</div>
