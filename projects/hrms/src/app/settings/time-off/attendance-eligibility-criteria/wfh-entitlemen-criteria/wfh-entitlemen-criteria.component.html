<div class="mt-4">
    <div class="custom-table-content mt-2">
        <ng-container *ngIf="eligibilityCriterias!.length > 0; else noDataTemplate">
            <table class="w-50">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Value</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let criteria of eligibilityCriterias">
                        <td>{{criteria.name}}</td>
                        <td>{{criteria.value}}</td>
                    </tr>
                </tbody>
            </table>
        </ng-container>
    </div>


</div>

<ng-template #noDataTemplate>
    <tr>
        <td colspan="2">
            <app-no-data-found></app-no-data-found>
        </td>
    </tr>
</ng-template>
