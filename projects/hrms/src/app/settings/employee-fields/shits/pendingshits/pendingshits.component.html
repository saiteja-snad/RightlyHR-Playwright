<div class="custom-table-content ">
    <table class="w-100">
        <thead>
            <tr>
                <th>Year</th>
                <th>Location</th>
                <th>Sub Location</th>
                <th>Status</th>
                <th>Added By</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <ng-container *ngIf="shiftsData!.length > 0; else noDataTemplate">
                <tr *ngFor="let shift of shiftsData; let i = index">
                    <td>{{ shift.applicableyear }}</td>
                    <td>{{ shift.locationName }}</td>
                    <td>{{ shift.subLocationName }}</td>
                    <td>{{ shift.addedbyName }}</td>
                    <td>{{ shift.status }}</td>
                    <td class="text-center">
                        <div class="dropdown">
                            <a data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-three-dots-vertical"></i>
                            </a>
                            <ul class="dropdown-menu custom-dropdown-menu">
                                <li><a class="dropdown-item" (click)="updateShift(shift.id)"><i class="bi bi-pencil me-2"></i>Update</a></li>
                            </ul>
                        </div>
                    </td>
                </tr>
            </ng-container>

            <ng-template #noDataTemplate>
                <tr>
                    <td colspan="4">
                        <app-no-data-found></app-no-data-found>
                    </td>
                </tr>
            </ng-template>
        </tbody>

    </table>
</div>
