<form [formGroup]="noticeperiodForm" (ngSubmit)="addNoticeperiod()">
    <div class="card main-settings-layout p-4">
      <!-- Add Input -->
      <div>
        <div class="custom-settings-add-input input-group mb-5">
          <input type="text" class="form-control custom-input" placeholder="Please Enter Notice Period"
            formControlName="noticeperiod" aria-label="noticeperiod" aria-describedby="noticeperiod" (keypress)="blockNonAlphabets($event)">
          <span class="input-group-text" id="noticeperiod">
            <button type="submit" class="custom-btn btn-primary" [disabled]="noticeperiodForm.invalid">{{ 'Add' | translate }}</button>
          </span>
        </div>
      </div>
      <div *ngIf="noticeperiodForm.get('noticeperiod')?.touched && noticeperiodForm.get('noticeperiod')?.invalid">
        <small style="color: red;font-size: 13px;" *ngIf="noticeperiodForm.get('noticeperiod')?.errors?.['required']">
          {{ 'Notice Period is required' | translate }}
        </small>
      </div>
  
      <!-- Data Content -->
      <div>
        <div class="custom-settings-data-table">
          <table class="w-100">
            <thead>
              <tr>
                <th class="col-span-2"></th>
              </tr>
            </thead>
            <tbody>
              @for (notice of noticeperiodDetail; track notice.id) {
              <tr *ngFor="let notice of noticeperiodDetail">
                <td class="w-75">{{ notice.period }}</td>
                <td class="w-25">
                  <div class="d-flex gap-4">
                    <!-- Update -->
                    <div>
                      <a (click)="openupdate(notice)"><img src="/settings-icon/edit.png" alt="edit icon"
                          class="settings-common-icon"></a>
                    </div>
                    <!-- Delete -->
                    <div>
                      <a (click)="openDelete(notice)"><img src="/settings-icon/trash-2.png" alt="delete icon"
                          class="settings-common-icon"></a>
                    </div>
                  </div>
                </td>
              </tr>
              }
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </form>
  
  <!-- Update popup -->
  <ng-template #updatepopup let-modal>
    <form [formGroup]="updateForm">
   <div class="custom-main-popup-container" ngbAutofocus>
       <div class="d-flex justify-content-between popup-header-border p-4">
           <div class="pt-2">
               <p class="popup-heading mb-0">{{'Edit noticeperiod'|translate}}</p>
           </div>
           <div>
               <a (click)="close(modal)"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
           </div>
       </div>
       <div class="custom-main-popup-content p-5">
           <div class="mb-4">
               <label for="exampleFormControlInput1" class="form-label custom-label mb-2">{{'noticeperiod'|translate}}<span
                       class="error-msg">*</span></label>
               <input type="text" class="form-control custom-input" formControlName="noticeperiod"
                   placeholder="Please Enter noticeperiod"  (keypress)="blockNonAlphabets($event)">
           </div>
           <div *ngIf="updateForm.get('noticeperiod')?.touched && updateForm.get('noticeperiod')?.invalid">
               <small style="color: red;font-size: 13px;" *ngIf="updateForm.get('noticeperiod')?.errors?.['required']">
                {{'noticeperiodName is required'|translate}}
               </small>
               <!-- <small style="color: red;" *ngIf="updateForm.get('jobLocationName')?.errors?.['pattern']">
                {{'Only alphabets and spaces are allowed'|translate}}
                 </small> -->
             </div>
           <div class="d-flex gap-5 pt-4 w-100">
               <button class="custom-btn btn-secondary w-50 py-3" (click)="close(modal)">{{'Close'|translate}}</button>
               <button class="custom-btn btn-primary w-50 py-3" (click)="updateNoticeperiod(modal)" [disabled]="updateForm.invalid">{{'Update'|translate}}</button>
           </div>
         
       </div>
   </div>
   </form>
</ng-template>
  <!-- Delete Confirmation popup -->
  <ng-template #deletepopup let-modal>
    <div class="modal-body" ngbAutofocus>
      <div class="custom-main-popup-content text-center p-4">
        <div class="py-5">
          <img src="/icons/delete-icon.png" alt="delete-icon" class="confirmation-icon mb-5">
          <p class="confirmation-text">{{ 'Are you sure you want to Delete?' | translate }}</p>
        </div>
        <div class="d-flex gap-5 pt-2 w-100">
          <button class="custom-btn btn-secondary w-50 py-3" (click)="closeDelete(modal)">{{ 'No' | translate }}</button>
          <button class="custom-btn btn-primary w-50 py-3" (click)="onDelete(modal)">{{ 'Yes' | translate }}</button>
        </div>
      </div>
    </div>
  </ng-template>
