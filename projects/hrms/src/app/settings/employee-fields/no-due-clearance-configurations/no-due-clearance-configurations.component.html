<div class="custom-main-component-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div><span class="component-sub-header">No Due Clearnce</span></div>
        <div class="custom-add-btn" >
          <i class="bi bi-plus plus-icon me-1"  (click)="openModal(addnodue)"></i>Add New
        </div>
      </div>
   
    <div class="custom-table-content">
      <table class="w-100">
        <thead>
          <tr>
            <th>Expense Title</th>
            <th>Expense Date</th>
            <th>Total Amount</th>
            <th>Status</th>
            <th class="text-center">Approver Comments</th>
            <th class="text-center">View Details
            </th>
  
          </tr>
        </thead>
        <tbody>
          <ng-container>
          
          </ng-container>
          <!-- No Data Found Template -->
          <ng-template #noDataTemplate>
            <tr>
              <td>
                <app-no-data-found />
              </td>
            </tr>
          </ng-template>
  
        </tbody>
      </table>
    </div>
  </div>
  

  <ng-template #addnodue let-modal>
    <div class="custom-main-popup-container" ngbAutofocus>
        <div class="d-flex justify-content-between popup-header-border p-4">
            <div class="pt-2">
                <p class="popup-heading mb-0">Add </p>
            </div>
            <div>
                <a (click)="modal.dismiss()"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
            </div>
        </div>
        <div class="custom-main-popup-content p-4">
       <!-- <--   formdata--/> -->

        </div>
    </div>
</ng-template>
