<div class="custom-main-component-container">
    <div class="d-flex gap-3 w-100">
        <!--sub tabs Content-->
        <div class="custom-component-left-content">
            <div class="component-side-nav-tabs-container py-3">
                <ul class="nav flex-column">
                    <li class="nav-item" *ngFor="let role of roles">
                        <a class="nav-link" [ngClass]="{'selected-row': role === selectedRole}" (click)="onRoleClick(role)">
                            {{ role.name }}
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <div class="custom-setting-right-content p-3">
            <form [formGroup]="createAssigneeForm" autocomplete="off" (ngSubmit)="createAssignee(createAssigneeForm)" class="mb-4">
                <div class="d-flex align-items-center gap-2">
                    <div class="custom-p-select-content">
                        <p-select formControlName="selected_user" [options]="usersList" name="user" id="user"
                            optionLabel="fullName" placeholder="Please select user" class="w-100" [filter]="true" filterBy="fullName" 
                            [showClear]="true" filterPlaceholder="Search user">
                            <ng-template #selectedItem let-selectedOption>{{ selectedOption.fullName }}</ng-template>
                            <ng-template let-employee #item>{{ employee.fullName }}</ng-template>
                        </p-select>
                        <!-- <p-multiSelect formControlName="selected_user" [options]="usersList" name="user" id="user"
                            optionLabel="fullName" placeholder="Search User" field="selectedUser" class="w-100"
                            [selectedItemsLabel]="customLabelTemplate" (ngModelChange)="selectedUserDetails($event)">
                            <ng-template let-user pTemplate="item">
                                <div>{{ user.firstName }} {{ user.middleName }} {{ user.lastName }}</div>
                            </ng-template>
                        </p-multiSelect> -->
                    </div>
                    <div>
                        <button type="submit" class="custom-btn btn-primary py-2 px-4" [disabled]="createAssigneeForm.invalid">Add</button>
                    </div>
                </div>
            </form>
            
            <!--Table content-->
            <ng-container *ngIf="dataLoad; else maincontent">
                <ng-template #loadingSpinner>
                    <div class="custom-compoent-data-loader">
                        <app-data-loader-content />
                    </div>
                </ng-template>
                <ng-container *ngTemplateOutlet="loadingSpinner"></ng-container>
            </ng-container>

            <ng-template #maincontent>
                <div class="custom-table-content">
                    <table class="w-100">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            @if(roleAssigneeUsers.length > 0){
                                <tr *ngFor="let user of roleAssigneeUsers">
                                    <td>{{ user.firstName }}
                                        <span *ngIf="user.middleName"> {{ user.middleName }} </span>
                                        {{ user.lastName }}
                                    </td>
                                    <td (click)="onUserClick(user)"><img src="/settings-icon/trash-2.png" alt="edit icon"
                                            class="settings-common-icon">
                                    </td>
                                </tr>
                            }@else {
                                <tr>
                                    <td colspan="2">
                                        <app-no-data-found></app-no-data-found>
                                    </td>
                                </tr>
                            }
                         
                        </tbody>
                    </table>
                </div>
            </ng-template>
        </div>
    </div>
</div>

<ng-template #confirmationModal let-modal>
    <div class="modal-body" ngbAutofocus>
        <div class="custom-main-popup-container">
            <div class="custom-main-popup-content text-center p-5">
                <div class="py-5">
                    <p class="confirmation-text">Are you sure you want to Delete?</p>
                </div>
                <div class="d-flex gap-5 pt-4 w-100">
                    <button class="custom-btn btn-secondary w-50 py-3" (click)="close()">No</button>
                    <button class="custom-btn btn-primary w-50 py-3" (click)="removeAssignee()">yes</button>
                </div>
            </div>
        </div>
    </div>
</ng-template>

<ng-template #stagingLoadingModal let-modal>
    <div class="modal-body text-center p-5" ngbAutofocus>
        <div class="spinner-border text-primary" role="status"></div>
        <p class="heading4 pt-4">Loading...</p>
    </div>
</ng-template>
