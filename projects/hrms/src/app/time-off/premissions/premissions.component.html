<div class="custom-main-component-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <p class="component-header cursor mb-0">Permission</p>
        </div>
        <div class="d-flex gap-3">
            @if(rbac.allowedToAccess('Request Permission Button.view')){
            <button type="button" class="custom-btn btn-primary" (click)="openModal(addpremission)" >
            <i class="bi bi-plus me-2"></i>Request Permission</button>
        }
        </div>
    </div>

    <div class="employee-fields-main-container d-flex gap-3 w-100">
        <div class="custom-component-left-content">
            <app-premissions-tabs />
        </div>
        <div class="custom-setting-right-content p-3">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>

<ng-template #addpremission let-modal>
    <div class="custom-main-popup-container" ngbAutofocus>
        <div class="custom-poup-header-content popup-header-border">
            <div class="pt-2">
                <p class="popup-heading mb-0">Request Permission</p>
            </div>
            <div>
                <a (click)="modal.dismiss();this.permissionForm.reset()">
                    <img src="icons/close.png" alt="Close Icon" class="close-icon">
                </a>
            </div>
        </div>
        
        <div class="custom-main-popup-content">
            <form autocomplete="off" [formGroup]="permissionForm" (ngSubmit)="applyPermission(permissionForm)">
                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label for="Date" class="form-label custom-label mb-2">Date<span class="text-danger">*</span></label>
                        <input type="date" class="form-control custom-input" formControlName="permissionDate" id="Date"
                            onkeydown="return false" placeholder="Select Date" autocomplete="off"  [min]="getPastDate()" [max]="getFutureDate()" />
                        <div *ngIf="permissionForm.get('permissionDate')?.touched && permissionForm.get('permissionDate')?.invalid"
                            class="error-msg">
                            Permission Date is required.
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="duration" class="form-label custom-label mb-2">Duration<span class="text-danger">*</span></label>
                        <div class="custom-p-select-content">
                            <p-select [options]="duration" optionLabel="name" id="duration" formControlName="duration"
                                placeholder="Please select duration" class="form-select custom-select" />
                        </div>
                        <div *ngIf="permissionForm.get('duration')?.touched && permissionForm.get('duration')?.invalid" class="error-msg">
                            Duration is required.
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="leaveType" class="form-label custom-label mb-2">Permission Type<span class="text-danger">*</span></label>
                        <div class="custom-p-select-content">
                            <p-select [options]="leaveTypes" optionLabel="name" formControlName="leaveType"
                                placeholder="Please select permission type" id="leaveType" class="form-select custom-select" />
                        </div>
                        <div *ngIf="permissionForm.get('leaveType')?.touched && permissionForm.get('leaveType')?.invalid" class="error-msg">
                            Permission Type is required.
                        </div>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label for="reason" class="form-label custom-label mb-2">Reason<span class="text-danger">*</span></label>
                        <textarea class="form-control custom-input" formControlName="reason" id="reason" rows="3"
                            placeholder="Reason for permission" maxlength="250" (input)="formsValidation.validateInput(permissionForm.get('reason'))" ></textarea>
                            <div class="textarea-count-text">
                            {{ permissionForm.get('reason')?.value?.length || 0 }}/250
                        </div>
                        <div class="error-msg" *ngIf="permissionForm.get('reason')?.touched && permissionForm.get('reason')?.invalid">
                            <div *ngIf="permissionForm.get('reason')?.errors?.['required']">
                                Reason is required.
                            </div>
                            <div *ngIf="permissionForm.get('reason')?.errors?.['maxlength']">
                                Reason cannot exceed 250 characters.
                            </div>
                        </div>
                    </div>
                </div>

                <div class="custom-modal-footer">
                    <button type="reset" class="custom-btn btn-secondary" (click)="modal.dismiss();this.permissionForm.reset()">Close</button>
                    <button type="submit" class="custom-btn btn-primary" [disabled]="permissionForm.invalid || spinnerLoader">
                        @if(spinnerLoader){
                        <div class="button-loader-content">
                            <div class="spinner-border button-spinner text-light" role="status"></div>
                            <div>{{'Loading...'}}</div>
                        </div>
                        }@else {
                        <span>{{'Request'}}</span>
                        }
                    </button>
                </div>
            </form>
        </div>
    </div>
</ng-template>
