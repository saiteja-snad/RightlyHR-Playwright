<div class="custom-main-component-container">
  <div class="component-header-content">
    <div class="heading-content">
      <div class="component-header">Policies</div>
      <div>
        <img src="\icons\moduelicon.png" alt="Icon" placement="bottom" [ngbPopover]="popContent" class="module-icon">
      </div>
    </div>

    <div class="d-flex align-items-center gap-2">
      <label class="form-label custom-label m-0">Select Year</label>
      <form autocomplete="off" [formGroup]="policiesform" class="m-0">
        <div class="custom-p-select-content m-0">
          <p-select formControlName="selectedYear" [options]="years" class="custom-select w-100"></p-select>
        </div>
      </form>
    </div>
  </div>

  <!--Module Information-->
  <ng-template #popContent>
    <app-module-information [moduleInfo]="moduleinfo" />
  </ng-template>

  <div class="custom-table-content">
    @if (!loading) {
    <table class="w-100">
      <thead>
        <th>{{'Policy Name'|translate}}</th>
        <th>{{'Description'|translate}}</th>
        <th class="text-center">{{'Attachment'|translate}}</th>
        <th class="text-center">{{'Acknowledged' | translate}}</th>
      </thead>
      <tbody>
        <ng-container *ngIf="((orgPolicyItemsArray) ?? []).length > 0; else noDataTemplate">
          <tr *ngFor="let item of orgPolicyItemsArray">
            <td>{{item.policyName}}</td>
            <td>{{item.policyDescription}}</td>
            <td class="text-center">
              <a type="button" class="view-btn text-nowrap"
                (click)="onViewAttachement(item.policyAttachment,item.policyName,item)">
                <img src="/my-info-icons/View-Policy-icon.png" alt="Icon" class="view-icon">
              </a>
            </td>
            <td class="text-center acknowledge-content">
              <ng-container *ngIf="item.requiresAcknowledgment">
                <ng-container *ngIf="item.acknowledged; else showAcknowledge">
                 <span class="success-text">Yes</span>
                </ng-container>
                <ng-template #showAcknowledge>
                  <a class="acknowledge-btn" (click)="onViewAttachement(item.policyAttachment, item.policyName, item)">
                    <u>Acknowledge</u></a>
                </ng-template>
              </ng-container>
              <ng-container *ngIf="!item.requiresAcknowledgment">
                <span>N/A</span>
              </ng-container>
            </td>
          </tr>
        </ng-container>
        <!-- No Data Found Template -->
        <ng-template #noDataTemplate>
          <tr>
            <app-no-data-found />
          </tr>
        </ng-template>
      </tbody>
    </table>
    }
    @else {
    <app-data-loader-content />
    }
  </div>
</div>

<!--View Popup-->
<ng-template #viewattamchment let-modal>
  <div class="custom-main-popup-container">
    <div class="custom-poup-header-content popup-header-border">
      <div class="pt-2">
        <p class="popup-heading mb-0">{{viewPolicyname}}</p>
      </div>
      <div>
        <a (click)="modal.dismiss(); ExpenseViewURL = null; ExpenseImageUrl = null"><img src="icons/close.png"
            alt="Close Icon" class="close-icon"></a>
      </div>
    </div>

    <div class="custom-main-popup-content text-center">
      <div class="Image-content-view">
        <div *ngIf="!ExpenseImageUrl; else imageView">
          <ngx-doc-viewer [url]="ExpenseViewURL" viewer="google" style="width: 100%; height: 100vh"></ngx-doc-viewer>
        </div>
        <ng-template #imageView>
          <img [src]="ExpenseImageUrl" alt="My Image" class="modal-image" />
        </ng-template>
      </div>
      <!-- Acknowledge Footer -->
      <div class="modal-footer justify-content-between bg-white px-4 py-3 border-top"
        *ngIf="selectedItem?.requiresAcknowledgment && !selectedItem?.acknowledged">
        <form [formGroup]="ackForm" class="d-flex justify-content-between w-100 align-items-center">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="ackCheckbox" formControlName="acknowledged" />
            <label class="form-check-label" for="ackCheckbox">
              I acknowledge that I have read and agree to the policy.
            </label>
          </div>

          <button class="btn btn-primary" [disabled]="ackForm.invalid || loading"
            (click)="postacknowledgement(selectedItem)">
            <span *ngIf="!loading">Acknowledge</span>
            <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          </button>
        </form>
      </div>
    </div>
  </div>
</ng-template>
