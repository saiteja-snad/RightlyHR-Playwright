<div class="custom-main-component-container">
    <div class="card myinfo-content-card p-4">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <span class="myinfo-sub-header">Onboarding Details</span>
            </div>
            <div *ngIf="!buttons">
                <a (click)="showButtons()"><i class="bi bi-pencil-square"></i></a>
            </div>
            <div class="d-flex justify-content-end gap-3" *ngIf="buttons">
                <button type="reset" class="custom-btn btn-secondary" (click)="showButtons()">Close</button>
                <button type="submit" class="custom-btn btn-primary" (click)="showButtons()">Save</button>
            </div>
        </div>

        <!--input content-->
        <div class="myinfo-input-content">
            <form action="">
                <div class="row">
                    <div class="col-md-6 col-lg-4 mb-4">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Offer Sent Date<span class="text-danger">*</span></label>
                        <input type="date" class="form-control custom-input" id="exampleFormControlInput1" placeholder="Please enter offer sent date">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-4">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Offer Sent By<span class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1" placeholder="Please enter offer sent by">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-4">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Offer Sent Status<span class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1" placeholder="Please enter offer sent status">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-4">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Appointment Sent Date<span class="text-danger">*</span></label>
                        <input type="date" class="form-control custom-input" id="exampleFormControlInput1" placeholder="Please enter middle name">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-4">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Appointment Sent By<span
                                class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter appointment sent by">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Appointment Sent Status<span class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                        placeholder="Please enter appointment sent status">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-4">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Trainee Offer Sent Date<span
                                class="text-danger">*</span></label>
                        <input type="date" class="form-control custom-input" id="exampleFormControlInput1">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-4">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Trainee Offer Sent By<span
                                class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter trainee offer sent by">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-4">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Trainee Offer Sent Status<span
                                class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter trainee offer sent status">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Date Of Birth<span
                                class="text-danger">*</span></label>
                        <input type="date" class="form-control custom-input" id="exampleFormControlInput1">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Trainee Appointment Sent By <span
                                class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter trainee offer sent by">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Trainee Appointment Sent Status<span
                                class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter trainee appointment sent status">
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
