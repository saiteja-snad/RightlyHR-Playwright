<div class="header-main-container">
    <div class="d-flex justify-content-between ">
        <div>
            <div *ngIf="isActive('time-off')">
                <app-time-off-tabs></app-time-off-tabs>
            </div>
        </div>
        <div class="d-flex gap-5">
            <div class="dropdown cursor">
                <a class="custom-notification-btn position-relative" data-bs-toggle="dropdown">
                    <i class="bi bi-bell header-icon"></i>
                    <span class="position-absolute translate-middle badge rounded-pill bg-danger">99+</span>
                </a>
                <ul class="dropdown-menu custom-notification-menu p-4">
                    <!--No notification Data-->
                    <div class="">
                        <div class="d-flex justify-content-between notification-details-header mb-5">
                            <div>
                                <p class="mb-0"><i class="bi bi-dot me-1"></i>All</p>
                            </div>
                            <div>
                                <a><u>Clear All</u></a>
                            </div>
                        </div>
                        <div *ngFor="let event of events" class="d-flex gap-4 px-4 mb-4">
                            <!-- Circle Icon with Color -->
                            <div class="pt-3">
                                <i class="bi bi-circle-fill" [ngClass]="getEventClass(event.type)"></i>
                            </div>
                            <!-- Event Details -->
                            <div>
                                <p class="event-name mb-0">{{ event.name }}</p>
                                <p class="time mb-0">{{ event.time }}</p>
                            </div>
                        </div>
                    </div>

                    <!--No notification placeholder-->
                    <div class="no-notifications d-none">
                        <img src="images\no-notifications.png" alt="No notifications image" class="placeholder-img">
                    </div>
                </ul>
            </div>

            <div>
                <a class="cursor"><i class="bi bi-gear header-icon"></i></a>
            </div>

            <div class="dropdown">
                <a type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <img src="images\profile-img.png" alt="Profile Image" class="profile-img cursor">
                </a>
                <ul class="dropdown-menu custom-dropdown-menu">
                    <li><a class="dropdown-item" [routerLink]="['/admin/prospective-new-user']"
                            routerLinkActive="active"><i class="bi bi-envelope-plus me-2"></i>Invite New User</a>
                    </li>
                    <li><a class="dropdown-item" [routerLink]="['/admin/letters/bank-loan-letterr']"
                            routerLinkActive="active"><i class="bi bi-file-earmark-text-fill me-2"></i>View Profile</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
