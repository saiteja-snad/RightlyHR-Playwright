<div class="custom-main-component-container">
    <div class="component-header-content py-2">
        <!--header-->
        <div class="heading-content">
            <div class="commpoment-name" (click)="navigation()"> Reports<span class="ms-1">
                <i class="bi bi-chevron-double-right"></i></span></div>
            <div class="component-header">Monthly Attendance Report</div>
        </div>
    </div>

    <!--right data-->
    <div class="custom-component-right-content">
        <form autocomplete="off" [formGroup]="monthlyReportForm" (ngSubmit)="generateReport(monthlyReportForm)"
            class="custom-width">
            <div class="mb-3">
                <label class="form-label custom-label mb-2">{{ "Month" | translate }}<span
                        class="text-danger">*</span></label>
                <div class="custom-p-select-content">
                    <p-select [options]="months" optionLabel="name" filterBy="name" [filter]="true" [showClear]="false"
                        formControlName="month" placeholder="Please select month" class="form-select custom-select">
                        <ng-template #selectedItem let-selectedOption>{{ selectedOption.name }}</ng-template>
                        <ng-template let-location #item>{{ location.name }}</ng-template>
                    </p-select>
                </div>
            </div>
    
            <div class="mb-4">
                <label class="form-label custom-label mb-2">{{ "Year" | translate }}<span
                        class="text-danger">*</span></label>
                <div class="custom-p-select-content">
                    <p-select [options]="years" optionLabel="value" filterBy="value" [filter]="true" [showClear]="false"
                        formControlName="year" placeholder="Please select year" class="form-select custom-select">
                        <ng-template #selectedItem let-selectedOption>{{ selectedOption.value }}</ng-template>
                        <ng-template let-location #item>{{ location.value }}</ng-template>
                    </p-select>
                </div>
            </div>
    
            @if(rbac.allowedToAccess('Monthly Attendance Reports - Generate.view')){
            <div>
                <button type="submit" class="custom-btn btn-primary px-4"
                    [disabled]="monthlyReportForm.invalid || spinnerLoader">
                    <ng-container *ngIf="spinnerLoader; else addText">
                        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                        <span>{{'Loading...' | translate}}</span>
                    </ng-container>
                    <ng-template #addText>
                        <span>{{'Generate' | translate}}</span>
                    </ng-template>
                </button>
            </div>
            }
        </form>
    </div>
</div>
