<!-- add-kra/add-kra.component.html -->
<div class="custom-main-popup-container" ngbAutofocus>
  <div class="custom-poup-header-content popup-header-border">
    <div>
      <p class="popup-heading mb-0">Create KRA Category</p>
    </div>
    <div>
      <a (click)="openconfirmationModelforcancle(cancel, kraForm)">
        <img src="icons/close.png" alt="Close Icon" class="close-icon">
      </a>
    </div>
  </div>

  <div class="custom-main-popup-content">
    <form #kraForm="ngForm" (ngSubmit)="kraForm.valid && onSubmit()" autocomplete="off">
      <div class="row">
        <div class="col-md-6 mb-4">
          <label class="form-label custom-label">
            Category Name <span class="text-danger">*</span>
          </label>
          <input
            type="text"
            class="form-control custom-input"
            name="categoryName"
            [(ngModel)]="kra.categoryName"
            #categoryName="ngModel"
            required
            placeholder="Enter category name"
            (input)="onCategoryInput(categoryName)"
            >
          <div class="error-msg" *ngIf="categoryName.touched && categoryName.invalid">
            Category Name is required
          </div>
        </div>

        <div class="col-md-6 mb-4">
          <label class="form-label custom-label">
            Category Code <span class="text-danger">*</span>
          </label>
          <input
            type="text"
            class="form-control custom-input"
            name="categoryCode"
            [(ngModel)]="kra.categoryCode"
            #categoryCode="ngModel"
            required
            placeholder="Enter category code"
            (input)="onCategoryInput(categoryCode)"
            >
          <div class="error-msg" *ngIf="categoryCode.touched && categoryCode.invalid">
            Category Code is required
          </div>
        </div>

<div class="col-12 mb-4">
  <label class="form-label custom-label mb-2">
    Description <span class="text-danger">*</span>
  </label>

  <textarea
    class="form-control custom-input"
    rows="4"
    name="description"
    [(ngModel)]="kra.description"
    #description="ngModel"
    required
    minlength="10"
    maxlength="500"
    placeholder="Enter Description"
    (input)="onCategoryInput(description)"
    >
  </textarea>

  <!-- Character Count -->
  <div class="textarea-count-text text-end">
    {{ kra.description?.length || 0 }}/500
  </div>

  <!-- Error Message -->
  <div class="error-msg" *ngIf="description.touched && description.invalid">
    Description is required (minimum 10 characters)
  </div>
</div>

      </div>

      <div class="custom-modal-footer">
        <button type="button" class="custom-btn btn-secondary" (click)="openconfirmationModelforcancle(cancel, kraForm)">
          Cancel
        </button>
        <button
          type="submit"
          class="custom-btn btn-primary"
          [disabled]="kraForm.invalid || isLoading">
          @if(!isLoading) {
            Save
          } @else {
            <span class="spinner-border spinner-border-sm me-2"></span> Saving...
          }
        </button>
      </div>
    </form>
  </div>
</div>


<ng-template #cancel let-modal>
  <div class="result-popup-content" ngbAutofocus>
    <div>
      <img src="icons/reject.png" alt="failure icon" class="confirmation-delete-icon">
      <p class="confirmation-text">Are you sure you want to cancel?</p>
    </div>
    <div class="custom-modal-footer">
      <button type="button" class="custom-btn btn-secondary" (click)="modal.dismiss()">No</button>
      <button type="submit" class="custom-btn btn-primary" (click)="closeModal()">Yes</button>
    </div>
  </div>
</ng-template>
