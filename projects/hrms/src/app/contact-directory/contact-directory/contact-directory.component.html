<div class="custom-main-component-container">
    <div class="component-header-content pt-2">
        <div class="heading-content">
            <div class="component-header"> Contacts Directory </div>
        </div>
    </div>

    <div class="custom-card p-2 mb-3"  >
        <div>
            <p class="header">{{contactData[0]?.departmentName }}</p>
        </div>
        <div class="cards-container" *ngFor="let item of contactData">
            <div class="phone-book-cards">
                <div class="d-flex gap-2 p-2">
                    <div class="d-flex justify-content-center align-items-center">
                        <img src="images/alternate.png" alt="profile" class="profile-icon">
                    </div>
                    <div>
                        <p class="name pt-2 mb-2">{{item.name}}</p>
                        <p class="label-text mb-2"> <span class="bi bi-envelope me-1"></span> {{item.emailid}}</p>
                        <p class="label-text m-0"> <span class="bi bi-telephone me-1"></span> {{item.contactNumber}}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
