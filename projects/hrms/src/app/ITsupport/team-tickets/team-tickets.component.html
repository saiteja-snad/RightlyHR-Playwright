<div class="custom-main-component-container">
    <div class="component-header-content py-2">
        <div class="heading-content">
            <div class="commpoment-name">IT Support<span class="ms-1"><i class="bi bi-chevron-double-right"></i></span>
            </div>
            <div class="component-header">Team Tickets</div>
            <div>
                <img src="\icons\moduelicon.png" alt="Icon" placement="bottom" [ngbPopover]="popContent"
                    class="module-icon">
            </div>
        </div>
    </div>

    <!--Module Information-->
    <ng-template #popContent>
        <app-module-information [moduleInfo]="moduleinfo" />
    </ng-template>

    <div class="mb-3">
        <app-itsuporrt-header-tabs />
    </div>

    <div class="d-flex gap-3 w-100">
        <!--sub module tabs-->
        <div class="component-left-tabs-container">
            <app-itsupport-compoment-tabs></app-itsupport-compoment-tabs>
        </div>

        <div class="component-right-content">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
