<div class="custom-main-component-container">
    <form [formGroup]="consultancyForm" (ngSubmit)="addConsoltancy()" *ngIf="rbac.allowedToAccess('Consultancy.create')">
        <!-- Add Input-->
        <div class="mb-4">
            <div class="custom-settings-add-input input-group">
                <input type="text" class="form-control custom-input" placeholder="Please enter consultancy"
                    formControlName="jobConsultancyName" aria-label="Consultancy" aria-describedby="Consoltancy"
                    (keydown)="formValidations.restrictInput($event); formValidations.blockNonAlphabets($event)">
                <span class="input-group-text" id="Consoltancy">
                    <button type="submit" class="custom-btn btn-primary" [disabled]="consultancyForm.invalid">{{'Add'|translate}}</button>
                </span>
            </div>
            <div *ngIf="consultancyForm.get('jobConsultancyName')?.touched && consultancyForm.get('jobConsultancyName')?.invalid"
                class="error-msg">
                <div *ngIf="consultancyForm.get('jobConsultancyName')?.errors?.['required']">{{'Consultancy name required'|translate}}</div>
            </div>
        </div>
    </form>

    <!--Data Content-->
    <div class="custom-settings-data-table">
        <table class="w-100">
            <thead>
                <tr>
                    <th class="col-span-2"></th>
                </tr>
            </thead>
            <tbody>
                @if(rbac.allowedToAccess('Consultancy.view')) {
                @for (cos of consultancyDetail; track $index) {
                <tr>
                    <td class="w-75">{{ cos.consultancyName}}</td>
                    <td class="w-25">
                        <div class="d-flex gap-4">
                            <!--Update-->
                            <div>
                                <a (click)="openupdate(cos)" *ngIf="rbac.allowedToAccess('Consultancy.update')">
                                    <img src="/settings-icon/edit.png" alt="edit icon" class="settings-common-icon">
                                </a>
                            </div>
                            <!--Delete-->
                            <div>
                                <a (click)="opendelete(cos)" *ngIf="rbac.allowedToAccess('Consultancy.delete')">
                                    <img src="/settings-icon/trash-2.png" alt="edit icon" class="settings-common-icon">
                                </a>
                            </div>
                        </div>
                    </td>
                </tr>
                }
                }
            </tbody>
        </table>
    </div>
</div>

<!--Update popup-->
<ng-template #updatepopup let-modal>
    <form [formGroup]="updateForm">
        <div class="custom-main-popup-container" ngbAutofocus>
            <div class="custom-poup-header-content popup-header-border">
                <div>
                    <p class="popup-heading mb-0">{{'Edit Consultancy'|translate}}</p>
                </div>
                <div>
                    <a (click)="close(modal)"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
                </div>
            </div>
            <div class="custom-main-popup-content">
                <div class="mb-4">
                    <label for="exampleFormControlInput1" class="form-label custom-label mb-2">
                        {{'Consultancy Name'|translate}}<span class="error-msg">*</span></label>
                    <input type="text" class="form-control custom-input" formControlName="jobConsultancyName"
                        placeholder="Please enter Consultancy" (keydown)="formValidations.restrictInput($event); 
                        formValidations.blockNonAlphabets($event)">
                    <div *ngIf="updateForm.get('jobConsultancyName')?.touched && updateForm.get('jobConsultancyName')?.invalid"
                        class="error-msg">
                        <div *ngIf="updateForm.get('jobConsultancyName')?.errors?.['required']">{{'Consultancy name is  required'|translate}}</div>
                    </div>
                </div>
                <div class="custom-modal-footer">
                    <button type="button" class="custom-btn btn-secondary" (click)="close(modal)">{{'Close'|translate}}</button>
                    <button type="button" class="custom-btn btn-secondary" (click)="updateLocation(modal)" 
                    [disabled]="updateForm.invalid">{{'Update'|translate}}</button>
                </div>
            </div>
        </div>
    </form>
</ng-template>

<!--Delete Confirmation popup-->
<ng-template #deletepopup let-modal>
    <div class="result-popup-content" ngbAutofocus>
        <div>
            <img src="/icons/delete-icon.png" alt="delete-icon" class="confirmation-delete-icon">
            <p class="confirmation-text">{{'Are you sure you want to Delete?'|translate}}</p>
        </div>
        <div class="custom-modal-footer">
            <button type="button" class="custom-btn btn-secondary" (click)="closeDelete(modal)">{{'No'|translate}}</button>
            <button type="button" class="custom-btn btn-primary" (click)="onDelete(modal)">{{'Yes'|translate}}</button>
        </div>
    </div>
</ng-template>
