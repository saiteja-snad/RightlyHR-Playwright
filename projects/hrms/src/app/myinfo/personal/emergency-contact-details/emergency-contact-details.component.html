<div class="custom-main-component-container">
    <div class="card emergency-contact-content-card p-4 mb-4">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <span class="emergency-contact-sub-header">Emergency Contact 1</span>
            </div>
            <div *ngIf="!buttons">
                <a (click)="showButtons()"><i class="bi bi-pencil-square"></i></a>
            </div>
            <div class="d-flex justify-content-end gap-3" *ngIf="buttons">
                <button type="reset" class="custom-btn btn-secondary" (click)="showButtons()">Close</button>
                <button type="submit" class="custom-btn btn-primary" (click)="showButtons()">Save</button>
            </div>
        </div>

        <!--input content-->
        <div class="myinfo-input-content">
            <form action="">
                <div class="row">
                    <div class="col-md-6 col-lg-4 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Name<span
                                class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter name ">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Email ID <span
                                class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter email ">

                    </div>
                    <div class="col-md-6 col-lg-4 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Phone Number <span
                                class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter phone number ">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Relationship<span
                                class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter relationship">
                    </div>
                </div>
            </form>
        </div>
    </div>
