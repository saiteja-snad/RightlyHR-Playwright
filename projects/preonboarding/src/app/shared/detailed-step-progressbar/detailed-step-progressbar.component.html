<div *ngIf="prosempdata.substatus.toLowerCase()=='offer letter generated'|| prosempdata.substatus.toLowerCase()=='offer letter released' ||prosempdata.substatus.toLowerCase() =='offer letter regenerated'|| this.prosempdata.substatus.toLowerCase()=='offer letter accepted'  ">
    <div class="progress-bar">
        <div class="step" *ngFor="let step of steps; let i = index">
            <div class="bullet" [ngClass]="{'active': currentStep >= i + 1}">
                <span>{{ i + 1 }}</span>
            </div>
            <p [ngClass]="{'active': currentStep >= i + 1}">{{ step.name }}</p>
        </div>
    </div>
</div>

<div *ngIf="prosempdata.substatus=='Requested Documents' ||prosempdata.substatus=='Documents Submitted' ||
    this.prosempdata.substatus=='Documents Rejected' ||this.prosempdata.substatus=='Documents Verified'|| this.prosempdata.substatus=='Documents Accepted' ">
    <div class="progress-bar2">
        <div class="step2" *ngFor="let step of step2; let i = index">
            <div class="bullet2" [ngClass]="{'activee': currentStepp >= i + 1}">
                <span>{{ i + 1 }}</span>
            </div>
            <p [ngClass]="{'activee': currentStepp >= i + 1}">{{ step.name }}</p>
        </div>
    </div>
</div>
