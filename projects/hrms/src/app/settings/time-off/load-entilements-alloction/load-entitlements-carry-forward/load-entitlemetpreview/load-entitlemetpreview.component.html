<div>
    <div class="d-flex gap-2 mb-2 justify-content-end ">
        <div><img src="images/upload-leave-documents.png" class="leave-icon"></div>
        <div class="map-text"><u>Export as CSV</u></div>
    </div>

    <div class="custom-table-content w-100">
        <table class="w-100">

            <thead>
                <tr>
                    <th>Employee</th>
                    <th *ngFor="let type of leaveTypes">{{type}}</th>
                    <th>View</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let row of employeesList">
                    <td><a class="project-name cursor" (click)="openLeaveDetails(row,viewmodal)">{{
                            row.employee }}</a></td>
                    <td *ngFor="let type of leaveTypes">
                        {{ row[type] ?? 0 }}
                    </td>

                </tr>
            </tbody>
        </table>
    </div>
    <div class="footer-content">
        <div class="d-flex justify-content-end align-items-center gap-3">
            <button type="button" class="custom-btn btn-secondary" (click)="navigationtoback()">Back</button>
            <button type="submit" class="custom-btn btn-primary" (click)="navigationtomapcategory()">Proceed to
                Mapping</button>
        </div>
    </div>
</div>



<ng-template #viewmodal let-modal>
    <div class="custom-main-popup-container" ngbAutofocus>
        <div class="custom-poup-header-content popup-header-border">
            <div>
                <p class="popup-heading mb-0">View Data
                </p>
            </div>
            <div>
                <a (click)="modal.dismiss()"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
            </div>
        </div>
        <div class="custom-main-popup-content">
            <div class="popup-table-wrapper">
                <div class="popup-table-scroll-container">
                    <table class="popup-table">
                        <thead>
                            <tr>
                                <th>Leave Type</th>
                                <th>Entitled</th>
                                <th>Availed</th>
                                <th>Balance</th>
                                <th>Max CF</th>
                                <th>Actual CF</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let l of selectedEmployeeDetail">
                                <td>{{l.leaveType}}</td>
                                <td>{{l.entitled}}</td>
                                <td>{{l.availed}}</td>
                                <td>{{l.balance}}</td>
                                <td>{{l.maxCarryForward}}</td>
                                <td>{{l.actualCarryForward}}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</ng-template>
