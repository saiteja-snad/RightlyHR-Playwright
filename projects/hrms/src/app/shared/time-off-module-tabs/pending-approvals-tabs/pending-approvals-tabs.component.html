<div class="custom-sub-tabs-container">
  <ul class="nav flex-column">
    <li class="nav-item" *ngFor="let tab of navLinks">
      <div class="nav-link" (click)="navigateToAccessedRoute(tab.route)"
        [class.active-nav-link]="isActiveRoute(tab.route)">
        <img [src]="tab.icon" alt="Icon" class="icon mb-2">
        <div class="d-flex gap-1">
          {{ tab.label }}
          <!-- @if(tab.count && tab.count > 0) {({{ tab.count }})}
          @else if(tab.label=='No Due Clearance Requests'){({{nodue_Request_data.length}})}
          @else {(0)} -->
        </div>
      </div>
      <div class="tabs-border-bottom"></div>
    </li>
  </ul>
</div>
