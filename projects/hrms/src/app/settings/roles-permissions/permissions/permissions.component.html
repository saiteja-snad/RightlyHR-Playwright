<div class="mb-4">
    <div class="breadCrum px-2">
        <span>Role Permissions</span>
    </div>
</div>

<div class="d-flex w-100 mb-3">
    <div>
        <p class="pt-2">Select Role</p>
    </div>
    <div class="custom-search-dropdown">
        <p-select [options]="roles" optionLabel="name" [filter]="true" filterBy="name" [showClear]="false"
        (onChange)="onRoleSelect($event)"  placeholder="Please select role">
            <ng-template #selectedItem let-selectedOption>{{ selectedOption.name }}</ng-template>
            <ng-template let-dispatcher #item>{{ dispatcher.name }}</ng-template>
        </p-select>
    </div>
</div>

<form #roleForm="ngForm" (ngSubmit)="roleForm.valid && permissionsCreate()">
    <div>
        <table>
            <thead>
                <th>Sections</th>
                <th class="text-center">View</th>
                <th class="text-center">Update</th>
                <th class="text-center">Create</th>
                <th class="text-center">Delete</th>
            </thead>

            <tbody>
                <tr>
                    <th colspan="5" style="padding: 10px;border-top: 5px solid #ffff;">My Info</th>
                </tr>
                <ng-container *ngFor="let per of permissions">
                    <tr class="text-align-center"
                        *ngIf="per.fields === 'Current Address' || per.fields === 'Basic Information' || per.fields === 'Permanent Address' || per.fields === 'Contact Details' || per.fields === 'Emergency Contact Details'|| per.fields === 'Onboarding Documents'|| per.fields === 'Education'|| per.fields === 'Visa Information'|| per.fields === 'Family Details'|| per.fields === 'Experience Details'|| per.fields === 'Experience Details'
                || per.fields === 'Identity'|| per.fields === 'Pre Onboarding Details'|| per.fields === 'Onboarding Details'|| per.fields === 'Offboarding Details'|| per.fields === 'Employment Type'|| per.fields === 'Job Details'|| per.fields === 'Compensation Details'|| per.fields === 'Assets'|| per.fields === 'Certification Details'|| per.fields === 'Bank Details' || per.fields === 'Team Members' || per.fields === 'Separation Request' || per.fields === 'Onboard Request'  || per.fields === 'No Due Clearance' || per.fields === 'Change RM button'">
                        <td class="text-align-center">{{ per.fields }}</td>
                        <td scope="row">
                            <input type="checkbox" [(ngModel)]="per.View" name="{{ per.fields }}.view"
                                (change)="onCheckboxChange(per, 'View')">
                        </td>
                        <td scope="row">
                            <input type="checkbox" [(ngModel)]="per.Update" name="{{ per.fields }}.update"
                                (change)="onCheckboxChange(per, 'Update')">
                        </td>
                        <td scope="row">
                            <input type="checkbox" [(ngModel)]="per.Create" name="{{ per.fields }}.create"
                                (change)="onCheckboxChange(per, 'Create')">
                        </td>
                        <td scope="row">
                            <input type="checkbox" [(ngModel)]="per.Delete" name="{{ per.fields }}.delete"
                                (change)="onCheckboxChange(per, 'Delete')">
                        </td>
                    </tr>
                </ng-container>

                <tr>
                    <th colspan="5" style="padding: 10px;border-top: 5px solid #ffff;">Employee Info</th>
                </tr>
                <ng-container *ngFor="let per of permissions">
                    <tr class="text-align-center"
                        *ngIf="per.fields === 'Employee Current Address' || per.fields === 'Employee Basic Information' || per.fields === 'Employee Permanent Address' 
                || per.fields === 'Employee Contact Details' || per.fields === 'Employee Emergency Contact Details'
                || per.fields === 'Employee Onboarding Documents'|| per.fields === 'Employee Education'|| per.fields === 'Employee Visa Information'
                || per.fields === 'Employee Family Details'|| per.fields === 'Employee Experience Details'
                || per.fields === 'Employee Experience Details'|| per.fields === 'Employee Onboarding Request'|| per.fields === 'Employee Separation Request'
                || per.fields === 'Employee Identity'|| per.fields === 'Employee Pre Onboarding Details'|| per.fields === 'Employee Onboarding Details'
                || per.fields === 'Employee Offboarding Details'||
                 per.fields === 'Employee Employment Type'|| per.fields === 'Employee Job Details'|| per.fields === 'Employee Compensation Details'
                 || per.fields === 'Employee Assets'|| per.fields === 'Employee Certification Details'|| per.fields === 'Employee Bank Details'|| per.fields === 'Employee Team Members' 
                 || per.fields === 'Addsubfloder'|| per.fields === 'Employee Trainee Details' || per.fields === 'Last Working Day' 
                  || per.fields === 'Employee No Due Request' || per.fields === 'Probation Details' || per.fields === 'Employee Change RM button'">
                        <td class="text-align-center">{{ per.fields }}</td>
                        <td scope="row">
                            <input type="checkbox" [(ngModel)]="per.View" name="{{ per.fields }}.view"
                                (change)="onCheckboxChange(per, 'View')">
                        </td>
                        <td scope="row">
                            <input type="checkbox" [(ngModel)]="per.Update" name="{{ per.fields }}.update"
                                (change)="onCheckboxChange(per, 'Update')">
                        </td>
                        <td scope="row">
                            <input type="checkbox" [(ngModel)]="per.Create" name="{{ per.fields }}.create"
                                (change)="onCheckboxChange(per, 'Create')">
                        </td>
                        <td scope="row">
                            <input type="checkbox" [(ngModel)]="per.Delete" name="{{ per.fields }}.delete"
                                (change)="onCheckboxChange(per, 'Delete')">
                        </td>
                    </tr>
                </ng-container>
            </tbody>
        </table>
    </div>
    <div class="d-flex justify-content-end p-3">
        <div>
            <button class="main-custom-btn custom-btn-primary py-2 px-4"
                >Save</button>
        </div>
    </div>
</form>

<ng-template #stagingLoadingModal let-modal>
    <div class="modal-body text-center p-5" ngbAutofocus>
        <div class="spinner-border text-primary" role="status"></div>
        <p class="heading4 pt-4">Update in progress...</p>
    </div>
</ng-template>
