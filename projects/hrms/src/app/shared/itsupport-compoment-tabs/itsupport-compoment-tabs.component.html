<div class="custom-sub-tabs-container">
    <ul class="nav flex-column">
        <li class="nav-item" *ngFor="let tab of navTabs">
            <div class="nav-link" [routerLink]="[tab.link]" routerLinkActive="active-nav-link">
                <img [src]="tab.icon" alt="Icon" class="icon mb-2">
                <div class="d-flex gap-1">{{ tab.label }} ({{ tab.count}})</div>
            </div>
            <div class="border-bottom"></div>
        </li>
    </ul>
</div>
