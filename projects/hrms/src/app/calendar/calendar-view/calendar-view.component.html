<div class="custom-main-component-container">
  <div class="component-header-content pt-2">
    <div class="heading-content">
      <div class="component-header">Calendar</div>
      <div>
        <img src="\icons\moduelicon.png" alt="Icon" placement="bottom" [ngbPopover]="popContent" class="module-icon">
      </div>
    </div>
  </div>

  <!--Module Information-->
  <ng-template #popContent>
    <app-module-information [moduleInfo]="moduleinfo" />
  </ng-template>
  
  <!--Content-->
  <div class="d-flex gap-3 w-100">
    <!--sub tabs Content-->
    <div class="custom-component-left-content">
      <div class="d-flex align-items-center mb-2">
        <div class="box WFH" [ngStyle]="{'background-color':  '#E1E8FE'}"></div>
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="showBirthdays" [(ngModel)]="showBirthdays"
            (change)="filterEventsByTitle()">
          <label class="form-check-label" for="showBirthdays">
            <img src="calendar/birthday.png" alt="Birthday Image" class="custom-event-icon me-1">{{ 'Birthdays' |
            translate}}
          </label>
        </div>
      </div>

      <div class="d-flex align-items-center mb-2">
        <div class="box WFH" [ngStyle]="{'background-color':  '#FEE7E1'}"></div>
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="showAnniversaries" [(ngModel)]="showAnniversaries"
            (change)="filterEventsByTitle()">
          <label class="form-check-label" for="showAnniversaries"><img src="calendar/milestone.png"
              alt="Mile Stone Icon" class="custom-event-icon me-1">{{ 'Anniversaries' | translate}}</label>
        </div>
      </div>

      <div class="d-flex align-items-center mb-2">
        <div class="box WFH" [ngStyle]="{'background-color':  '#FEE1F7'}"></div>
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="showJoinees" [(ngModel)]="showJoinees"
            (change)="filterEventsByTitle()">
          <label class="form-check-label" for="showJoinees"><img src="calendar/new-joinees.png" alt="New Joinee icon"
              class="custom-event-icon me-1">{{ 'New Joinees' | translate }}</label>
        </div>
      </div>

      <div class="d-flex align-items-center mb-2">
        <div class="box WFH" [ngStyle]="{'background-color':  '#E1FEF4'}"></div>
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="showHolidays" [(ngModel)]="showHolidays"
            (change)="filterEventsByTitle()">
          <label class="form-check-label" for="showHolidays"><img src="calendar/holidays.png" alt="Mile Stone Icon"
              class="custom-event-icon me-1">{{ 'Holidays' | translate }}</label>
        </div>
      </div>
    </div>

    <div class="calender-content">
      <full-calendar [options]="calendarOptions" [events]="eventsPromise | async">
        <ng-template #eventContent let-arg>
          <!-- <b *ngIf="arg.timeText" >{{ arg.timeText }}</b> -->
          <div class="event-title m-0">{{ arg.event.title }}
            <img [src]="arg.event.display" alt="arg" class="ms-2">
          </div>
        </ng-template>
      </full-calendar>
    </div>
  </div>
</div>
