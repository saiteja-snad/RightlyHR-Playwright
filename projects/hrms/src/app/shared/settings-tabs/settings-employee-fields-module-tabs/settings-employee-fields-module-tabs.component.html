<div class="cards-grid-container">
    <div *ngFor="let tab of navTabs;">
        <div class="settings-sub-tabs-card" (click)="navigateToAccessedRoute(tab.link)">
            <div class="sub-tabs-header">
                <img [src]="tab.icon" alt="Icon" class="icon">
                <div class="label-name">{{ tab.label }}</div>
            </div>
            <div class="subject-text">{{tab.subjectText}}</div>
        </div>
    </div>
</div>
