<div class="custom-letter-tabs">
    <ul *ngFor="let tab of navTabs" class="tabs-list-content">
        <li [routerLink]="tab.link" class="list-item">
            <div class="d-flex align-items-center gap-2 mb-3">
                <img [src]="tab.icon" alt="Icon" class="icon">
                <div class="label-name">{{ tab.label }}</div>
            </div>
            <p class="subject-text m-0">{{tab.subject}}</p>
        </li>
    </ul>
</div>
