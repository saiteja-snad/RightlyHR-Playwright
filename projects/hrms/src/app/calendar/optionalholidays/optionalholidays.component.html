<div class="custom-main-component-container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <p class="component-header cursor mb-0">Holidays</p>
    </div>

    <div class="d-flex gap-2 align-items-center">
      <label   class="form-label custom-label mt-2"for="">Select year:</label>
        <form [formGroup]="optionalholidaysform">
         
          <div  class="custom-p-select-content">
            <p-select
            formControlName="selectedYear"
            [options]="years" placeholder="Select Year"
            class="form-select custom-select"
            (onChange)="onYearChange()"  >
          </p-select>
          </div>
          
        </form>
    
    </div>
  </div>

  <div class="mb-3">
    <app-holiday-tabs />
  </div>

  <div>
    <div class="card holiday-card mb-3">
      <ng-container
        *ngIf="orgHolidayItemsArrayTrue.length > 0 ; else noDataTemplate"
      >
        <div
          *ngFor="let item of orgHolidayItemsArrayTrue"
          class="card holiday-card mb-3"
        >
          <div class="d-flex gap-3 align-items-center">
            <div class="card holiday-icon-card">
              <img
                src="icons\holidays-icon.png"
                alt="Event Icon"
                class="holiday-icon"
              />
            </div>
            <div>
              
              <p class="holiday-name mb-0">{{ item.holidayName }}</p>
              <p class="date mb-0">{{ item.holidayDate | date: 'EEEE, dd MMMM' }}</p>
            </div>
          </div>
        </div>
      </ng-container>

      <ng-template #noDataTemplate>
        <div class="no-data-wrapper">
            <app-no-data-found></app-no-data-found>
        </div>
      </ng-template>
    </div>
  </div>
</div>
