<div class="custom-main-component-container">
    <div class="component-header-content pt-2">
        <div class="heading-content">
            <div class="component-header"> Contacts Directory </div>
            <!-- <div>
                <img src="\icons\moduelicon.png" alt="Icon" placement="bottom" [ngbPopover]="popContent"
                    class="module-icon">
            </div> -->
        </div>


    </div>

    <div class="custom-card p-2 mb-3" *ngFor="let item of contactData">
        <div>
            <p class="header">{{item.departmentName}}</p>
        </div>
        <div class="cards-container  ">
            <div class="phone-book-cards">
                <div class="d-flex gap-2 p-2">
                    <div class="d-flex justify-content-center align-items-center">
                        <img src="images/alternate.png" alt="profile" class="profile-icon">
                    </div>
                    <div>
                        <p class="name pt-2 mb-2">{{item.name}}

                        </p>
                        <p class="label-text mb-2"> <span class="bi bi-envelope  me-1"></span> {{item.emailid}}

                        </p>
                        <p class="label-text m-0"> <span class="bi bi-telephone me-1"></span> {{item.contactNumber}}
                        </p>

                    </div>
                </div>

            </div>
        </div>



    </div>

    <div class="custom-card p-2 mb-3">
        <div>
            <p class="header">IT Support</p>
        </div>

                    </div>
                    <div>
                        <p class="name pt-2 mb-2">Srisharanya Mandaloji

                        </p>
                        <p class="label-text mb-2"> <span class="bi bi-envelope  me-1"></span> ssuuuucccuuharanya.com

                        </p>
                        <p class="label-text m-0"> <span class="bi bi-telephone me-1"></span> 99998888888
                        </p>

                    </div>
                </div>

            </div>
        </div>



    </div>

                    <div class="d-flex justify-content-center align-items-center">
                        <img src="images/alternate.png" alt="profile" class="profile-icon">
                    </div>
                    <div>
                        <p class="name pt-2 mb-2">Srisharanya Mandaloji
