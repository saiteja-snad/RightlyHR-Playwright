<div class="custom-main-component-container">
    <div class="main-content-heading my-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <span>Experience Details</span>
            </div>
            <div>
                <button class="custom-btn btn-primary px-5" (click)="openEducation()">Add</button>
            </div>
        </div>
    </div>

    <!--Education place holder-->
    <div class="placeholder-container" *ngIf="placeHolder">
       <div>
          <div>
            <img src="/images/education-placeholder.png" alt="placeholder Image" class="place-holder-image mb-4">
            <p class="placeholder-text mb-5">Please provide education details</p>
            <button class="custom-btn btn-primary px-5" (click)="openEducation()">Add</button>
          </div>
       </div>
    </div>

    <div class="custom-main-sub-content">
        <div class="custom-table-content">
            <table class="w-100">
                <thead>
                    <tr>
                        <th>Education</th>
                        <th>University</th>
                        <th>Specialization</th>
                        <th>From Date</th>
                        <th>To Date</th>
                        <th>GPA</th>
                        <th>Attachment</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>SSc</td>
                        <td>-</td>
                        <td>-</td>
                        <td>-</td>
                        <td>-</td>
                        <td>-</td>
                        <td>-</td>
                        <td>
                            <div class="dropdown">
                                <a data-bs-toggle="dropdown" aria-expanded="false">
                                    <i class="bi bi-three-dots-vertical"></i>
                                </a>
                                <ul class="dropdown-menu custom-dropdown-menu">
                                    <li><a class="dropdown-item"><i class="bi bi-pencil me-2"></i>Update</a></li>
                                    <li><a class="dropdown-item"><i class="bi bi-trash3 me-2"></i>Delete</a></li>
                                </ul>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="footer-btn-content d-flex justify-content-end gap-3 pt-5">
        <button class="custom-btn btn-primary px-5">Next</button>
    </div>
</div>
