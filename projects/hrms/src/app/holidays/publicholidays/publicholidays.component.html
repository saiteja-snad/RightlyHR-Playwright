<div class="custom-main-component-container  ">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <p class="component-header cursor mb-0"><i class="bi bi-arrow-90deg-left me-2"></i> Holidays</p>
    </div>
  </div>


  <div class="d-flex align-items-center ms-2">
    <span class="me-2">Select year:</span>
    <form [formGroup]="holidaysform" class="m-0">
      <select formControlName="selectedYear" class="form-select form-select-sm" style="width: auto;"
        (change)="getHoliday(jobshiftdetails)" aria-label="Default select example">
        <option *ngFor="let year of years" [value]="year">{{ year }}</option>
      </select>
    </form>
  </div>


  <div class="component-nav-tabs-container card px-2 mb-3 mt-2">
    <p-tabs value="0" scrollable>
      <p-tablist>
        <ng-container *ngFor="let tab of navTabs;">
          <p-tab [value]="tab.link">
            <a [routerLink]="tab.link" routerLinkActive="nav-tab-active" class="nav-link">
              {{ tab.label }}
            </a>
          </p-tab>
        </ng-container>
      </p-tablist>
    </p-tabs>
  </div>
 <!--content-->
 <div class="custom-events-main-content">
  <!--Todays Events-->
  <div class="card events-section-card mb-4">
      <div class="my-4">
          <p class="component-header cursor mb-0">Today's Events</p>
      </div>
      <div class="row gap-4">
          <div class="col">
              <div class="card event-card">
                  <div class="d-flex justify-content-between">
                      <div class="d-flex gap-3 align-items-center">
                          <div class="card event-icon-card">
                              <img src="icons\event-icon.png" alt="Event Icon" class="event-icon">
                          </div>
                          <div>
                              <p class="event-name mb-0">Tech Treck</p>
                              <p class="date mb-0">08-Jan-2025</p>
                          </div>
                      </div>
                      <div class="dropdown">
                          <a data-bs-toggle="dropdown" aria-expanded="false">
                              <i class="bi bi-three-dots-vertical"></i>
                          </a>
                          <ul class="dropdown-menu custom-dropdown-menu">
                              <li><a class="dropdown-item"><i class="bi bi-pencil me-2"></i>Update</a></li>
                              <li><a class="dropdown-item"><i class="bi bi-trash3 me-2"></i>Delete</a></li>
                          </ul>
                      </div>
                  </div>
                  <div class="mt-3">
                      <p class="event-content-text mb-3">“Lorem Ipsum is simply dummy text of the printing and
                          typesetting industry Standards.”</p>
                  </div>
                  <hr class="vr-line m-0">
                  <div class="pt-3">
                      <img src="images\event-image.png" alt="Event Image" class="event-image w-100">
                  </div>
              </div>
          </div>
      </div>
  </div>
