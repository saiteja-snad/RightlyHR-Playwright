<div class="custom-table-content">
    <table class="w-100">
      <thead>
        <tr>
          <th *ngFor="let col of [1,2,3,4,5,6]">
            <p-skeleton width="6rem" height="1.5rem"></p-skeleton>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of [1,2,3,4,5,6,7]">
          <td *ngFor="let col of [1,2,3,4,5,6]">
            <p-skeleton width="100%" height="1.2rem"></p-skeleton>
          </td>
        </tr>
      </tbody>
    </table>
</div>
