<div class="custom-main-component-container d-flex w-100 gap-3">
  <div class="component-left-tabs-container">
    <app-holiday-tabs />
  </div>

  <div class="holidays-content">
    <ng-container *ngIf="loading; else maincontent">
      <ng-template #loadingSpinner>
        <div class="loader-placeholder-content text-center">
          <div>
            <app-data-loader-content />
          </div>
        </div>
      </ng-template>
      <ng-container *ngTemplateOutlet="loadingSpinner"></ng-container>
    </ng-container>

    <ng-template #maincontent>
      <ng-container *ngIf="orgHolidayItemsArrayFalse.length > 0 ; else noDataTemplate">
        <div *ngFor="let item of orgHolidayItemsArrayFalse" class="card holiday-card mb-3">
          <div class="d-flex gap-3 align-items-center">
            <div class="card holiday-icon-card">
              <img src="icons\holidays-icon.png" alt="Event Icon" class="holiday-icon" />
            </div>
            <div>
              <p class="holiday-name mb-0">{{ item.holidayName }}</p>
              <p class="date mb-0">
                {{ item.holidayDate | date : "EEEE, dd MMMM" }}
              </p>
            </div>
          </div>
        </div>
      </ng-container>

      <ng-template #noDataTemplate>
        <div class="no-data-wrapper">
          <app-no-data-found></app-no-data-found>
        </div>
      </ng-template>
    </ng-template>
  </div>
</div>
