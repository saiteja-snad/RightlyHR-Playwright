<div class="wizard-page-wrapper">
  <div class="wizard-page-header">
    <div class="header-info">
      <h4 class="page-title">Setup Wizard</h4>
      <p class="page-subtitle">
        {{ wizardService.completedCount() }} of {{ wizardService.totalCount() }} tasks completed
        ({{ wizardService.progressPercent() }}%)
      </p>
    </div>
    <button type="button" class="custom-btn btn-secondary" (click)="onBackToDashboard()">
      <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
    </button>
  </div>

  @if (!isCompletePage) {
    <div class="wizard-layout d-flex gap-3 w-100">
      <div class="wizard-left-nav">
        <app-setup-wizard-stepper />
      </div>
      <div class="wizard-right-content">
        <router-outlet />
      </div>
    </div>
  } @else {
    <div class="wizard-step-content">
      <router-outlet />
    </div>
  }
</div>
