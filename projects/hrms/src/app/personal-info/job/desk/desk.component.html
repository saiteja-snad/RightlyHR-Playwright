<div class="custom-main-component-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div><span class="component-sub-header">Desk Info</span></div>
    </div>
    <div class="custom-table-content mt-2">
      @if (!loading) {
        <table class="w-100">
            <thead>
                <tr>
                    <th>Desk ID</th>
                    <th>Desk Type</th>
                    <th>Desk Status</th>
                    <th class="text-center">Allocated Date</th>
                    <th class="text-center">Released Date</th>
                </tr>
            </thead>
            <tbody>
                <ng-container *ngIf="((deskdata | async) ?? []).length > 0; else noDataTemplate">
                    <tr *ngFor="let data of deskdata | async">
                        <td>{{ data.deskName }}</td>
                        <td>{{ data.deskType }}</td>
                        <td>{{ data.status }}</td>
                        <td class="text-center text-nowrap">{{ data.allocatedDate |dateformat }}</td>
                        <td class="text-center text-nowrap">{{ data.releavedDate ? (data.releavedDate | dateformat) : 'N/A' }}</td>
                    </tr>
                </ng-container>

                <ng-template #noDataTemplate>
                    <tr>
                        <app-no-data-found />
                    </tr>
                </ng-template>
            </tbody>
        </table>
      }
      @else {
        <app-data-loader-content/>
      }
    </div>
</div>
