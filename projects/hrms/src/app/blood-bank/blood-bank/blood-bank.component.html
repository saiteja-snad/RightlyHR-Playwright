<div class="custom-main-component-container">
    <div class="component-header-content pt-2">
        <div class="heading-content">
            <div class="component-header">Blood Blank</div>
            <!-- <div>
                <img src="\icons\moduelicon.png" alt="Icon" placement="bottom" [ngbPopover]="popContent"
                    class="module-icon">
            </div> -->
        </div>
    </div>
    <div>
        <div class="input-group custom-search mb-2">
            <span class="input-group-text custom-input-group-search" id="basic-addon1"><i
                    class="bi bi-search"></i></span>
            <input type="search" class="form-control custom-search-input" placeholder="Search Here"
                aria-label="Username" aria-describedby="basic-addon1">
        </div>
    </div>
    <div class="blood-bank-content">
       <div class="cards-container ">
         <div class="blood-bank-cards" *ngFor="let item of bloodBankData">
            <div class="d-flex gap-2" >
                <div class="blood-group-name">
                    <p class="name-text m-0">{{ item.bloodGroup }}</p>
                </div>
                <div class="sub-content">
                    <div class="name">{{ item.name }}</div>
                    <div class="email-text">
                        <i class="bi bi-envelope icon-colour me-1"></i>
                        {{ item.email }}
                    </div>
                </div>
            </div>
        </div>
       </div>
    </div>
</div>
