<div class="custom-main-component-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="heading-content py-2">
            <div class="commpoment-name">PMS <span class="ms-1"><i class="bi bi-chevron-double-right"></i></span></div>
            <div class="component-header">{{'My Performance Review' | translate}}</div>
            <div>
                <img src="\icons\moduelicon.png" alt="Icon" placement="bottom" [ngbPopover]="popContent" class="module-icon">
            </div>
        </div>
    </div>

    <!--Module Information-->
    <ng-template #popContent>
        <app-module-information [moduleInfo]="moduleinfo" />
    </ng-template>

    <!--PMS Tabs-->
    <div class="mb-3">
        <app-pms-tabs />
    </div>

    <div class="mb-3">
        <app-my-performance-tabs />
    </div>

    <div>
        <router-outlet />
    </div>
</div>
