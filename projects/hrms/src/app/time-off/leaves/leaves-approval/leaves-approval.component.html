<div class="custom-table-content mt-2">
    <table class="w-100">
        <thead>
            <tr>
                <th>Date</th>
                <th>Leave Type</th>
                <th>Duration</th>
                <th>Availed</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Reason</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>20/3/2027</td>
                <td>Sick Leaves </td>
                <td>1</td>
                <td>Full Day</td>
                <td>20/3/2027</td>
                <td>20/3/2027</td>

                <td>
                    <div>
                        <span>
                            <a type="button" placement="top" [ngbPopover]="reason">
                                <img src="images\info-fill.png" alt="info icon" class="info-icon">
                            </a>
                            <ng-template #reason>
                                <div>
                                    <p class="mb-0">Feaver </p>
                                </div>
                            </ng-template>
                        </span>
                    </div>
                </td>

                <td>waiting-for-approval</td>


            </tr>

        </tbody>
    </table>
</div>
<div class="pagination-content pt-2 w-100">
    <div class="d-flex justify-content-between align-items-center w-100 flex-wrap">
        <!-- Dropdown for Rows per Page -->
        <div class="d-flex align-items-center gap-3 p-2">
            <!-- Bootstrap Select -->
            <select class="form-select custom-pagination-select" [(ngModel)]="rows" (ngModelChange)="onRowsChange()">
                <option *ngFor="let option of options" [value]="option.value">{{ option.label }}
                </option>
            </select>
            <span class="pagination-label text-nowrap">Showing {{ first + 1 }} - {{ first + rows >
                totalRecords ? totalRecords : first + rows }} of {{ totalRecords }}</span>
        </div>
