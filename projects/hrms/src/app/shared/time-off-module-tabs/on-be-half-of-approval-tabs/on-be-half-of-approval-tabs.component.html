@if(!loading){
<div class="custom-sub-tabs-container">
  <ul
  class="nav flex-column"
  cdkDropList
  [cdkDropListData]="tabs"
  cdkDropListOrientation="vertical"
  appTabsDnd
  [tabsDndKey]="tabsKey"
  [tabsDndItems]="tabs"
  tabsDndIdProp="tabId"
  tabsDndRouteProp="link"
  >
    <li class="nav-item" *ngFor="let tab of tabs; trackBy: trackByTabId" cdkDrag cdkDragLockAxis="y" cdkDragBoundary=".component-left-tabs-container">
      <div class="nav-link" [routerLink]="tab.link" routerLinkActive="active-nav-link">
        <img [src]="tab.icon" alt="Icon" class="icon mb-2">
        <div class="d-flex gap-1">{{ tab.label }}
          <ng-container *ngIf="tab.label !== 'Entitlement Summary'">
            ({{ tab.count ?? 0 }})
          </ng-container>
        </div>
      </div>
      <div class="tabs-border-bottom"></div>
      <ng-template cdkDragPlaceholder>
        <li class="nav-item tabs-dnd-placeholder-item">
          <div class="nav-link tabs-dnd-placeholder"></div>
          <div class="tabs-border-bottom"></div>
        </li>
      </ng-template>
    </li>
  </ul>
</div>
}
@else {
<app-sidetabsloaders />
}
