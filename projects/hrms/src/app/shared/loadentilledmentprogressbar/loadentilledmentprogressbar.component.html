<div class="client-progress-bar-container">
    <div class="progress" role="progress" [ngClass]="{'active': progress}" aria-valuenow="33" aria-valuemin="0"
        aria-valuemax="100" [style.width.%]="progress * 50"></div>
    <div class="progress" role="progress" [ngClass]="{'inactive': progress}" aria-valuemin="0" aria-valuemax="100"
        [style.width.%]="100"></div>
    <div class="progress-content">
        <div class="d-flex justify-content-between">
            <div class="d-flex gap-2 step">
                <div class="progress-number">1</div>
                <div class="progress-name">Scope & Config</div>
            </div>
            <div class="d-flex gap-2 step" [ngClass]="{ 'inactive-step': progress < 2 }">
                <div class="progress-number">2</div>
                <div class="progress-name">Validation & Preview</div>
            </div>
            <div class="d-flex gap-2 step" [ngClass]="{ 'inactive-step': progress < 3 }">
                <div class="progress-number">3</div>
                <div class="progress-name">Execution & Monitor</div>
            </div>
        </div>
    </div>
</div>
