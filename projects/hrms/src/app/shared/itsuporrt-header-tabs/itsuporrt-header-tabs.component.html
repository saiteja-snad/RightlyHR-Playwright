<div class="component-nav-tabs-container card ">
    <p-tabs value="0" scrollable>
        <p-tablist>
            <ng-container *ngFor="let tab of filteredTabs;">
                <p-tab [value]="tab.link">
                    <a (click)="navigateToAccessedRoute(tab.link)" [class.active-nav-link]="isActiveRoute(tab.link)"
                    class="nav-link">
                        {{ tab.label }}
                    </a>
                </p-tab>
            </ng-container>
        </p-tablist>
    </p-tabs>
</div>
