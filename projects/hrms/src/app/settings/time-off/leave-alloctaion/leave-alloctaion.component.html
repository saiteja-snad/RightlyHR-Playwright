<div class="container-fluid dash">
    
  
    <div class="card settings-cards">
      <div class="row">
        <div class="col-lg-4 col-md-4">
          <div><span class="settings-heading">Leave Allocation</span></div>
        </div>
      </div>
      <hr>
      <div class="row">
        <div class="col-lg-4 ">
          <div class="mb-3 mt-2"><span class="settings-heading">Year</span></div>
  
          <select class="form-select" id="year" name="year" aria-label="Default select example" #year="ngModel"
            [(ngModel)]="Leavescat.year" required>
            <option [ngValue]="undefined" disabled>Select Year</option>
            <option *ngFor="let item of yearsList" [value]="item">
  
              {{item}} </option>
          </select>
  
  
        </div>
        <div class="col-lg-4 ">
          <div class="mb-3 mt-2"><span class="settings-heading">Location</span></div>
  
          <select class="form-select" id="jobLocation" name="jobLocation" aria-label="Default select example"
            #jobLocation="ngModel" [(ngModel)]="Leavescat.locationId"
            (change)=" onJobLocationChange($any($event.target).value)" [disabled]="!Leavescat.year" required>
            <option [ngValue]="undefined" disabled>Select Location</option>
            <option *ngFor="let item of locationDetails" [value]="item.id">
  
              {{item.jobLocationName}} </option>
          </select>
  
  
        </div>
  
        <div class="col-lg-4 ">
          <div class="mb-3 mt-2"><span class="settings-heading"> Sub Location</span></div>
  
          <select class="form-select" id="jobSubLocation" name="jobSubLocation" aria-label="Default select example"
            #jobSubLocation="ngModel" [(ngModel)]="Leavescat.subLocationId"
            (change)="getShiftDetailsBySubLocationId(Leavescat)" [disabled]="!Leavescat.locationId" required>
            <option [ngValue]="-1" disabled>Select Sub Location</option>
            <option *ngFor="let item of subLocationDetails" [value]="item.id">
              {{item.jobSubLocationName}}</option>
          </select>
        </div>
  
        <div class="col-lg-4 ">
          <div class="mb-3 mt-2"><span class="settings-heading"> Shift </span></div>
  
          <select class="form-select" id="shift" name="shift" aria-label="Default select example" #shift="ngModel"
            [(ngModel)]="Leavescat.shiftId" (change)="getLeaves(Leavescat)" [disabled]="!enableShift" required>
            <option [ngValue]="-1" disabled>Select Shift Name</option>
            <option *ngFor="let item of shiftDetails" [value]="item.id">
              {{item.shiftName}}</option>
          </select>
        </div>
  
        <div class="col-lg-4 col-md-4">
          <div class="mb-3 mt-2"><span class="settings-heading"> Category Name</span></div>
          <div>
            <select class="form-select" (change)="onCategoryName($any($event.target).value)" id="visatype" name="entity"
              aria-label="Default select example" #categoryName="ngModel" [(ngModel)]="Leavescat.categoryId"
              [disabled]="!enableCategory" required>
              <option disabled [ngValue]="-1" selected>Select Category Name</option>
              <option *ngFor="let item of Leaves" [value]="item.id">
                {{item.name}}</option>
            </select>
  
            <div *ngIf="categoryName.invalid && categoryName.touched" class="text-danger">
              Category Name is required
            </div>
          </div>
        </div>
  
      </div>
  
  
      <div class="mt-3 pt-3">
        <div class="table-scroll">
          <table>
            <thead>
              <th>GRADE</th>
              <th class="text-center">DAYS</th>
            </thead>
            <tbody>
              <tr *ngFor="let gr of grade">
                <td>{{gr.gradeName}}</td>
                <td class="text-center ">
                  <input type="number" class="form-control input2" autocomplete="off"
                    [(ngModel)]="accessLevels[gr.gradeId]" min="0" max="365" oninput="validity.valid||(value='')"
                    placeholder="No of days">
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="mt-2 mb-2">
        <button type="submit" (click)="policySubmit()" class="custom-btn btn-primary" style="float: right;">Save</button>
      </div>
    </div>
  
  </div>
  
  <!-- success message popup -->
  <div class="modal fade bgfade " id="successhide" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
    aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog  modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content d-flex flex-column justify-content-cenetr align-items-center pb-5">
        <i class="bi bi-check-circle-fill mt-4 mb-3"></i>
        <h4 class="text-center ps-3 pe-3 inactive-poptext">{{Status}}</h4>
      </div>
    </div>
  </div>
