<div class="custom-main-component-container">
    <div class="component-header-content">
        <div class="heading-content">
            <div class="commpoment-name">Expenses<span class="ms-2">>></span></div>
            <div class="component-header">My Expenses</div>
            <div>
                <img src="\icons\moduelicon.png" alt="Icon" placement="bottom" [ngbPopover]="popContent" class="module-icon">
            </div>
        </div>
   
        @if(rbac.allowedToAccess('Expenses Module.create')){
        <div>
            <button type="button" (click)="navigatetoAddExpenses()" class="custom-btn btn-primary">
                <i class="bi bi-plus me-2"></i>Add New Expense
            </button>
        </div>
        }
    </div>
           <!--Module Information-->
    <ng-template #popContent>
        <app-module-information [moduleInfo]="moduleinfo" />
    </ng-template>
  

    <div class="d-flex gap-3 w-100">
        <div class="component-left-tabs-container">
            <app-expenes-header-tabs />
        </div>

        <div class="component-right-content">
            <router-outlet />
        </div>
    </div>
</div>
