<div class="custom-main-component-container">
    <div class="component-header-content pt-2">
        <div class="heading-content">
            <div class="component-header">Phone Book </div>
            <!-- <div>
                <img src="\icons\moduelicon.png" alt="Icon" placement="bottom" [ngbPopover]="popContent"
                    class="module-icon">
            </div> -->

    </div>
    <div>
        <div class="input-group custom-search mb-2">
            <span class="input-group-text custom-input-group-search" id="basic-addon1"><i
                    class="bi bi-search"></i></span>
            <input type="search" class="form-control custom-search-input" placeholder="Search Here"

    <div class="phone-book-content">
        <div class="cards-container ">
            <div class="phone-book-cards">

                        <img src="images/alternate.png" alt="profile" class="profile-icon">
                    </div>
                    <div>
                        <p class="name pt-2 m-0">Srisharanya Mandaloji

                    </div>
                </div>
                <div class="sub-content p-3">
                    <p class="label-text mb-2"><span class="bi bi-person-vcard me-1"></span> <span
                            class="me-1">Designation</span>:
                        <span class="name-text me-1">UI/UX designer</span>
                    </p>
                    <p class="label-text mb-2"> <span class="bi bi-envelope  me-1"></span> <span class="me-1">Work
                            Email</span>:
                        <span class="name-text me-1 text-truncate "> ssuuuucccuuharanya.com</span>
                    </p>
                    <p class="label-text mb-2"> <span class="bi bi-telephone me-1"></span> <span
                            class="me-1">work</span>:
                        <span class="number-text me-1">99998888888</span>
                    </p>
                    <p class="label-text mb-2"> <span class="bi bi-telephone me-1"></span> <span
                            class="me-1">Personal</span>:
                        <span class="number-text me-1">99998888888</span>
                    </p>

            </div>
