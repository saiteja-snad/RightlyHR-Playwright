<div class="custom-main-popup-container">
    <div class="d-flex justify-content-between popup-header-border p-4">
        <div class="pt-2">
            <p class="popup-heading mb-0">Update Education Details</p>
        </div>
        <div>
            <a (click)="close()"><img src="/images/close.png" alt="Close Icon" class="close-icon"></a>
        </div>
    </div>
    <div class="custom-main-popup-content p-4">
        <form [formGroup]="educationForm" (ngSubmit)="updateEducation()">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="education" class="form-label custom-label mb-2">Education<span
                            class="text-danger">*</span></label>
                    <div class="custom-p-select-content">
                        <p-select [options]="degreeDetails" optionLabel="degreeName" optionValue="degreeName" id="education" formControlName="education" 
                          placeholder="Please select education" class="form-select custom-select"></p-select>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="university" class="form-label custom-label mb-2">University<span
                            class="text-danger">*</span></label>
                    <input type="text" class="form-control custom-input" id="university" formControlName="university">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="specialization" class="form-label custom-label mb-2">Specialization<span
                            class="text-danger">*</span></label>
                    <input type="text" class="form-control custom-input" id="specialization" formControlName="specialization">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="gpa" class="form-label custom-label mb-2">GPA<span class="text-danger">*</span></label>
                    <input type="text" class="form-control custom-input" id="gpa" formControlName="gpa">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="startDate" class="form-label custom-label mb-2">Start Date<span
                            class="text-danger">*</span></label>
                    <input type="date" class="form-control custom-input" id="startDate" formControlName="startDate">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="endDate" class="form-label custom-label mb-2">To Date<span
                            class="text-danger">*</span></label>
                    <input type="date" class="form-control custom-input" id="endDate" formControlName="endDate">
                </div>
                <div class="col-md-12 mb-3">
                    <label for="attachment" class="form-label custom-label mb-2">Attachment(Image and PDF only)<span
                            class="text-danger">*</span></label>
                    <input type="file" class="form-control custom-input" id="attachment" (change)="fileAttachment($event);fileChange($event)">
                    <div class="file-name my-1">
                        <span>File Name: {{getFileName(this.educationData.attachment)}}</span>
                    </div>
                </div>
            </div>
            <div class="d-flex justify-content-end gap-3 mt-4">
                <button type="reset" class="custom-btn btn-secondary" (click)="close()">Close</button>
                <button type="submit" class="custom-btn btn-primary" [disabled]="educationForm.invalid">Update</button>
            </div>
        </form>
    </div>
</div>
