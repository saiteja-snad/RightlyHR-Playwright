<div class="header-main-container">
    <div class="d-flex justify-content-between align-items-center">
        <!--Logo-->
        <div class="me-4">
            <img src="/logos/SNAD-horizontal-logo.png" alt="Company Logo" class="logo-image">
        </div>

        <div class="left-content">
            <div>
                <div *ngIf="isActive('myinfo')">
                    <app-myinfo-header-tabs />
                </div>
                <div *ngIf="isActive('personalinfo')">
                    <app-personalinfo-header-tabs />
                </div>
                <!-- <div *ngIf="isActive('/it-support')">
                    <app-itsuporrt-header-tabs />
                </div>
                <div *ngIf="isActive('settings')">
                    <app-settings-main-header-tabs />
                </div>
                <div *ngIf="showPmsTabs()">
                    <app-pms-tabs />
                </div>
                <div *ngIf="showPmsConfigurationTabs()">
                    <app-pms-settings-tabs />
                </div> -->
            </div>
        </div>

        <div class="d-flex right-content">
            <div class="dropdown">
                <a type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <img [src]="imageUrl ? imageUrl : 'images/alternate.png'" alt="Profile Image"
                        class="profile-img cursor">
                </a>
                <ul class="dropdown-menu custom-dropdown-menu">
                    @if(rbac.allowedToAccess('Invite New User.view')){
                    <li>
                        <a class="dropdown-item" (click)="navigateToAccessedRoute('/admin/active-new-user')">
                            <i class="bi bi-envelope-plus me-2"></i>Invite New User</a>
                    </li>
                    }
                    <li><a class="dropdown-item" [routerLink]="['/myinfo/personal/basic-info']">
                            <i class="bi bi-file-earmark-text-fill me-2"></i>View Profile</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
