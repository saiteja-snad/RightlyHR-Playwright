<div class="component-side-nav-tabs-container py-3">
    <ul class="nav flex-column">
        <li class="nav-item" *ngFor="let link of navTabs">
            <a class="nav-link" [routerLink]="[link.link]" routerLinkActive="active-nav-link">
                {{ link.label }} ({{ link.count}})
            </a>
        </li>
    </ul>
</div>
