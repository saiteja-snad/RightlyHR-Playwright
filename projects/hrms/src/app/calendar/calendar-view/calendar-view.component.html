<div class="custom-main-component-container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <p class="component-header cursor mb-0">Calendar</p>
    </div>
  </div>

  <!--Content-->
  <div class="d-flex gap-3 w-100">
    <!--sub tabs Content-->
    <div class="custom-component-left-content p-3">
      <div class="d-flex align-items-center mb-2">
        <div class="box WFH" [ngStyle]="{'background-color':  'rgb(143, 143, 204)'}"></div>
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="showBirthdays" [(ngModel)]="showBirthdays"
            (change)="filterEventsByTitle()">
          <label class="form-check-label" for="showBirthdays">
            <img src="calendar/birthday.png" alt="Birthday Image" class="custom-event-icon me-1">{{ 'Birthdays' | translate}}
          </label>
        </div>
      </div>

      <div class="d-flex align-items-center mb-2">
        <div class="box WFH" [ngStyle]="{'background-color':  'rgb(204, 143, 143)'}"></div>
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="showAnniversaries" [(ngModel)]="showAnniversaries"
            (change)="filterEventsByTitle()">
          <label class="form-check-label" for="showAnniversaries"><img src="calendar/milestone.png" alt="Mile Stone Icon" class="custom-event-icon me-1">{{ 'Anniversaries' | translate}}</label>
        </div>
      </div>

      <div class="d-flex align-items-center mb-2">
        <div class="box WFH" [ngStyle]="{'background-color':  'rgb(204, 204, 143)'}"></div>
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="showJoinees" [(ngModel)]="showJoinees"
            (change)="filterEventsByTitle()">
          <label class="form-check-label" for="showJoinees"><img src="calendar/new-joinees.png" alt="New Joinee icon" class="    ">{{ 'New Joinees' | translate }}</label>
        </div>
      </div>

      <div class="d-flex align-items-center mb-2">
        <div class="box WFH" [ngStyle]="{'background-color':  '#28692b4d'}"></div>
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="showHolidays" [(ngModel)]="showHolidays"
            (change)="filterEventsByTitle()">
          <label class="form-check-label" for="showHolidays">{{ 'Holidays' | translate }}</label>
        </div>
      </div>
    </div>

    <div class="custom-setting-right-content p-3">
      <full-calendar [options]="calendarOptions" [events]="eventsPromise | async">
        <ng-template #eventContent let-arg>
          <!-- <b *ngIf="arg.timeText" >{{ arg.timeText }}</b> -->
          <div>
            <span class="event-title m-0">{{ arg.event.title }}<img [src]="arg.event.display" alt="arg" class="ms-2"></span>
          </div>
        </ng-template>
      </full-calendar>
    </div>
  </div>
</div>
