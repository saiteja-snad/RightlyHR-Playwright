<div class="documents-grid-container">
    <div class="phone-book-card" *ngFor="let tab of navTabs" [routerLink]="tab.link">
        <div class="profile-content">
            <div>
                <img [src]="tab.icon" alt="profile" class="profile-icon">
            </div>
            <div>
                <p class="name text-truncate m-0">{{ tab.label }}</p>
            </div>
        </div>
        <div class="data-content">
            <p class="subject-text m-0">{{tab.subject}}</p>
        </div>
    </div>
</div>
