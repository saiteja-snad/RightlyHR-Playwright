<div class="custom-main-component-container mt-3">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <p class="component-header cursor mb-0">On Behalf Of</p>
        </div>
        <div class="d-flex gap-3">
            <label class=" employee-lable" for="">Select Employee</label>
            <div> <select class="form-select custom-select" aria-label="Default select example">
                    <option selected>Select Employee</option>
                    <option value="1">One</option>
                    <option value="2">Two</option>
                    <option value="3">Three</option>
                </select></div>
            <button type="button" class="custom-btn btn-primary" (click)="openModal(addleave)" *ngIf="rbac.allowedToAccess('On Behalf Of Tab.create')"><i
                    class="bi bi-plus me-2"></i>Apply Leave On Behalf
                Of</button>
        </div>
    </div>
    <div class="employee-fields-main-container d-flex gap-3 w-100">
        <div class="custom-component-left-content">
            <app-on-be-half-of-approval-tabs></app-on-be-half-of-approval-tabs>
        </div>
        <div class="custom-setting-right-content p-3">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>

<ng-template #addleave let-modal>
    <div class="custom-main-popup-container" ngbAutofocus>
        <div class="d-flex justify-content-between popup-header-border p-4">
            <div class="pt-2">
                <p class="popup-heading mb-0">Request Leave On Behalf Of</p>
            </div>
            <div>
                <a (click)="modal.dismiss()"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
            </div>
        </div>
        <div class="custom-main-popup-content p-4">
            <form action="">
                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Leave Type<span
                                class="text-danger">*</span></label>
                        <p-select [options]="leaveType" optionLabel="name" placeholder="Please select leave type"
                            class="form-select custom-select" />
                    </div>
                </div>
                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Start Date<span
                                class="text-danger">*</span></label>
                        <input type="date" class="form-control custom-input" id="exampleFormControlInput1">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">End Date<span
                                class="text-danger">*</span></label>
                        <input type="date" class="form-control custom-input" id="exampleFormControlInput1">
                    </div>

                </div>

                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label class="form-label custom-label mb-3">Availing<span class="text-danger">*</span></label>
                        <div class="d-flex gap-3">
                            <div class="form-check">
                                <input type="radio" class="form-check-input" id="halfDay" name="availing"
                                    value="Half Day">
                                <label class="form-check-label custom-label" for="halfDay">Half Day</label>
                            </div>
                            <div class="form-check">
                                <input type="radio" class="form-check-input" id="fullDay" name="availing"
                                    value="Full Day">
                                <label class="form-check-label custom-label" for="fullDay">Full Day</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label for="exampleFormControlInput1" class="form-label custom-label mb-2">Reason <span
                                class="text-danger">*</span></label>
                        <textarea class="form-control custom-input" id="exampleFormControlInput1"
                            placeholder="Please enter reason"></textarea>
                    </div>

                </div>
                <div class="d-flex justify-content-end gap-3 mt-4">
                    <button type="reset" class="custom-btn btn-secondary" (click)="modal.dismiss()">Close</button>
                    <button type="submit" class="custom-btn btn-primary">Request</button>
                </div>
            </form>
        </div>
    </div>
</ng-template>
