<div class="custom-main-component-container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <p class="component-header mb-0">My Info</p>
    </div>
    <div>
      @if(rbac.allowedToAccess('Change RM Button.view')) {
      <button class="custom-btn btn-primary" *ngIf="isActive('myinfo/team-members')"
        (click)="openModal(changermmodal)">Change RM</button>
      }
    </div>
  </div>

  <!--nav tabs content-->
  <div class="mb-3">
    <div *ngIf="isActive('myinfo/personal')">
      <app-my-info-personal-tabs />
    </div>
    <div *ngIf="isActive('myinfo/job' )">
      <app-myinfo-job-tabs />
    </div>
  </div>

  <div class="myinfo-main-container d-flex gap-4">
    <!--User profile content-->
    <div class="card user-profile-content p-3">
      <app-myinfo-details />
    </div>

    <!--main content-->
    <div class="card myinfo-main-content p-3">
      <router-outlet />
    </div>
  </div>
</div>

<ng-template #changermmodal let-modal>
  <div class="custom-main-popup-container" ngbAutofocus>
    <div class="custom-poup-header-content popup-header-border">
      <div class="pt-2">
        <p class="popup-heading mb-0">{{'Change RM'| translate}}</p>
      </div>
      <div>
        <a (click)="resetAndClose(modal)"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
      </div>
    </div>
    
    <div class="custom-main-popup-content">
      <form autocomplete="off" [formGroup]="teamForm" (ngSubmit)="updateTeamRM()">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label custom-label mb-2">
              {{'Select Team Member(s)'| translate}} <span class="text-danger">*</span>
            </label>
            <div class="custom-p-multiSelect-content">
              <p-multiSelect formControlName="teamMembers"  id="teamMembers" optionLabel="name" [options]="teamMembersdata"
                placeholder="Select Team Member(s)" esetFilterOnHide="true" class="w-100" multiple="true" filterBy="name" filter="true"
                (onChange)="onSelectManager($event, 'teamMembers')">
              </p-multiSelect>
            </div>
            <div class="error-msg" *ngIf="teamForm.get('teamMembers')?.invalid && teamForm.get('teamMembers')?.touched">
              Team Members is required
            </div>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label custom-label mb-2">{{'Select Reporting Manager' | translate}} <span
                class="text-danger">*</span></label>
            <div class="custom-p-select-content">
              <p-select formControlName="reportingManager" id="reportingManager" optionLabel="name" [options]="managers" filterBy="name" filter="true"
                placeholder="Select Reporting Manager" class="form-select custom-select"
                (onChange)="onSelectManager($event, 'reportingManager')">
              </p-select>
            </div>
            <div class="error-msg"
              *ngIf="teamForm.get('reportingManager')?.invalid && teamForm.get('reportingManager')?.touched">
              Reporting Manager is required
            </div>
          </div>
        </div>

        <!-- Buttons -->
        <div class="custom-modal-footer">
          <button type="reset" class="custom-btn btn-secondary" (click)="modal.dismiss();teamForm.reset()">{{'Close' |
            translate}}</button>
            <button type="submit" class="custom-btn btn-primary"[disabled]="teamForm.invalid || spinnerLoader">
              @if(spinnerLoader){
                  <div class="button-loader-content">
                      <span class="spinner-border button-spinner text-light" role="status" aria-hidden="true"></span>
                      <span>{{'Loading...'}}</span>
                  </div>
              }@else {
              <span>{{'Submit'| translate}}</span>
              }
          </button>
        </div>
      </form>
    </div>
  </div>
</ng-template>
