<div class="custom-main-component-container">
    <div class="main-content">
        <div class="mb-3">
            <!--personal info tabs-->
            <div *ngIf="isActive('/personalinfo')">
                <app-team-members-tabs />
            </div>
            <!--My info tabs-->
            <div *ngIf="isActive('/myinfo')">
                <app-my-info-team-numbers-tab />
            </div>
        </div>

        <div class="input-group custom-search mb-3">
            <span class="input-group-text custom-input-group-search" id="basic-addon1"><i class="bi bi-search"></i></span>
            <input type="search" class="form-control custom-search-input"
                placeholder="Search by employee id / employee name / work email / phone number" aria-label="Username"
                #search="ngModel" [(ngModel)]="searchValue" autocomplete="off" aria-describedby="basic-addon1">
        </div>

        <div class="custom-tree-table">
            <div *ngIf="teamMemberData | myteamsearch : searchValue : ['fusionEmpId','fullName','workEmail','contact'] as filteredMembers">
                <p-treetable #dt [value]="filteredMembers" [scrollable]="true" [tableStyle]="{'min-width':'60rem'}" (onNodeCollapse)="onCollapse($event)">
                    <!-- Table Header -->
                    <ng-template pTemplate="header">
                        <tr>
                            <!-- <th>
                                Employee ID
                                <i class="bi cursor" (click)="customSort('fusionEmpId')" [ngClass]="{
                                    'bi-arrow-up': currentSortField === 'fusionEmpId' && currentSortOrder === 1,
                                    'bi-arrow-down': currentSortField === 'fusionEmpId' && currentSortOrder === -1,
                                    'bi-arrow-down-up': currentSortField !== 'fusionEmpId'
                                }"></i>
                            </th> -->
                            <th ttSortableColumn="fusionEmpId" (click)="customSort('fusionEmpId')">
                                Employee ID
                                <p-treeTableSortIcon field="fusionEmpId"></p-treeTableSortIcon>
                            </th>
                            <th ttSortableColumn="fullName" (click)="customSort('fullName')">
                                Employee Name
                                <p-treeTableSortIcon field="fullName"></p-treeTableSortIcon>
                            </th>
                            <th ttSortableColumn="workEmail" (click)="customSort('workEmail')">
                                Work Email
                                <p-treeTableSortIcon field="workEmail"></p-treeTableSortIcon>
                            </th>
                            <th ttSortableColumn="contact" (click)="customSort('contact')">
                                Phone Number
                                <p-treeTableSortIcon field="contact"></p-treeTableSortIcon>
                            </th>
                        </tr>
                    </ng-template>
                    <!-- Table Body -->
                    <ng-template pTemplate="body" let-rowNode let-rowData="rowData">
                        <tr [ttRow]="rowNode">
                            <td>
                                <p-treetable-toggler [rowNode]="rowNode" /> {{ rowData.fusionEmpId }}
                            </td>
                            <td>
                                <a [ngClass]="{'data-nav-btn': rowData.isAccess}" (click)="rowData.isAccess && select(rowData)">{{ rowData.fullName }}</a>
                            </td>
                            <!-- <td>{{ rowData.fullName }}</td> -->
                            <td>{{ rowData.workEmail }}</td>
                            <td>{{ rowData.contact }}</td>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="emptymessage">
                        <tr>
                            <div class="nodata-tree-table">
                                <app-no-data-found />
                            </div>
                        </tr>
                    </ng-template>
                </p-treetable>
            </div>
        </div>
    </div>
</div>
