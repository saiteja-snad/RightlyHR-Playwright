<div class="custom-main-component-container">
    <div class="custom-card">
        <div class="card shadow mx-auto">

            <div class="off-heading-div pt-0">
                <span class="offBoarding-header pt-0">
                    Offboarding Details
                </span>
            </div>
            <!--heading ends-->
            <form autocomplete="off" [formGroup]="offBoardingForm" (ngSubmit)="postOffBoardingDetails()">

                <!-- Exit Reason -->
                <div class="mb-4">
                    <label class="form-label custom-label mb-2">Exit Reason<span class="text-danger">*</span></label>
                    <div class="custom-p-select-content">
                        <p-select [options]="terminationDetails" optionLabel="reason" formControlName="exit"
                            placeholder="Please select exit reason" class="form-select custom-select"></p-select>
                    </div>
                    <div class="error-msg"
                        *ngIf="offBoardingForm.get('exit')?.touched && offBoardingForm.get('exit')?.invalid">
                        Exit Reason is required
                    </div>
                </div>

                <!-- Eligible for Rehire -->
                <div class="mb-4">
                    <label class="form-label custom-label mb-2">Eligible For Rehire<span class="text-danger">*</span></label>
                    <div class="custom-p-select-content">
                        <p-select [options]="rehireDetails" optionLabel="eligibleforrehire1"
                            formControlName="eligiblefor" placeholder="Please select eligible for rehire"
                            class="form-select custom-select"></p-select>
                    </div>
                    <div class="error-msg"
                        *ngIf="offBoardingForm.get('eligiblefor')?.touched && offBoardingForm.get('eligiblefor')?.invalid">
                        Eligible for rehire is required
                    </div>
                </div>

                <!-- Status -->
                <div class="mb-4">
                    <label class="form-label custom-label mb-2">Status<span class="text-danger">*</span></label>

                    <div class="custom-p-select-content">
                        <p-select [options]="Statusdetails" optionLabel="statusname" formControlName="status"
                            placeholder="Please select status" class="form-select custom-select"></p-select>
                    </div>
                    <div class="error-msg"
                        *ngIf="offBoardingForm.get('status')?.touched && offBoardingForm.get('status')?.invalid">
                        Status is required
                    </div>
                </div>

                <!-- Last Working Day -->
                <div class="mb-4">
                    <label class="form-label custom-label mb-2">Last Working Day<span class="text-danger">*</span></label>
                    <input type="date" [min]="dateOfJoining" formControlName="lastdate" class="form-control custom-input" [max]="currentDate">
                    <div class="error-msg" *ngIf="offBoardingForm.get('lastdate')?.touched && offBoardingForm.get('lastdate')?.invalid">
                        Last Working Day is required
                    </div>
                    <div class="error-msg" *ngIf="islastworking">Last working day should be after date of joining</div>
                </div>

                <!-- Buttons -->
                <div class="d-flex justify-content-end gap-3 mt-4">
                    <button type="button" (click)="openModal(confirmationpopup)" class="custom-btn btn-secondary">Cancel</button>
                    <button type="submit" class="custom-btn btn-primary"
                        [disabled]="offBoardingForm.invalid || islastworking">Submit</button>
                </div>

            </form>


        </div>
    </div>

</div>
<ng-template #confirmationpopup let-model>
    <div class="result-popup-content" ngbAutofocus>
      <div>
        <img src="icons\reject.png" alt="failure icon" class="confirmation-delete-icon">
        <p class="confirmation-text mb-4">Are you sure you want to cancel?</p>
      </div>
  
      <div class="custom-modal-footer">
        <button type="button" (click)="model.dismiss()" class="custom-btn btn-secondary">No</button>
        <button type="submit" class="custom-btn btn-primary" (click)="cleardata();model.dismiss()">Yes</button>
      </div>
    </div>
  </ng-template>
