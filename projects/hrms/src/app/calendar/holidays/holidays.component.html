<div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <p class="component-header cursor mb-0">Holidays</p>
        </div>

        <div class="d-flex gap-2 align-items-center">
            <label class="form-label custom-label mt-2" for="">Select year:</label>
            <form [formGroup]="optionalholidaysform">
                <div class="custom-p-select-content">
                    <p-select formControlName="selectedYear" [options]="years" placeholder="Select Year"
                        class="form-select custom-select" (onChange)="onYearChange()">
                    </p-select>
                </div>
            </form>
        </div>
    </div>
</div>
