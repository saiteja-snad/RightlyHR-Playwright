<div class="custom-main-component-container">
    <div class="card contact-content-card p-4 mb-4">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <span class="contact-sub-header">Contact Details</span>
            </div>
            <div *ngIf="!buttons">
                <a (click)="enableForm()"><i class="bi bi-pencil-square"></i></a>
            </div>
            <div class="d-flex justify-content-end gap-3" *ngIf="buttons">
                <button type="reset" class="custom-btn btn-secondary" (click)="disableForm()">Close</button>
                <button type="submit" class="custom-btn btn-primary" [disabled]="contactForm.invalid" (click)="updateAddressInfo()" >Save</button>
            </div>
        </div>

        <!-- Reactive Form -->
        <div class="myinfo-input-content">
            <form [formGroup]="contactForm">
                <div class="row">
                    <div class="col-md-6 col-lg-4 mb-3">
                        <label for="workNumber" class="form-label custom-label mb-2">Work Number<span
                                class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="workNumber" formControlName="workNumber"
                            placeholder="Please enter work number">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-3">
                        <label for="phoneNumber" class="form-label custom-label mb-2">Phone Number <span
                                class="text-danger">*</span></label>
                        <input type="text" class="form-control custom-input" id="phoneNumber" formControlName="phoneNumber"
                            placeholder="Please enter phone number">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-3">
                        <label for="workMail" class="form-label custom-label mb-2">Work Mail<span
                                class="text-danger">*</span></label>
                        <input type="email" class="form-control custom-input" id="workMail" formControlName="workMail"
                            placeholder="Please enter work mail">
                    </div>
                    <div class="col-md-6 col-lg-4 mb-3">
                        <label for="personalEmail" class="form-label custom-label mb-2">Personal Email<span
                                class="text-danger">*</span></label>
                        <input type="email" class="form-control custom-input" id="personalEmail" formControlName="personalEmail"
                            placeholder="Please enter personal email">
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
