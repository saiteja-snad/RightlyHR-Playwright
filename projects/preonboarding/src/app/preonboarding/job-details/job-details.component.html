<div class="custom-main-component-container">
    <div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <img src="/icons/bag-icon.png" alt="bag icon" class="bag-icon me-2">
                <span class="job-name pt-1">{{jobApplicationData.jobRole}}</span>
            </div>
            <div>
                <span class="date">Requested Date : {{jobApplicationData.createddate | dateFormat}}</span>
            </div>
        </div>
        <div class="work-location mb-3">
            <i class="bi bi-geo-alt-fill me-2"></i><span>Work Location : {{jobApplicationData.lopcation}}, {{jobApplicationData.subLocation}}</span>
        </div>
    </div>
    <div class="d-flex justify-content-between py-4 gap-5">
        <div class="w-100 pt-2">
            <div class="progress-bar-container">
                <div class="progress-content w-100">
                    <div class="progress" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-bar" style="width: 100%"></div>
                    </div>
                </div>
                <div class="progress-details-content">
                    <div class="d-flex justify-content-between text-center">
                        <div>
                            <img src="{{completed}}" alt="check icon" class="progress-icon mb-3">
                            <p class="progress-text mb-0">Application Shortlisted</p>
                        </div>
                        <div>
                            <img src="{{documentsRequested}}" alt="check icon" class="progress-icon mb-3">
                            <p class="progress-text mb-0">Documents Requested</p>
                        </div>
                        <div>
                            <img src="{{documentsReview}}" alt="right Icon" class="progress-icon mb-3">
                            <p class="progress-text mb-0">Documents In Review</p>
                        </div>
                        <div>
                            <img src="{{offerLetter}}" alt="right Icon" class="progress-icon mb-3">
                            <p class="progress-text mb-0">Offer Letter</p>
                        </div>
                        <div>
                            <img src="{{onboarding}}" alt="hands icon" class="progress-icon mb-3">
                            <p class="progress-text mb-0">Waiting for Onboarding</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="text-nowrap">
            <button class="custom-btn btn-primary w-100 px-5" routerLink="/personal-details">Go To Application</button>
        </div>
    </div>
</div>
