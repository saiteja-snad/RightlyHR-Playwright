@if(!loading){
<div class="custom-sub-tabs-container">
    <ul
      class="nav flex-column"
      cdkDropList
      [cdkDropListData]="filteredNavLinks"
      cdkDropListOrientation="vertical"
      appTabsDnd
      [tabsDndKey]="tabsKey"
      [tabsDndItems]="filteredNavLinks"
      tabsDndIdProp="route"
      tabsDndRouteProp="route"
      tabsDndLabelProp="label"
    >
        <li class="nav-item" *ngFor="let tab of filteredNavLinks; trackBy: trackByNavLink" cdkDrag cdkDragLockAxis="y" cdkDragBoundary=".component-left-tabs-container">
            <div class="nav-link" (click)="navigateToAccessedRoute(tab.route)" [class.active-nav-link]="isActiveRoute(tab.route)">
                <img [src]="tab.icon" alt="Icon" class="icon mb-2">
                <div>{{ tab.label }}</div>
                <div class="count">
                    @if(tab.count && tab.count > 0) {({{ tab.count }})}
                    @else if(tab.label=='No Due Clearance Requests'){({{nodue_Request_data.length}})}
                    @else {(0)}
                </div>
            </div>
            <div class="tabs-border-bottom"></div>
            <ng-template cdkDragPlaceholder>
              <li class="nav-item tabs-dnd-placeholder-item">
                <div class="nav-link tabs-dnd-placeholder"></div>
                <div class="tabs-border-bottom"></div>
              </li>
            </ng-template>
        </li>
    </ul>
</div>
}
@else {
<app-sidetabsloaders />
}
