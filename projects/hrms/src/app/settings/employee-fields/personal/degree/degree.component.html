<div class="card main-settings-layout p-4">
    <!-- Add Input-->
    <div>
        <form [formGroup]="degreeFrom" (ngSubmit)="onSubmit()" >
        <div class="custom-settings-add-input input-group mb-5">
            <input type="text" class="form-control custom-input" placeholder="Please enter Degree"
                aria-label="salutation" aria-describedby="degree" formControlName ="degree">
            <span class="input-group-text"><button type="submit"
                    class="custom-btn btn-primary">{{'Add'|translate}}</button></span>
        </div>
        <div *ngIf="degreeFrom.get('degree')?.touched || degreeFrom.get('degree')?.dirty">
        
            <div *ngIf="degreeFrom.get('degree')?.hasError('required')" style="color: red; font-size: 16px;">
              Please add this The Degree .
            </div>
          </div>
          <div *ngIf="degreeFrom.get('degree')?.hasError('pattern')" style="color: red; font-size: 16px;">
            Only letters are allowed. Numbers and special characters are not permitted.
          </div>
        </form>
    </div>
    <!--Data Content-->
    <div>
        <div class="custom-settings-data-table">
            <table class="w-100">
                <thead>
                    <th class="col-span-2"></th>
                </thead>
                <tbody>
                    @for (degree of degreedetails ; track degree.sno) {

                    <tr >
                        <td class="w-75">{{degree.degreeName
                        }}</td>
                        <td class="w-25">
                            <div class="d-flex gap-4">
                                <!--Update-->
                                <div>
                                    <a (click)="openupdate(degree)"><img src="/settings-icon/edit.png" alt="edit icon"
                                            class="settings-common-icon"></a>
                                </div>
                                <!--Delete-->
                                <div>
                                    <a (click)="opendelete(degree)"><img src="/settings-icon/trash-2.png" alt="edit icon"
                                            class="settings-common-icon"></a>
                                </div>
                            </div>
                        </td>
                    </tr>
                }
                </tbody>
            </table>
        </div>
    </div>
</div>

<!--Update popup-->
<ng-template #updatepopup let-modal>
    <form [formGroup]="updateForm" (ngSubmit)="updateDegree()">
    <div class="custom-main-popup-container" ngbAutofocus>
        <div class="d-flex justify-content-between popup-header-border p-4">
            <div class="pt-2">
                <p class="popup-heading mb-0">{{'Update'|translate}}</p>
            </div>
            <div>
                <a (click)="close(modal)"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
            </div>
        </div>
        <div class="custom-main-popup-content p-5">
            <div class="mb-4">
                <label for="exampleFormControlInput1" class="form-label custom-label mb-2">{{'degree'|translate}}<span class="error-msg">*</span></label>
                <input type="text" class="form-control custom-input" id="degreeName" formControlName="degreeName"
                    placeholder="Please enter Degree">
            </div>
            <div class="d-flex gap-5 pt-4 w-100">
                <button class="custom-btn btn-secondary w-50 py-3"(click)="close(modal)">{{'Close'|translate}}</button>
                <button type="submit" class="custom-btn btn-primary w-50 py-3" [disabled]="updateForm.invalid">{{'Update'|translate}}</button>
            </div>
        </div>
   
   </div>
</form>
</ng-template>

<!--Delete Confirmation popup-->
<ng-template #deletepopup let-modal>
    <div class="modal-body" ngbAutofocus>
        <div class="custom-main-popup-content text-center p-4">
            <div class="py-5">
                <img src="/icons/delete-icon.png" alt="delete-icon" class="confirmation-icon mb-5">
                <p class="confirmation-text">{{'Are you sure you want to Delete?'|translate}}</p>
            </div>
            <div class="d-flex gap-5 pt-2 w-100">
                <button class="custom-btn btn-secondary w-50 py-3" (click)="modal.close()">{{'No'|translate}}</button>
               
                <button class="custom-btn btn-primary w-50 py-3" (click)="deleteDegree(updateDegreeDetails)">{{'yes'|translate}}</button> 

            </div>
        </div>
    </div>
</ng-template>
