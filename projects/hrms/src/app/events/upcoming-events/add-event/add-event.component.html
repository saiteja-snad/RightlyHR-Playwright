<div class="custom-main-popup-container">
    <div class="d-flex justify-content-between popup-header-border p-4">
        <div class="pt-2">
            <p class="popup-heading mb-0">Add Event</p>
        </div>
        <div>
            <a (click)="close()"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
        </div>
    </div>
    <div class="custom-main-popup-content p-4">
        <form action="">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="eventDate" class="form-label custom-label mb-2">Event Date<span
                            class="text-danger">*</span></label>
                    <input type="date" class="form-control custom-input" id="eventDate">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="title" class="form-label custom-label mb-2">Event Title<span
                            class="text-danger">*</span></label>
                    <input type="text" class="form-control custom-input" id="title"
                        placeholder="Please enter event title">
                </div>
                <div class="col-md-12 mb-3">
                    <label for="description" class="form-label custom-label mb-2">Event Description<span
                            class="text-danger">*</span></label>
                    <textarea class="form-control custom-input" placeholder="Please enter description"
                        id="description"></textarea>
                </div>
                <div class="col-md-12 mb-3">
                    <label for="file" class="form-label custom-label mb-2">Personal Email ID<span
                            class="text-danger">*</span></label>
                    <input type="file" class="form-control custom-input" id="file">
                </div>
            </div>
            <div class="d-flex justify-content-end gap-3 mt-4">
                <button type="reset" class="custom-btn btn-secondary" (click)="close()">Close</button>
                <button type="submit" class="custom-btn btn-primary">Add</button>
            </div>
        </form>
    </div>
</div>
