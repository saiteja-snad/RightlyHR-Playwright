<div class="custom-main-component-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div><span class="component-sub-header">Visa Details</span></div>
      <div class="custom-add-btn" (click)="openModal(addvisamodal)" ><i class="bi bi-plus plus-icon me-1"></i>Add New</div>
    </div>
    
    <div class="custom-table-content">
      <table class="w-100">
        <thead>
          <tr>
            <th>Education</th>
            <th>University</th>
            <th>Specialization</th>
            <th>GPA</th>
            <th>From Date</th>
            <th>To Date</th>
            <th>Document</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <!-- <tbody>
          <ng-container *ngIf="((educationData | async) ?? []).length > 0; else noDataTemplate">
          
          </ng-container>
        
          <ng-template #noDataTemplate>
            <tr>
              <td colspan="9"><app-no-data-found></app-no-data-found></td>
            </tr>
          </ng-template>
        </tbody> -->
      </table>
    </div>
  </div>
  

  <ng-template #addvisamodal let-modal>
    <div class="custom-main-popup-container" ngbAutofocus>
      <div class="custom-poup-header-content popup-header-border">
        <div >
          <p class="popup-heading mb-0">Add Visa Details</p>
        </div>
        <div>
          <a (click)="modal.dismiss()"><img src="icons/close.png" alt="Close Icon" class="close-icon"></a>
        </div>
      </div>
      <div class="custom-main-popup-content ">
        <form [formGroup]="visaForm">
         
    
            <div class="custom-modal-footer">
              <button type="reset" class="custom-btn btn-secondary"
                (click)="visaForm.reset();modal.dismiss()">Close</button>
              <button type="submit" class="custom-btn btn-primary" [disabled]="visaForm.invalid || spinnerLoader ">
                @if (spinnerLoader) {
                  <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                  <span>{{'Loading' | translate}}...</span>
                  } @else {
                  <span>{{'Add'| translate}}</span>
                  }
              </button>
            </div>
          </form>
      </div>
    </div>
  </ng-template>
