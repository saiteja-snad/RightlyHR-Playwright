<div class="custom-main-component-container">
  <!--Summary cards-->
  <div class="cards-grid-container mb-3">
    <div *ngFor="let card of summaryCards;">
      <div class="summary-card">
        <div class="summary-title mb-2">{{ card.title }}</div>
        <div class="summary-value">{{ card.value }}</div>
      </div>
    </div>
  </div>

  <!--Charts content-->
  <div class="chart-container mb-3">
    <div class="summary-card pic-chart-content">
      <div class="graph-header mb-3">Skill Proficiency</div>
      <div class="d-flex justify-content-center">
        <p-chart type="doughnut" [data]="skillLevelData" [options]="skillLevelOptions"></p-chart>
      </div>
    </div>

    <div class="summary-card pic-chart-content">
      <div class="graph-header mb-3">Skill Proficiency</div>
      <div class="d-flex justify-content-center">
        <p-chart type="doughnut" [data]="skillByDepartmentData" [options]="skillByDepartmentOptions"></p-chart>
      </div>
    </div>

    <div class="summary-card">
      <div class="graph-header mb-3">Top 5 Skills</div>
      <p-chart type="bar" [data]="topSkillsData" [options]="topSkillsOptions"></p-chart>
    </div>
  </div>

  <!--table content-->
  <div class="summary-card p-3 mb-3">
    <div class="custom-table-content">
      <table class="w-100">
        <thead>
          <th>Skill Name</th>
          <th>Employee Count</th>
          <th>Proficiency (Expert/Mid/Beginner)</th>
          <th>Action</th>
        </thead>
        <tbody>
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
