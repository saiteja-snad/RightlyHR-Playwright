<div class="sidenav-main-container">
    <div class="sidnav-main-content">
        <ul class="nav-items-list text-center ps-0">

            <!--Dashboard — always fixed first, not draggable-->
            @if(this.rbac.allowedToAccess('Dashboard.view')){
            <li class="nav-item menu-item-clear" (click)="goToAccessibleRoute('/dashboard');resetDropdown()"
                [class.active-nav-link]="isActiveRoute('/dashboard')">
                <img src="main-menu-icons/dashboard-square.png" alt="Icon" class="main-menu-icon">{{ 'Dashboard' | translate }}
            </li>
            }

            <!-- Main menu items — draggable list -->
            <li style="list-style:none;padding:0;margin:0;display:contents">
            <div cdkDropList [cdkDropListData]="mainMenuItems" (cdkDropListDropped)="onMainMenuDrop($event)" class="main-menu-drop-list">
                <div class="nav-item menu-item-clear draggable-nav-item"
                    *ngFor="let item of mainMenuItems"
                    cdkDrag
                    [class.active-nav-link]="isActiveItem(item)"
                    (cdkDragStarted)="closeOpenDropdowns()"
                    (click)="item.type === 'direct' ? onDirectItemClick(item) : null">

                    <!-- Direct navigation items -->
                    <ng-container *ngIf="item.type === 'direct'">
                        <img [src]="item.icon" alt="Icon" class="main-menu-icon">
                        {{ item.label | translate }}
                    </ng-container>

                    <!-- Dropdown items -->
                    <ng-container *ngIf="item.type === 'dropdown'">
                        <div class="btn-group dropend custom-main-menu-dropdown">
                            <div class="d-flex flex-column align-items-center" data-bs-toggle="dropdown" aria-expanded="false">
                                <img [src]="item.icon" alt="Icon" class="main-menu-icon">
                                {{ item.label | translate }}
                            </div>
                            <ul class="dropdown-menu">
                                <app-time-off-tabs *ngIf="item.dropdownComponent === 'time-off'" />
                                <app-project-management-main-tabs *ngIf="item.dropdownComponent === 'project-management'" />
                                <app-onbehalfof-main-tabs *ngIf="item.dropdownComponent === 'on-behalf-of'" />
                                <app-pending-approvals-tabs *ngIf="item.dropdownComponent === 'pending-approvals'" />
                                <app-pms-main-tabs *ngIf="item.dropdownComponent === 'pms'" />
                            </ul>
                        </div>
                    </ng-container>

                    <!-- Drag preview -->
                    <ng-template cdkDragPreview>
                        <div class="sidenav-drag-preview">
                            <div class="preview-icon-wrap">
                                <img [src]="item.icon" alt="" class="preview-icon">
                            </div>
                            <span class="preview-label">{{ item.label | translate }}</span>
                        </div>
                    </ng-template>
                    <ng-template cdkDragPlaceholder>
                        <div class="sidenav-drag-placeholder"></div>
                    </ng-template>
                </div>
            </div>
            </li>

            <!--Selected Item from the dropdown-->
            <li class="nav-item selected-module-item" *ngIf="selectedDropdownModule"
                (click)="goToAccessibleRoute(selectedDropdownModule.route)"
                [class.active-nav-link]="isActiveRoute(selectedDropdownModule.route)">
                <img [src]="selectedDropdownModule.activeIcon" alt="Icon" class="main-menu-icon">
                {{ selectedDropdownModule.label | translate }}
            </li>

            <!--Drop Menu Items — three-dot with draggable grid-->
            <li class="nav-item text-wrap align-items-center">
                <div class="btn-group dropend custom-main-menu-dropdown">
                    <a data-bs-toggle="dropdown" aria-expanded="false" class="custom-main-menu-toggle">
                        <img src="main-menu-icons/white-dots.png" alt="Icons" class="more-menu-icon">
                    </a>
                    <ul class="dropdown-menu">
                        <div class="grid-container"
                            cdkDropList
                            cdkDropListOrientation="mixed"
                            [cdkDropListData]="modules"
                            (cdkDropListDropped)="onThreeDotDrop($event)">
                            <div class="grid-item" *ngFor="let module of modules; let i = index"
                                cdkDrag
                                [style.display]="module.route === selectedDropdownModule?.route ? 'none' : ''"
                                (click)="selectDropdownModule(module)"
                                [ngClass]="getGridItemClasses(module)">
                                <img [src]="module.icon" alt="{{ module.label }}" class="dropdown-menu-icon" />
                                <p class="dropdown-menu-text m-0 pt-2">{{ module.label }}</p>
                                <ng-template cdkDragPreview>
                                    <div class="sidenav-drag-preview">
                                        <div class="preview-icon-wrap">
                                            <img [src]="module.icon" alt="" class="preview-icon">
                                        </div>
                                        <span class="preview-label">{{ module.label }}</span>
                                    </div>
                                </ng-template>
                                <ng-template cdkDragPlaceholder>
                                    <div class="sidenav-grid-placeholder"></div>
                                </ng-template>
                            </div>
                        </div>
                    </ul>
                </div>
            </li>

        </ul>
    </div>

    <!--Footer-->
    <div class="sidenav-footer-content">
        <div class="d-flex justify-content-center w-100">
            <img src="logos/powered-by.png" alt="Powered By logo" class="powered-by-image">
        </div>
    </div>
</div>
