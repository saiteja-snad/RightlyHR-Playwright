<div class="custom-main-component-container">
  <div class="component-header-content py-2">
    <div class="heading-content">
      <div class="component-header"> Contacts Directory </div>
      <div>
        <img src="\icons\moduelicon.png" alt="Icon" placement="bottom" [ngbPopover]="popContent" class="module-icon">
      </div>
    </div>
  </div>
  <!--Module Information-->
  <ng-template #popContent>
    <app-module-information [moduleInfo]="moduleinfo" />
  </ng-template>

  <div class="contact-directory-content">
    <div>
      @if (loading) {
      <!-- Skeleton for departments -->
      <div *ngFor="let skel of [1,2]" class="department-card mb-3">
        <div class="d-flex align-items-center gap-3 mb-3">
          <div class="img-content">
            <p-skeleton width="40px" height="40px" shape="circle"></p-skeleton>
          </div>
          <div>
            <p-skeleton width="160px" height="20px"></p-skeleton>
          </div>
        </div>
        <div class="grid-container">
          <!-- Skeleton for employee cards -->
          <div *ngFor="let empSkel of [1,2,3]" class="contact-card mb-3">
            <div class="d-flex align-items-center gap-3">
              <div>
                <p-skeleton width="36px" height="36px" shape="circle"></p-skeleton>
              </div>
              <div class="flex-grow-1">
                <p-skeleton width="100px" height="16px" styleClass="mb-2"></p-skeleton>
                <p-skeleton width="140px" height="14px" styleClass="mb-2"></p-skeleton>
                <p-skeleton width="100px" height="14px"></p-skeleton>
              </div>
            </div>
          </div>
        </div>
      </div>
      }
      @else {
      <div class="department-card mb-3" *ngFor="let dept of contactData">
        <div class="d-flex align-items-center gap-3 mb-3">
          <div class="img-content">
            <img src="/main-menu-icons/contact-directory-color-icon.png" alt="Icon" class="contact-img">
          </div>
          <div>
            <p class="department-name text-capitalize m-0">{{ dept.department }}</p>
          </div>
        </div>

        <div class="grid-container">
          <div class="contact-card" *ngFor="let item of dept.employees">
            <div class="d-flex align-items-center gap-3">
              <div>
                <img [src]="item.profileUrl" (error)="item.profileUrl = 'images/alternate.png'" alt="profile"
                  class="profile-icon">
              </div>
              <div>
                <p class="name m-0 mb-1">{{item.name}}</p>
                <p class="label-text text-truncate m-0 mb-1">
                  <span class="bi bi-envelope me-2"></span>
                  <span class="link-text ms-1">{{item.emailid}}</span>
                </p>
                <p class="label-text text-truncate m-0 mb-1">
                  <span class="bi bi-telephone me-2"></span>
                  <span class="link-text ms-1"><u>{{item.contactNumber}}</u></span>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
      }
    </div>
  </div>
</div>
